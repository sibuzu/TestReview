<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="絮絮叨叨整詞意思，瑣與鎖辨字，完整解釋對照"><rect width="900" height="300" fill="#faf8ed"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#294c48}.h{font-size:24px;font-weight:700}.w{font-size:27px;font-weight:700}.s{font-size:20px}</style><g id="meaning"><text x="150" y="36" class="h">絮絮叨叨</text><path d="M23 65 H208 Q223 65 223 80 V110 Q223 125 208 125 H63 L40 141 L46 125 H38 Q23 125 23 110 V80 Q23 65 38 65Z" fill="#e0eaf0" stroke="#8b9e92" stroke-width="2"/><text x="123" y="104" class="w">言語細碎</text><path d="M90 132 H275 Q290 132 290 147 V177 Q290 192 275 192 H130 L107 208 L113 192 H105 Q90 192 90 177 V147 Q90 132 105 132Z" fill="#e0eaf0" stroke="#8b9e92" stroke-width="2"/><text x="190" y="171" class="w">反覆不停</text><text x="150" y="271" class="w">說話囉唆，講個不停</text></g><g id="characters" transform="translate(300 0)"><text x="150" y="36" class="h">此處要寫「瑣」</text><rect x="17" y="62" width="125" height="180" rx="12" fill="#e0ebdf"/><rect x="158" y="62" width="125" height="180" rx="12" fill="#f1e3dc"/><text x="80" y="132" style="font-size:62px;font-weight:700">瑣</text><text x="220" y="132" style="font-size:62px;font-weight:700;fill:#a65746">鎖</text><text x="80" y="176" class="s">王字旁</text><text x="220" y="176" class="s">金字旁</text><text x="80" y="214" class="s">細小、零碎</text><text x="220" y="214" class="s">鎖具的鎖</text><text x="150" y="277" class="w">言語瑣碎</text></g><g id="complete" transform="translate(600 0)"><text x="150" y="36" class="h">完整解釋整個詞語</text><rect x="27" y="67" width="246" height="56" rx="12" fill="#e0ebdf"/><text x="150" y="104" class="w">言語瑣碎</text><text x="150" y="158" class="w">＋</text><rect x="27" y="183" width="246" height="56" rx="12" fill="#e0ebdf"/><text x="150" y="220" class="w">囉唆反覆不停</text><text x="150" y="277" class="s">不只回答單字「瑣」</text></g></svg>