<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="原句起終點、四個選項階段、完整代入比較"><rect width="900" height="300" fill="#faf7ed"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#294b48}.h{font-size:24px;font-weight:700}.w{font-size:25px}.s{font-size:20px}.good{fill:#3c7659}.bad{fill:#a65746}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7d9680"/></marker></defs><g id="context"><text x="150" y="32" class="h">原句的起點與終點</text><text x="150" y="67" class="s">人生由</text><rect x="25" y="84" width="250" height="52" rx="12" fill="#eadfc5"/><text x="150" y="119" class="w">［　］：起點</text><path d="M150 146V185" fill="none" stroke="#7d9680" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="200" width="250" height="52" rx="12" fill="#e6eddf"/><text x="150" y="235" class="w">步入晚年：終點</text><text x="150" y="281" class="s">空格不是再填終點</text></g><g id="options" transform="translate(300 0)"><text x="150" y="32" class="h">對照本題四個選項</text><rect x="25" y="49" width="250" height="52" rx="12" fill="#ebe9e1"/><text x="150" y="84" class="w">A 幼年</text><path d="M150 102V105" stroke="#7d9680" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="105" width="250" height="52" rx="12" fill="#ebe9e1"/><text x="150" y="140" class="w">B 青年</text><path d="M150 158V161" stroke="#7d9680" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="161" width="250" height="52" rx="12" fill="#d9e8d4"/><text x="150" y="196" class="w">C 中年</text><path d="M150 214V217" stroke="#7d9680" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="217" width="250" height="52" rx="12" fill="#e5eee2"/><text x="150" y="252" class="w">D 晚年</text></g><g id="substitution" transform="translate(600 0)"><text x="150" y="32" class="h">填回完整句子比較</text><text x="150" y="73" class="s bad">D 代入</text><rect x="25" y="87" width="250" height="52" rx="12" fill="#f0e1db"/><text x="150" y="122" class="w bad">由晚年步入晚年</text><text x="150" y="168" class="s bad">缺少階段的轉換</text><text x="150" y="209" class="s good">C 代入</text><rect x="25" y="222" width="250" height="52" rx="12" fill="#dcebd6"/><text x="150" y="257" class="w good">由中年步入晚年</text></g></svg>