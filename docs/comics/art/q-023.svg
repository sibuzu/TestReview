<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="東漢南朝作品早於唐，北宋歐陽修後於劉禹錫，僅表示朝代先後"><rect width="900" height="300" fill="#faf8ed"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#294c48}.h{font-size:23px;font-weight:700}.w{font-size:24px;font-weight:700}.s{font-size:20px}</style><g id="prior"><text x="150" y="32" class="h">三位前人，早於唐代</text><g class="prior-book"><rect x="21" y="52" width="258" height="65" rx="12" fill="#e0ebdf"/><text x="150" y="79" class="w">東漢　許慎</text><text x="150" y="105" class="s">《說文解字》</text></g><g class="prior-book"><rect x="21" y="131" width="258" height="65" rx="12" fill="#e0ebdf"/><text x="150" y="158" class="w">南朝宋　劉義慶</text><text x="150" y="184" class="s">《世說新語》</text></g><g class="prior-book"><rect x="21" y="210" width="258" height="65" rx="12" fill="#e0ebdf"/><text x="150" y="237" class="w">南朝梁　蕭統</text><text x="150" y="263" class="s">《昭明文選》</text></g></g><g id="anchor" transform="translate(300 0)"><text x="150" y="32" class="h">以書房主人的時代為準</text><rect x="30" y="61" width="240" height="160" rx="16" fill="#e0eaf0"/><text x="150" y="145" style="font-size:76px;font-weight:700">唐</text><text x="150" y="196" class="w">劉禹錫</text><text x="150" y="265" class="w">前人作品：時間上可能</text></g><g id="later" transform="translate(600 0)"><text x="150" y="32" class="h">D　後世作者的全集</text><rect x="24" y="57" width="252" height="53" rx="12" fill="#e0eaf0"/><text x="150" y="92" class="w">唐　劉禹錫</text><path d="M150 118 V143 M143 135 L150 144 L157 135" stroke="#a68369" stroke-width="3" fill="none"/><rect x="24" y="155" width="252" height="53" rx="12" fill="#f0e1db"/><text x="150" y="190" class="w">北宋　歐陽修</text><text x="150" y="247" class="w">歐陽文忠公全集</text><text x="150" y="281" class="s">劉禹錫生前不可能有</text></g></svg>