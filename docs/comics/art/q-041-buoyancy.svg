<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#287f9b"/></marker><marker id="w" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b47a39"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" fill="#344f47" text-anchor="middle"><text x="90" y="17" font-size="12">保麗龍球：浮於水面</text><path d="M25 92H155V149H25Z" fill="#dbeef3"/><path d="M25 43V149H155V43" fill="none" stroke="#849da3" stroke-width="2"/><path d="M25 92H71M109 92H155" stroke="#6d9bab" stroke-width="1.5"/><circle cx="90" cy="70" r="29" fill="#fff" stroke="#96aaa0" stroke-width="1.5"/><path d="M71 92A29 29 0 0 0 109 92Z" fill="#e1f1f5"/><path d="M90 70V35" stroke="#287f9b" stroke-width="2" marker-end="url(#b)"/><path d="M90 70V105" stroke="#b47a39" stroke-width="2" marker-end="url(#w)"/><text x="57" y="40" font-size="11" fill="#287f9b">浮力</text><text x="124" y="109" font-size="12" fill="#b47a39">W</text><text x="47" y="135" font-size="12">水</text><text x="90" y="169" font-size="15" font-weight="bold">F浮 = W</text></g>
<g transform="translate(180)" font-family="sans-serif" fill="#344f47" text-anchor="middle"><text x="90" y="17" font-size="12">鐵球：下沉中</text><path d="M25 57H155V149H25Z" fill="#dbeef3"/><path d="M25 43V149H155V43" fill="none" stroke="#849da3" stroke-width="2"/><path d="M25 57H155" stroke="#6d9bab" stroke-width="1.5"/><circle cx="90" cy="102" r="17" fill="#aab6bc" stroke="#667d89" stroke-width="1.5"/><path d="M90 102V84" stroke="#287f9b" stroke-width="2" marker-end="url(#b)"/><path d="M90 102V137" stroke="#b47a39" stroke-width="2" marker-end="url(#w)"/><text x="57" y="82" font-size="11" fill="#287f9b">浮力</text><text x="119" y="137" font-size="12" fill="#b47a39">W</text><text x="126" y="74" font-size="11">食鹽水</text><text x="90" y="169" font-size="15" font-weight="bold">F浮 &lt; W</text></g>
<g transform="translate(360)" font-family="sans-serif" fill="#344f47" text-anchor="middle"><text x="90" y="22" font-size="12">兩球重量同為 W</text><rect x="16" y="37" width="148" height="43" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="63" font-size="15" font-weight="bold">浮球浮力 = W</text><rect x="16" y="94" width="148" height="43" rx="9" fill="#e6edf0" stroke="#287f9b"/><text x="90" y="121" font-size="15" font-weight="bold">沉球浮力 &lt; W</text><text x="90" y="158" font-size="15" fill="#287f9b" font-weight="bold">浮球浮力較大</text><text x="90" y="175" font-size="8">忽略水阻；球體與箭頭比例僅示意</text></g></svg>
