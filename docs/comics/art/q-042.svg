<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547f97"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a4754f"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eef3e7"/><path d="M180 0h180v180H180Z" fill="#edf2f8"/><path d="M360 0h180v180H360Z" fill="#f7f0e3"/>
<text x="90" y="22" font-size="15">先算密度，再判浮沉</text><text x="90" y="46" font-size="13">體積都為40 cm³</text><g font-size="14"><text x="90" y="76">甲：30÷40＝0.75</text><text x="90" y="103">乙：20÷40＝0.50</text><text x="90" y="130">丙：10÷40＝0.25</text></g><text x="90" y="153" font-size="11">密度單位：g/cm³</text><text x="90" y="172" font-size="13">都小於水：1 g/cm³</text>
<text x="270" y="22" font-size="15">靜止漂浮：排水量不同</text><text x="270" y="43" font-size="11">等體積方塊示意</text><rect x="192" y="100" width="156" height="58" fill="#c4e3ef"/><path d="M192 63V158H348V63" fill="none" stroke="#829c9e" stroke-width="2"/><g fill="#d2dfc0" stroke="#788e76" stroke-width="1.5"><rect x="204" y="84" width="32" height="64"/><rect x="250" y="68" width="32" height="64"/><rect x="296" y="52" width="32" height="64"/></g><g fill="#87b5bc" opacity=".5"><rect x="204" y="100" width="32" height="48"/><rect x="250" y="100" width="32" height="32"/><rect x="296" y="100" width="32" height="16"/></g><path d="M192 100H204M236 100H250M282 100H296M328 100H348" stroke="#537f95" stroke-width="2"/><g font-size="13"><text x="220" y="106">甲</text><text x="266" y="90">乙</text><text x="312" y="74">丙</text></g><text x="270" y="175" font-size="12">排水體積：30、20、10 cm³</text>
<text x="450" y="22" font-size="15">漂浮時浮力＝重量</text><rect x="432" y="77" width="36" height="30" rx="3" fill="#d1dec0" stroke="#7c957f"/><text x="450" y="98" font-size="17">甲</text><path d="M450 75V45" stroke="#547f97" stroke-width="3" marker-end="url(#u)"/><path d="M450 109V139" stroke="#a4754f" stroke-width="3" marker-end="url(#d)"/><text x="450" y="39" font-size="12">浮力30 gw</text><text x="450" y="156" font-size="12">重量30 gw</text><text x="450" y="172" font-size="14">浮力：甲＞乙＞丙</text></g></svg>