<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="21" font-size="12">先找中心語 days</text><rect x="12" y="36" width="69" height="31" rx="7" fill="#f0e4ce" stroke="#b39863"/><rect x="99" y="36" width="69" height="31" rx="7" fill="#f0e4ce" stroke="#b39863"/><text x="46" y="58" font-size="16">warm</text><text x="134" y="58" font-size="16">sunny</text><path d="M46 73L70 93" fill="none" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><path d="M134 73L110 93" fill="none" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="100" width="100" height="42" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="128" font-size="24" font-weight="bold">days</text><text x="90" y="169" font-size="12">形容詞描述怎樣的日子</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="21" font-size="12">常見時間搭配對照</text><rect x="10" y="35" width="160" height="32" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="57" font-size="17"><tspan font-weight="bold">at</tspan> noon</text><text x="90" y="84" font-size="10">例如：某個時刻</text><rect x="10" y="93" width="160" height="32" rx="7" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="115" font-size="17"><tspan font-weight="bold">in</tspan> July</text><rect x="10" y="138" width="160" height="32" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="160" font-size="17"><tspan font-weight="bold">on</tspan> Monday</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">天氣形容詞相近，名詞不同</text><rect x="8" y="37" width="164" height="51" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="60" font-size="15" font-weight="bold">on warm sunny days</text><text x="90" y="79" font-size="11">有特徵的日子</text><rect x="8" y="111" width="164" height="48" rx="9" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="136" font-size="16" font-weight="bold">in warm weather</text><text x="90" y="153" font-size="10">中心語是 weather</text></g></svg>
