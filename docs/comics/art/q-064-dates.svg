<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" fill="#344f47" text-anchor="middle"><rect x="27" y="15" width="126" height="147" rx="5" fill="#fff" stroke="#84978c" stroke-width="2"/><text x="90" y="37" font-size="11">原圖可辨紀年</text><rect x="54" y="49" width="73" height="90" rx="8" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="74" font-size="17" font-weight="bold">民國</text><text x="90" y="99" font-size="17" font-weight="bold">三十六年</text><text x="90" y="125" font-size="18" fill="#3b8095">36</text><text x="90" y="153" font-size="9">僅摘錄年代，非重建整張史料</text></g>
