<g transform="translate(360)" font-family="sans-serif" fill="#344f47"><text x="90" y="20" font-size="12" text-anchor="middle">用年代篩選事件</text><rect x="8" y="99" width="164" height="33" rx="7" fill="#e8eedf" stroke="#718c7e"/><path d="M20 40V151" stroke="#bec9be" stroke-width="2"/><circle cx="20" cy="42" r="3" fill="#3b8095"/><text x="31" y="46" font-size="12" font-weight="bold">1915</text><text x="70" y="46" font-size="12">A 西來庵</text><circle cx="20" cy="76" r="3" fill="#3b8095"/><text x="31" y="80" font-size="12" font-weight="bold">1930</text><text x="70" y="80" font-size="12">B 霧社</text><circle cx="20" cy="114" r="3" fill="#3b8095"/><text x="31" y="118" font-size="12" font-weight="bold">1947</text><text x="70" y="118" font-size="12">D 二二八</text><circle cx="20" cy="147" r="3" fill="#3b8095"/><text x="31" y="151" font-size="12" font-weight="bold">1979</text><text x="70" y="151" font-size="12">C 美麗島</text><text x="90" y="172" font-size="9" text-anchor="middle">依先後排列，間距非年份比例</text></g></svg>
