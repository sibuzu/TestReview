<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dff2f8"/><stop offset="1" stop-color="#fff1d9"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#257ca4"/></marker></defs><rect width="600" height="600" rx="22" fill="url(#sky)"/><g font-family="Noto Sans CJK TC,sans-serif" font-size="30" text-anchor="middle" fill="#25444a"><text x="300" y="45" font-weight="bold">比較雨季的概念形狀</text><text x="300" y="81" font-size="23">非測站數據；柱高只示相對多寡</text><text x="305" y="116" font-size="29" font-weight="bold">全年少雨</text><path d="M145 132V208H520" fill="none" stroke="#5a7780" stroke-width="3"/><rect x="190" y="201" width="45" height="7" fill="#bc8f4b"/><text x="212" y="237" font-size="25">冬</text><rect x="275" y="203" width="45" height="5" fill="#bc8f4b"/><text x="297" y="237" font-size="25">春</text><rect x="360" y="205" width="45" height="3" fill="#bc8f4b"/><text x="382" y="237" font-size="25">夏</text><rect x="445" y="203" width="45" height="5" fill="#bc8f4b"/><text x="467" y="237" font-size="25">秋</text><text x="305" y="274" font-size="29" font-weight="bold">溫帶季風：夏雨</text><path d="M145 290V366H520" fill="none" stroke="#5a7780" stroke-width="3"/><rect x="190" y="356" width="45" height="10" fill="#5c9cb1"/><text x="212" y="395" font-size="25">冬</text><rect x="275" y="342" width="45" height="24" fill="#5c9cb1"/><text x="297" y="395" font-size="25">春</text><rect x="360" y="301" width="45" height="65" fill="#5c9cb1"/><text x="382" y="395" font-size="25">夏</text><rect x="445" y="341" width="45" height="25" fill="#5c9cb1"/><text x="467" y="395" font-size="25">秋</text><text x="305" y="432" font-size="29" font-weight="bold">地中海型：冬雨</text><path d="M145 448V524H520" fill="none" stroke="#5a7780" stroke-width="3"/><rect x="190" y="458" width="45" height="66" fill="#558ca5"/><text x="212" y="553" font