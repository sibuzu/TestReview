<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>清代以制度治理蒙古</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f6"/><text x="180" y="35" fill="#263e48" font-family="sans-serif" font-size="25" text-anchor="middle">不同部落分階段</text><path d="M32,185L330,185" fill="none" stroke="#7c9396" stroke-width="4" marker-end="url(#arr)" /><path d="M76.66666666666666,185L90,95" fill="none" stroke="#2877ad" stroke-width="2" /><circle cx="76.66666666666666" cy="185" r="7" fill="#2877ad"/><text x="90" y="90" fill="#2877ad" font-family="sans-serif" font-size="23" text-anchor="middle">1636</text><text x="90" y="120" fill="#263e48" font-family="sans-serif" font-size="21" text-anchor="middle">漠南蒙古</text><path d="M278.33333333333337,185L270,270" fill="none" stroke="#da8b26" stroke-width="2" /><circle cx="278.33333333333337" cy="185" r="7" fill="#da8b26"/><text x="270" y="265" fill="#da8b26" font-family="sans-serif" font-size="23" text-anchor="middle">1691</text><text x="270" y="295" fill="#263e48" font-family="sans-serif" font-size="21" text-anchor="middle">喀爾喀歸附</text><text x="180" y="335" fill="#647b80" font-family="sans-serif" font-size="18" text-anchor="middle">位置依年代先後與間距</text></svg>