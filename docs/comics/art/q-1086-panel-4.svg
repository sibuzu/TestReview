<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>以線性尺寸縮短整合shrink的字義</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f6"/><text x="180" y="35" fill="#263e48" font-family="sans-serif" font-size="25" text-anchor="middle">縮小＝become smaller</text><rect x="35" y="95" width="125" height="125" rx="5" fill="#6da9bd"/><rect x="255" y="160" width="55" height="55" rx="5" fill="#69a07d"/><path d="M170,157L235,157" fill="none" stroke="#a94c65" stroke-width="4" marker-end="url(#arr)" /><path d="M35,245L160,245" fill="none" stroke="#2877ad" stroke-width="3" /><path d="M255,245L310,245" fill="none" stroke="#308b6c" stroke-width="3" /><text x="98" y="285" fill="#263e48" font-family="sans-serif" font-size="24" text-anchor="middle">原先</text><text x="280" y="285" fill="#263e48" font-family="sans-serif" font-size="24" text-anchor="middle">後來</text><text x="180" y="335" fill="#263e48" font-family="sans-serif" font-size="23" text-anchor="middle">字義圖；非心臟測量</text></svg>