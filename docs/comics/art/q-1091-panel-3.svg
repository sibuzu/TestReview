<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>水中動物以觀賞解讀</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f6"/><text x="180" y="30" fill="#263e48" font-family="sans-serif" font-size="24" text-anchor="middle">觀賞海上鯨豚</text><rect x="10" y="220" width="340" height="100" rx="5" fill="#a5dce4"/><path d="M42 235Q95 140 175 160L205 110L272 205L320 235Z" fill="#7aaa7d" stroke="#447f66" stroke-width="3"/><path d="M65 275Q115 225 185 275L213 255L210 289L230 300Q185 320 65 275Z" fill="#5e91ae"/><path d="M120 257l12-30 17 29" fill="#5e91ae"/><text x="180" y="105" fill="#263e48" font-family="sans-serif" font-size="25" text-anchor="middle">只觀賞，不觸碰</text><path d="M60,160L120,245" fill="none" stroke="#2877ad" stroke-width="3" stroke-dasharray="5 6" /><text x="180" y="345" fill="#a94c65" font-family="sans-serif" font-size="26" text-anchor="middle">watch ≠ collect</text></svg>