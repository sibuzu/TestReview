<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#ad8647"/></marker><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6d16b"/><stop offset="1" stop-color="#e7c377"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edba70"/><stop offset="1" stop-color="#dc9454"/></linearGradient></defs><rect width="1080" height="360" fill="#f7f8ef"/><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">先認反應式兩側</text><rect x="23" y="79" width="137" height="104" rx="12" fill="#f0e0a4" stroke="#91a08a" stroke-width="2"/><text x="91" y="112" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">2CrO₄²⁻</text><text x="91" y="150" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">＋2H⁺</text><rect x="203" y="79" width="137" height="104" rx="12" fill="#f0d0a5" stroke="#91a08a" stroke-width="2"/><text x="271" y="112" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">Cr₂O₇²⁻</text><text x="271" y="150" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">＋H₂O</text><text x="180" y="134" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">⇌</text><text x="91" y="225" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">鉻酸根</text><text x="271" y="225" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#405c51">二鉻酸根</text><rect x="62" y="270" width="236" height="57" rx="12" fill="#e7edda" stroke="#91a08a" stroke-width="2"/><text x="180" y="306" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#405c51">H⁺在左側</text><g transform="translate(360 0)"><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">增加H⁺，平衡右移</text><path d="M44 121V251Q44 264 57 264H115Q128 264 128 251V121" fill="none" stroke="#78939b" stroke-width="4"/><path d="M48 165H124V251Q124 260 114 260H58Q48 260 48 251Z" fill="url(#yellow)"/><path d="M227 121V251Q227 264 240 264H298Q311 264 311 251V121" fill="none" stroke="#78939b" stroke-width="4"/><path d="M231 165H307V251Q307 260 297 260H241Q231 260 231 251Z" fill="url(#orange)"/><text x="87" y="93" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#405c51">H⁺增加</text><path d="M87 102V144M145 204H211" fill="none" stroke="#ad8647" stroke-width="3" marker-end="url(#a)"/><text x="180" y="188" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">向右</text><text x="180" y="311" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">鉻酸根減少</text><text x="180" y="342" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">不代表完全消失</text></g><g transform="translate(720 0)"><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">都有氯，不代表都供應H⁺</text><rect x="32" y="74" width="296" height="94" rx="12" fill="#e8dcc0" stroke="#91a08a" stroke-width="2"/><text x="180" y="103" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">氯化氫水溶液</text><text x="180" y="145" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#405c51">H⁺ ＋ Cl⁻</text><rect x="32" y="206" width="296" height="94" rx="12" fill="#e2e9df" stroke="#91a08a" stroke-width="2"/><text x="180" y="235" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">食鹽水溶液</text><text x="180" y="277" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#405c51">Na⁺ ＋ Cl⁻</text><text x="180" y="343" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#405c51">辨認的是H⁺，不是Cl⁻</text></g></svg>