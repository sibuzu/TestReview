<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f887a"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eff3e8"/><path d="M180 0h180v180H180Z" fill="#edf1f7"/><path d="M360 0h180v180H360Z" fill="#f8f0e2"/>
<text x="90" y="22" font-size="15">Each逐一看每一個人</text><g fill="#d9e4ce" stroke="#8fa384"><rect x="10" y="48" width="46" height="69" rx="5"/><rect x="67" y="48" width="46" height="69" rx="5"/><rect x="124" y="48" width="46" height="69" rx="5"/></g><g fill="#87a373"><circle cx="33" cy="76" r="14"/><circle cx="90" cy="76" r="14"/><circle cx="147" cy="76" r="14"/></g><g font-size="13"><text x="33" y="108">一位</text><text x="90" y="108">一位</text><text x="147" y="108">一位</text></g><text x="90" y="147" font-size="14">每位各自看成單數</text><text x="90" y="173" font-size="11">人數僅為示意</text>
<text x="270" y="22" font-size="15">核心是Each，不是you</text><rect x="193" y="45" width="77" height="36" rx="5" fill="#c3d8b1"/><text x="231" y="70" font-size="22">Each</text><path d="M274 63H290" stroke="#6f887a" marker-end="url(#a)"/><rect x="295" y="45" width="52" height="36" rx="5" fill="#c3d8b1"/><text x="321" y="70" font-size="22">has</text><rect x="217" y="109" width="106" height="35" rx="5" fill="#dae3ed"/><text x="270" y="133" font-size="20">of you</text><text x="270" y="171" font-size="12">of you補充是哪一群人</text>
<text x="450" y="22" font-size="15">換主詞，配對才不同</text><rect x="374" y="40" width="152" height="48" rx="5" fill="#c3d8b1"/><text x="450" y="61" font-size="18">Each ... has to</text><text x="450" y="80" font-size="12">每個人必須</text><rect x="374" y="108" width="152" height="48" rx="5" fill="#e7dcc5"/><text x="450" y="129" font-size="18">You ... have to</text><text x="450" y="148" font-size="12">你們必須</text><text x="450" y="177" font-size="12">本題主詞是Each of you</text></g></svg>