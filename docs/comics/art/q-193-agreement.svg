<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a193" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">先看 of 後的名詞</text><rect x="13" y="43" width="154" height="41" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="68" font-size="15">Some of his money</text><path d="M124 86V107" stroke="#b47a39" stroke-width="2"/><rect x="39" y="110" width="102" height="37" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="90" y="134" font-size="15">money</text><text x="90" y="173" font-size="11">不可數：視為單數</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">再看時間線索</text><path d="M14 91H165" stroke="#718c7e" stroke-width="2" marker-end="url(#a193)"/><circle cx="47" cy="91" r="5" fill="#b47a39"/><circle cx="130" cy="91" r="5" fill="#718c7e"/><text x="47" y="69" font-size="14" font-weight="bold">yesterday</text><text x="130" y="69" font-size="13">now</text><text x="47" y="117" font-size="12">昨天</text><text x="130" y="117" font-size="12">現在</text><rect x="23" y="135" width="134" height="32" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="90" y="157" font-size="14">is → was</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">同為 some，動詞仍可不同</text><rect x="9" y="43" width="162" height="42" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="68" font-size="16">money → was</text><rect x="9" y="105" width="162" height="42" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="131" font-size="16">coins → were</text><text x="90" y="173" font-size="10">coins 是延伸比較，不改原句</text></g></svg>