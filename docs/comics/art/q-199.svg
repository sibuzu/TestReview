<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eff3e8"/><path d="M180 0h180v180H180Z" fill="#edf1f7"/><path d="M360 0h180v180H360Z" fill="#f8f0e2"/>
<text x="90" y="22" font-size="15">抓住前後兩項事實</text><rect x="14" y="40" width="152" height="45" rx="5" fill="#d9e4cf"/><text x="90" y="59" font-size="13">爸爸已試著叫他起床</text><text x="90" y="79" font-size="16">好幾次</text><text x="90" y="110" font-size="14">Jimmy卻仍然</text><rect x="14" y="123" width="152" height="40" rx="5" fill="#c2d7af"/><text x="90" y="149" font-size="16">不肯起床吃早餐</text>
<text x="270" y="22" font-size="15">實際結果違反預期</text><rect x="212" y="38" width="116" height="30" rx="5" fill="#d9e2ec"/><text x="270" y="59" font-size="14">爸爸多次努力</text><path d="M270 71L224 98" stroke="#a9b5b4" stroke-dasharray="4 3" fill="none"/><path d="M270 71L317 98" stroke="#7c967b" fill="none"/><g font-size="12"><text x="224" y="115">通常預期</text><text x="317" y="115">實際結果</text></g><rect x="190" y="127" width="68" height="31" rx="4" fill="#e1e6e9"/><rect x="281" y="127" width="68" height="31" rx="4" fill="#c2d7af"/><text x="224" y="148" font-size="15">會起床</text><text x="315" y="148" font-size="15">仍不肯</text><text x="270" y="175" font-size="11">雖然努力，卻未有預期結果</text>
<text x="450" y="22" font-size="15">要表達的是讓步關係</text><g font-size="15"><rect x="374" y="37" width="152" height="28" rx="4" fill="#c2d7af"/><text x="416" y="57">although</text><text x="494" y="57">讓步</text><rect x="374" y="73" width="152" height="28" rx="4" fill="#e8ddc5"/><text x="416" y="93">because</text><text x="494" y="93">原因</text><rect x="374" y="109" width="152" height="28" rx="4" fill="#e8ddc5"/><text x="416" y="129">if</text><text x="494" y="129">條件</text><rect x="374" y="145" width="152" height="28" rx="4" fill="#e8ddc5"/><text x="416" y="165">until</text><text x="494" y="165" font-size="12">時間界線</text></g></g></svg>