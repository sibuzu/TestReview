<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#a18c5c"/></marker></defs><rect width="1080" height="360" fill="#f7f8ef"/><text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">先定位本題時段</text><path d="M70 65V314" stroke="#94aa90" stroke-width="4"/><circle cx="70" cy="90" r="9" fill="#f7f8ef" stroke="#889b7e" stroke-width="3"/><text x="156" y="87" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">1912</text><text x="209" y="115" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">清帝退位</text><circle cx="70" cy="170" r="9" fill="#f7f8ef" stroke="#889b7e" stroke-width="3"/><text x="156" y="167" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">1916</text><text x="209" y="195" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">袁世凱去世</text><rect x="102" y="235" width="221" height="85" rx="12" fill="#f0dfb8" stroke="#91a086" stroke-width="2"/><text x="213" y="267" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#a26f31">1917～1925</text><text x="213" y="300" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#405c51">本題：廣東建政</text><circle cx="70" cy="276" r="10" fill="#c29756"/><g transform="translate(360 0)"><text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">回文章找共同線索</text><rect x="39" y="69" width="282" height="61" rx="12" fill="#e6eddb" stroke="#91a086" stroke-width="2"/><text x="180" y="106" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">北方：軍閥林立</text><rect x="39" y="155" width="282" height="61" rx="12" fill="#e6eddb" stroke="#91a086" stroke-width="2"/><text x="180" y="192" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">南方：軍閥牽制</text><path d="M321 100H340V242L250 263M180 216V263" fill="none" stroke="#a18c5c" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="266" width="230" height="61" rx="12" fill="#f0dfb8" stroke="#91a086" stroke-width="2"/><text x="180" y="304" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#a26f31">軍閥勢力</text></g><g transform="translate(720 0)"><text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">人物相同，時期不同</text><rect x="28" y="66" width="304" height="66" rx="12" fill="#edf0e3" stroke="#91a086" stroke-width="2"/><text x="180" y="92" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">清末</text><text x="180" y="120" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">反清革命</text><rect x="28" y="151" width="304" height="66" rx="12" fill="#edf0e3" stroke="#91a086" stroke-width="2"/><text x="180" y="177" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">袁世凱掌權時</text><text x="180" y="205" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">反袁</text><rect x="28" y="236" width="304" height="66" rx="12" fill="#f0dfb8" stroke="#91a086" stroke-width="2"/><text x="180" y="262" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">本題1917～1925</text><text x="180" y="290" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#a26f31">對抗軍閥</text></g></svg>