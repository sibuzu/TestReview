<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#eef3e8"/><g fill="#dfe8d4"><rect x="12" y="16" width="156" height="39" rx="5"/><rect x="12" y="66" width="156" height="39" rx="5"/><rect x="12" y="116" width="156" height="28" rx="5"/></g><text x="90" y="32" font-size="12">清廷內閣總理</text><text x="90" y="48" font-size="12">北洋軍隊統領</text><text x="90" y="82" font-size="12">第二任臨時大總統</text><text x="90" y="98" font-size="12">首任正式大總統</text><text x="90" y="134" font-size="12">後來企圖稱帝</text><text x="90" y="171" font-size="16">主角：袁世凱</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#f7efdf"/><path d="M60 36V149" stroke="#9caa96" stroke-width="2"/><circle cx="60" cy="46" r="4" fill="#bb9250"/><circle cx="60" cy="95" r="4" fill="#7c8d82"/><circle cx="60" cy="144" r="4" fill="#8da6ae"/><g font-size="12"><text x="28" y="50">1915</text><text x="28" y="99">1916</text><text x="28" y="148">1917</text></g><text x="119" y="41" font-size="12">C接受</text><text x="119" y="58" font-size="12">部分要求</text><text x="119" y="99" font-size="12">袁世凱去世</text><text x="119" y="137" font-size="11">A廣州護法</text><text x="119" y="153" font-size="11">B中國參戰</text><text x="90" y="177" font-size="11">A、B都在袁去世後</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#edf1f7"/><text x="90" y="22" font-size="12">1912年</text><rect x="14" y="31" width="152" height="48" rx="5" fill="#c9dce7"/><text x="90" y="51" font-size="14">《臨時約法》</text><text x="90" y="70" font-size="12">限制總統權力</text><text x="90" y="100" font-size="12">1914年</text><rect x="14" y="109" width="152" height="48" rx="5" fill="#e3cba4"/><text x="90" y="129" font-size="13">《中華民國約法》</text><text x="90" y="149" font-size="12">擴張總統職權</text><text x="90" y="17