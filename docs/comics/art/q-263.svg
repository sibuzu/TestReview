<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b18b4c"/></marker></defs><rect width="1080" height="360" fill="#f7f8ef"/><text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">甲：承諾優待的一方</text><rect x="70" y="69" width="220" height="66" rx="12" fill="#dce8ed" stroke="#8c9e8c" stroke-width="2"/><text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#405c51">中華民國</text><path d="M180 138V211" stroke="#b18b4c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="180" y="178" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">撥款、優待</text><rect x="70" y="227" width="220" height="67" rx="12" fill="#f1dfb9" stroke="#8c9e8c" stroke-width="2"/><text x="180" y="267" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">退位清室</text><text x="180" y="336" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">生活待遇，不是統治權</text><g transform="translate(360 0)"><text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">乙：交出統治權的一方</text><rect x="70" y="69" width="220" height="66" rx="12" fill="#f1dfb9" stroke="#8c9e8c" stroke-width="2"/><text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#405c51">清帝國</text><path d="M180 138V211" stroke="#b18b4c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="180" y="178" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">統治權公諸全國</text><rect x="70" y="227" width="220" height="67" rx="12" fill="#dfe9d5" stroke="#8c9e8c" stroke-width="2"/><text x="180" y="267" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">定為共和</text><text x="180" y="336" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">保留尊號，不等於仍掌政</text></g><g transform="translate(720 0)"><text x="180" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">清帝國 ≠ 中華帝國</text><rect x="30" y="66" width="300" height="94" rx="12" fill="#e4ecda" stroke="#8c9e8c" stroke-width="2"/><text x="180" y="96" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">1912年</text><text x="180" y="133" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">清帝退位，接受共和</text><path d="M180 167V205" fill="none" stroke="#b18b4c" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="216" width="300" height="93" rx="12" fill="#eee2c9" stroke="#8c9e8c" stroke-width="2"/><text x="180" y="248" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#405c51">1915～1916年</text><text x="180" y="283" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#405c51">袁世凱稱帝：中華帝國</text><text x="180" y="343" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">不同事件，不同國名</text></g></svg>