<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240"><title>核素表示法：質量數13、原子序6，13為6加7</title><rect width="240" height="240" fill="#faf8ef"/><text x="140" y="118" text-anchor="middle" font-family="sans-serif" font-size="62" fill="#294c44">X</text><text x="95" y="83" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#294c44">13</text><text x="95" y="139" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#294c44">6</text><path d="M85 64H110M85 153H110" stroke="#365f9c" stroke-width="2"/><text x="120" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#294c44">13 = 6 + 7</text></svg>