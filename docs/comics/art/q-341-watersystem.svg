<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="石門水庫位在大漢溪，屬於淡水河水系的三步示意"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#4089ad"/></marker><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#23453e;font-size:12px;font-weight:600}.small{font-size:10px;fill:#567466}.big{font-size:14px;fill:#14638e}.line{fill:none;stroke:#428cae;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.box{fill:#fff;stroke:#8eae9b;stroke-width:1.5}</style></defs><rect width="540" height="180" fill="#f8faf4"/>
<!-- 1: reservoir and barrier, a conceptual section, not a measured profile -->
<text x="90" y="20" text-anchor="middle">直接攔蓄：大漢溪</text><path d="M6 111L34 54L53 88L76 47L102 110L131 67L174 113V162H6Z" fill="#d3e2bf"/><path d="M8 128Q37 118 53 120Q78 114 131 117L131 146H7Z" fill="#8fc8df"/><path d="M7 127Q57 121 126 120" class="line"/><path d="M130 107L141 107L146 151H125Z" fill="#9daaa1" stroke="#587265" stroke-width="2"/><path d="M145 145L174 145" class="line"/><path d="M22 126H56" stroke="#428cae" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="103" class="big">大漢溪</text><text x="81" y="143" text-anchor="middle">石門水庫</text><path d="M144 105L158 83" stroke="#637a6d"/><text x="153" y="76" text-anchor="middle" class="small">大壩</text><text x="90" y="175" text-anchor="middle" class="small">概念示意，非實際剖面</text>
<!-- 2: membership; nested sets don't pretend reservoir is a tributary -->
<text x="270" y="20" text-anchor="middle">水系包含主流與支流</text><rect x="191" y="35" width="158" height="124" rx="14" fill="#e3eff6" stroke="#4e8bb1" stroke-width="2"/><text x="270" y="57" text-anchor="middle" class="big">淡水河水系</text><rect x="206" y="70" width="128" height="75" rx="10" fill="#e9f1dc" stroke="#76945c" stroke-width="1.6"/><text x="270" y="92" text-anchor="middle">支流：大漢溪</text><rect x="222" y="104" width="96" height="28" rx="7" fill="#fff" stroke="#8c9f83"/><text x="270" y="123" text-anchor="middle">石門水庫</text><text x="270" y="175" text-anchor="middle" class="small">所在支流與所屬水系分層看</text>
<!-- 3: choice comparison emphasizes watershed not downstream location -->
<text x="450" y="20" text-anchor="middle">從選項辨識水系</text><rect x="376" y="34" width="148" height="30" rx="7" fill="#dbeccc" stroke="#638353" stroke-width="2"/><text x="450" y="54" text-anchor="middle" class="big">A 淡水河</text><rect x="376" y="73" width="148" height="23" rx="6" class="box"/><text x="450" y="89" text-anchor="middle">B 蘭陽溪</text><rect x="376" y="103" width="148" height="23" rx="6" class="box"/><text x="450" y="119" text-anchor="middle">C 大甲溪</text><rect x="376" y="133" width="148" height="23" rx="6" class="box"/><text x="450" y="149" text-anchor="middle">D 濁水溪</text><text x="450" y="175" text-anchor="middle" class="small">本題未將大漢溪列為選項</text>
</svg>