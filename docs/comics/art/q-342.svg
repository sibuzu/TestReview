<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="b" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#4d96af"/></marker></defs><rect x="0" width="180" height="180" fill="#eaf1ed"/><g font-family="sans-serif"><text x="90" y="16" text-anchor="middle" font-size="11" fill="#365b50">谷地：V 尖朝高處</text><text x="90" y="32" text-anchor="middle" font-size="9" fill="#365b50">上方較高</text><path data-terrain="valley" data-height="300" data-vertex="90,45" data-edge-y="75" d="M30 75L90 45L150 75" fill="none" stroke="#a68f64" stroke-width="2"/><text x="18" y="78" text-anchor="middle" font-size="8" fill="#846a40">300</text><path data-terrain="valley" data-height="200" data-vertex="90,75" data-edge-y="105" d="M30 105L90 75L150 105" fill="none" stroke="#a68f64" stroke-width="2"/><text x="18" y="108" text-anchor="middle" font-size="8" fill="#846a40">200</text><path data-terrain="valley" data-height="100" data-vertex="90,105" data-edge-y="135" d="M30 135L90 105L150 135" fill="none" stroke="#a68f64" stroke-width="2"/><text x="18" y="138" text-anchor="middle" font-size="8" fill="#846a40">100</text><path d="M90 38V150" stroke="#4d96af" stroke-width="3" marker-end="url(#b)"/><text x="90" y="165" text-anchor="middle" font-size="10" fill="#365b50">水沿谷地向下匯流</text><text x="90" y="178" text-anchor="middle" font-size="8" fill="#365b50">示例高度，非原圖實測數值</text></g><rect x="180" width="180" height="180" fill="#f3eedf"/><g font-family="sans-serif"><text x="270" y="16" text-anchor="middle" font-size="11" fill="#365b50">山脊：V 尖朝低處</text><text x="270" y="32" text-anchor="middle" font-size="9" fill="#365b50">上方較高</text><path data-terrain="ridge" data-height="300" data-vertex="270,75" data-edge-y="45" d="M210 45L270 75L330 45" fill="none" stroke="#a68f64" stroke-width="2"/><text x="198" y="48" text-anchor="middle" font-size="8" fill="#846a40">300</text><path data-terrain="ridge" data-height="200" data-vertex="270,105" data-edge-y="75" d="M210 75L270 105L330 75" fill="none" stroke="#a68f64" stroke-width="2"/><text x="198" y="78" text-anchor="middle" font-size="8" fill="#846a40">200</text><path data-terrain="ridge" data-height="100" data-vertex="270,135" data-edge-y="105" d="M210 105L270 135L330 105" fill="none" stroke="#a68f64" stroke-width="2"/><text x="198" y="108" text-anchor="middle" font-size="8" fill="#846a40">100</text><path d="M270 81L220 125" stroke="#4d96af" stroke-width="2.5" marker-end="url(#b)"/><path d="M270 81L320 125" stroke="#4d96af" stroke-width="2.5" marker-end="url(#b)"/><text x="270" y="165" text-anchor="middle" font-size="10" fill="#365b50">水向兩側低處分流</text><text x="270" y="178" text-anchor="middle" font-size="8" fill="#365b50">示例高度，非原圖實測數值</text></g><rect x="360" width="180" height="180" fill="#e9efdf"/><g font-family="sans-serif"><text x="450" y="19" text-anchor="middle" font-size="10" fill="#365b50">回原圖判斷採樣條件</text><rect x="368" y="35" width="164" height="31" rx="5" fill="#d8e3ce"/><text x="450" y="56" text-anchor="middle" font-size="10" fill="#365b50">甲、乙、丁：較符合谷地</text><rect x="368" y="78" width="164" height="31" rx="5" fill="#e0d2b4"/><text x="450" y="99" text-anchor="middle" font-size="10" fill="#365b50">丙：高地伸出的脊部</text><rect x="368" y="121" width="164" height="31" rx="5" fill="#c2d7ab"/><text x="450" y="142" text-anchor="middle" font-size="10" fill="#365b50">最不可能直接採水：C</text><text x="450" y="177" text-anchor="middle" font-size="9" fill="#365b50">脊部 ≠ 必在集水區之外</text></g></svg>