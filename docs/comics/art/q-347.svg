<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="b" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#507f95"/></marker></defs><rect x="0" width="180" height="180" fill="#e8f0f2"/><g font-family="sans-serif"><text x="99" y="17" text-anchor="middle" font-size="10" fill="#35564f">本島在島的哪一側？</text><text x="26" y="31" text-anchor="middle" font-size="11" fill="#35564f">北</text><path d="M26 78V42" stroke="#507f95" stroke-width="2" marker-end="url(#b)"/><rect x="92" y="49" width="80" height="27" rx="4" fill="#c5ddcf"/><text x="132" y="67" text-anchor="middle" font-size="12" fill="#35564f">龜山島</text><rect x="8" y="124" width="88" height="28" rx="4" fill="#c8d5b3"/><text x="52" y="143" text-anchor="middle" font-size="12" fill="#35564f">蘭陽平原</text><path data-direction="island-to-plain" data-start="125,82" data-end="68,118" d="M125 82L68 118" stroke="#507f95" stroke-width="3" marker-end="url(#b)"/><text x="137" y="141" text-anchor="middle" font-size="10" fill="#35564f">西～西南</text><text x="90" y="176" text-anchor="middle" font-size="8" fill="#35564f">方位關係示意，非比例地圖</text></g><rect x="180" width="180" height="180" fill="#f6eddf"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#35564f">等高距相同：線密處較陡</text><text x="221" y="42" text-anchor="middle" font-size="10" fill="#35564f">較密、較陡</text><text x="313" y="42" text-anchor="middle" font-size="10" fill="#35564f">較疏、較緩</text><path data-density="dense" data-level="50" data-x="18" d="M198 56Q202 87 198 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><path data-density="dense" data-level="100" data-x="29" d="M209 56Q213 87 209 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><path data-density="dense" data-level="150" data-x="40" d="M220 56Q224 87 220 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><path data-density="dense" data-level="200" data-x="51" d="M231 56Q235 87 231 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><text x="198" y="136" text-anchor="middle" font-size="8" fill="#35564f">50</text><text x="231" y="136" text-anchor="middle" font-size="8" fill="#35564f">200</text><path data-density="sparse" data-level="50" data-x="103" d="M283 56Q287 87 283 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><path data-density="sparse" data-level="100" data-x="123" d="M303 56Q307 87 303 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><path data-density="sparse" data-level="150" data-x="143" d="M323 56Q327 87 323 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><path data-density="sparse" data-level="200" data-x="163" d="M343 56Q347 87 343 120" stroke="#a68e64" stroke-width="1.7" fill="none"/><text x="283" y="136" text-anchor="middle" font-size="8" fill="#35564f">50</text><text x="343" y="136" text-anchor="middle" font-size="8" fill="#35564f">200</text><text x="270" y="159" text-anchor="middle" font-size="9" fill="#35564f">相同圖尺與等高距的比較</text><text x="270" y="177" text-anchor="middle" font-size="8" fill="#35564f">高度為示例，不重畫原島形</text></g><rect x="360" width="180" height="180" fill="#edf1e6"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#35564f">方向和地形，兩條件一起看</text><rect x="368" y="35" width="164" height="28" rx="4" fill="#dce4d0"/><text x="450" y="54" text-anchor="middle" font-size="11" fill="#35564f">西至西南：朝本島一側</text><rect x="368" y="82" width="164" height="28" rx="4" fill="#dce4d0"/><text x="450" y="101" text-anchor="middle" font-size="11" fill="#35564f">臨海、等高線密集</text><rect x="368" y="131" width="164" height="28" rx="4" fill="#bfd5ad"/><text x="450" y="150" text-anchor="middle" font-size="11" fill="#35564f">原圖丙最符合 → C</text><text x="450" y="75" text-anchor="middle" font-size="16" fill="#35564f">＋</text><text x="450" y="122" text-anchor="middle" font-size="16" fill="#35564f">↓</text><text x="450" y="177" text-anchor="middle" font-size="8" fill="#35564f">800 公尺是坑道長，不是射程</text></g></svg>