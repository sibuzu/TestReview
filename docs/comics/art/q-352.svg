<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#729b88"/></marker></defs><rect x="0" width="180" height="180" fill="#edf2e9"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="11" fill="#34564d">開頭：提出整體主張</text><circle cx="90" cy="55" r="23" fill="#bfd4ad"/><text x="90" y="63" text-anchor="middle" font-size="24" fill="#34564d">合</text><path d="M90 81V99" stroke="#729b88" stroke-width="2" marker-end="url(#a)"/><rect x="9" y="105" width="162" height="46" rx="5" fill="#d5e3c8"/><text x="90" y="124" text-anchor="middle" font-size="13" fill="#34564d">諷、直一也</text><text x="90" y="143" text-anchor="middle" font-size="11" fill="#34564d">關鍵在如何運用</text><text x="90" y="174" text-anchor="middle" font-size="8" fill="#34564d">是共同議題，不是第一個事例</text></g><rect x="180" width="180" height="180" fill="#f8efe1"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#34564d">中段：兩例分說</text><rect x="249" y="30" width="42" height="28" rx="5" fill="#d9c99e"/><text x="270" y="50" text-anchor="middle" font-size="18" fill="#34564d">分</text><path d="M270 58V69M224 79V69H316V79" fill="none" stroke="#729b88" stroke-width="2"/><rect x="185" y="85" width="77" height="49" rx="5" fill="#e6ddc8"/><text x="223.5" y="105" text-anchor="middle" font-size="10" fill="#34564d">伍舉進隱語</text><text x="223.5" y="125" text-anchor="middle" font-size="10" fill="#34564d">楚王淫益甚</text><rect x="278" y="85" width="77" height="49" rx="5" fill="#e6ddc8"/><text x="316.5" y="105" text-anchor="middle" font-size="10" fill="#34564d">茅焦解衣危論</text><text x="316.5" y="125" text-anchor="middle" font-size="10" fill="#34564d">秦帝立悟</text><text x="270" y="158" text-anchor="middle" font-size="9" fill="#34564d">兩個不同事例，支持同一論點</text><text x="270" y="176" text-anchor="middle" font-size="8" fill="#34564d">分說不等於只數人物數量</text></g><rect x="360" width="180" height="180" fill="#edf1e5"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#34564d">結尾：回到運用之術</text><circle cx="450" cy="55" r="23" fill="#bfd4ad"/><text x="450" y="63" text-anchor="middle" font-size="24" fill="#34564d">合</text><path d="M450 81V99" stroke="#729b88" stroke-width="2" marker-end="url(#a)"/><rect x="369" y="105" width="162" height="46" rx="5" fill="#d5e3c8"/><text x="450" y="125" text-anchor="middle" font-size="12" fill="#34564d">顧用之之術何如耳</text><text x="450" y="143" text-anchor="middle" font-size="10" fill="#34564d">再次重申共同立場</text><text x="450" y="174" text-anchor="middle" font-size="10" fill="#34564d">首尾呼應：合 → 分 → 合</text></g></svg>