<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4c8068"/></marker></defs><rect x="2" y="2" width="196" height="196" rx="7" fill="#faf8ee" stroke="#b9cbbf"/><rect x="202" y="2" width="196" height="196" rx="7" fill="#faf8ee" stroke="#b9cbbf"/><rect x="402" y="2" width="196" height="196" rx="7" fill="#faf8ee" stroke="#b9cbbf"/><text x="100" y="23" font-family="Noto Sans CJK TC,sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">saw：過去看見</text><path d="M22 94H180" stroke="#608a72" stroke-width="2" marker-end="url(#a)"/><circle cx="62" cy="94" r="5" fill="#a98366"/><circle cx="155" cy="94" r="5" fill="#608a72"/><text x="62" y="69" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">I saw him</text><text x="155" y="122" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">現在</text><text x="76" y="136" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">今早看見他</text><text x="100" y="174" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">時間點在過去</text><text x="300" y="23" font-family="Noto Sans CJK TC,sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">看到時，談話正在持續</text><path d="M220 89H380" stroke="#b9d7b7" stroke-width="16" stroke-dasharray="5 3"/><path d="M236 89H364" stroke="#b9d7b7" stroke-width="16"/><path d="M300 59V136" stroke="#a98366" stroke-width="2"/><circle cx="300" cy="89" r="5" fill="#a98366"/><text x="300" y="51" font-family="Noto Sans CJK TC,sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">was talking</text><text x="300" y="153" font-family="Noto Sans CJK TC,sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">when I saw him</text><text x="300" y="182" font-family="Noto Sans CJK TC,sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">不表示談話被打斷</text><text x="500" y="23" font-family="Noto Sans CJK TC,sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">再核對主詞與be</text><rect x="420" y="46" width="160" height="39" rx="7" fill="#e6edf3" stroke="#b9cbbf"/><text x="500" y="66" font-family="Noto Sans CJK TC,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">Kevin：單數</text><path d="M500 89V111" stroke="#608a72" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="125" width="160" height="47" rx="7" fill="#dcebdc" stroke="#b9cbbf"/><text x="500" y="149" font-family="Noto Sans CJK TC,sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">was talking</text></svg>