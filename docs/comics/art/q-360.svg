<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#244b50">回原圖讀價格趨勢</text><path d="M31 130L159 130" fill="none" stroke="#879f92" stroke-width="1.5"/><path d="M31 130L31 41" fill="none" stroke="#879f92" stroke-width="1.5"/><text x="15" y="38" text-anchor="middle" font-size="9" fill="#244b50">價</text><text x="166" y="143" text-anchor="middle" font-size="9" fill="#244b50">年</text><path d="M41 119L64 110" fill="none" stroke="#78995d" stroke-width="2.5"/><path d="M64 110L90 101" fill="none" stroke="#78995d" stroke-width="2.5"/><path d="M90 101L120 82" fill="none" stroke="#78995d" stroke-width="2.5"/><path d="M120 82L149 47" fill="none" stroke="#78995d" stroke-width="2.5"/><circle cx="41" cy="119" r="2.5" fill="#a87e3e"/><circle cx="64" cy="110" r="2.5" fill="#a87e3e"/><circle cx="90" cy="101" r="2.5" fill="#a87e3e"/><circle cx="120" cy="82" r="2.5" fill="#a87e3e"/><circle cx="149" cy="47" r="2.5" fill="#a87e3e"/><text x="47" y="148" text-anchor="middle" font-size="9" fill="#244b50">2006後</text><text x="145" y="148" text-anchor="middle" font-size="9" fill="#244b50">2012</text><text x="90" y="166" text-anchor="middle" font-size="10" fill="#244b50">大致上升，後段更明顯</text><text x="90" y="179" text-anchor="middle" font-size="8" fill="#244b50">趨勢示意，非數值重繪</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#244b50">B如何接到供給與價格？</text><rect x="192" y="35" width="156" height="30" rx="5" fill="#dce8d0"/><text x="270" y="55" text-anchor="middle" font-size="10" fill="#244b50">若過捕使野生資源減少</text><path d="M270 67L270 84" fill="none" stroke="#879f92" stroke-width="1.5"/><path d="M266 79L270 84" fill="none" stroke="#879f92" stroke-width="1.5"/><path d="M274 79L270 84" fill="none" stroke="#879f92" stroke-width="1.5"/><rect x="192" y="88" width="156" height="30" rx="5" fill="#dce8d0"/><text x="270" y="108" text-anchor="middle" font-size="10" fill="#244b50">可取得的鰻苗供給減少</text><path d="M270 120L270 137" fill="none" stroke="#879f92" stroke-width="1.5"/><path d="M266 132L270 137" fill="none" stroke="#879f92" stroke-width="1.5"/><path d="M274 132L270 137" fill="none" stroke="#879f92" stroke-width="1.5"/><rect x="192" y="141" width="156" height="30" rx="5" fill="#dce8d0"/><text x="270" y="161" text-anchor="middle" font-size="10" fill="#244b50">其他條件相同，價格易升</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#244b50">合理解釋 ≠ 證明唯一原因</text><rect x="372" y="34" width="156" height="30" rx="5" fill="#f8f7ef"/><text x="450" y="54" text-anchor="middle" font-size="10" fill="#244b50">A 本地搶購：題幹未說</text><rect x="372" y="73" width="156" height="30" rx="5" fill="#f8f7ef"/><text x="450" y="93" text-anchor="middle" font-size="10" fill="#244b50">C 育種升質：沒有依據</text><rect x="372" y="112" width="156" height="30" rx="5" fill="#f8f7ef"/><text x="450" y="132" text-anchor="middle" font-size="10" fill="#244b50">D 特定越界：圖無事件</text><text x="450" y="165" text-anchor="middle" font-size="11" fill="#244b50">依原題野生苗情境選B</text><text x="450" y="179" text-anchor="middle" font-size="8" fill="#244b50">不把歷史目前當永久結論</text></g></svg>