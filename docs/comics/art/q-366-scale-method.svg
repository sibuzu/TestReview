<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f4f7ef"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294c42">
<text x="90" y="21" font-size="13" font-weight="700">沿主流彎曲逐段量</text>
<path d="M66 110Q48 78 56 54M111 85Q129 63 154 51M134 120Q143 144 158 146" fill="none" stroke="#b3c5bc" stroke-width="3"/>
<path d="M18 130C37 127 28 99 54 105S78 124 88 101S110 74 118 98S140 136 160 112" fill="none" stroke="#b97845" stroke-width="4"/>
<path d="M18 130L160 112" stroke="#7e9bab" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="18" cy="130" r="4" fill="#b97845"/><circle cx="160" cy="112" r="4" fill="#b97845"/>
<text x="87" y="146" font-size="11" fill="#527a91">直線距離 ≠ 河道長</text><text x="91" y="169" font-size="10">量法示意，非實際河道圖</text>
<text x="270" y="21" font-size="13" font-weight="700">把比例尺線當一段</text>
<path d="M204 73V63M204 73H336M336 73V63" stroke="#416354" stroke-width="3" fill="none"/><text x="204" y="51" font-size="16">0</text><text x="336" y="51" font-size="16" font-weight="700">A</text><text x="270" y="96" font-size="13">一段代表 A 公里</text>
<rect x="194" y="112" width="152" height="47" rx="6" fill="#e2eacf" stroke="#93aa84"/><text x="270" y="132" font-size="13">若河長相當 k 段</text><text x="270" y="151" font-size="16" font-weight="700">k × A ≈ 186.6</text>
<text x="450" y="21" font-size="13" font-weight="700">用主流全長回代選項</text>
<text x="409" y="43" font-size="12">一段公里</text><text x="494" y="43" font-size="12">需幾段</text>
<path d="M375 50H527" stroke="#b2c1a8"/><rect x="373" y="77" width="156" height="25" rx="4" fill="#d7e5c3"/>
<text x="409" y="70" font-size="14">5</text><text x="494" y="70" font-size="14">37.3</text>
<text x="409" y="95" font-size="15" font-weight="700">40</text><text x="494" y="95" font-size="15" font-weight="700">4.7</text>
<text x="409" y="120" font-size="14">80</text><text x="494" y="120" font-size="14">2.3</text>
<text x="409" y="145" font-size="14">120</text><text x="494" y="145" font-size="14">1.6</text>
<text x="450" y="171" font-size="10">段數＝186.6 ÷ 一段公里</text>
</g></svg>