<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#244b50">里程是位置，距離要相減</text><path d="M27 72L153 72" stroke="#759384" stroke-width="3" fill="none"/><path d="M27 62L27 82" stroke="#8ba193" stroke-width="1.5" fill="none"/><text x="27" y="51" text-anchor="middle" font-size="14" fill="#244b50">197</text><path d="M153 62L153 82" stroke="#8ba193" stroke-width="1.5" fill="none"/><text x="153" y="51" text-anchor="middle" font-size="14" fill="#244b50">198</text><path d="M27 96L153 96" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M27 90L27 101" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M153 90L153 101" stroke="#8ba193" stroke-width="1.5" fill="none"/><text x="90" y="119" text-anchor="middle" font-size="12" fill="#244b50">198 − 197 = 1公里</text><text x="90" y="149" text-anchor="middle" font-size="12" fill="#244b50">不是197：198</text><text x="90" y="176" text-anchor="middle" font-size="9" fill="#244b50">距離關係示意，非實測圖</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#244b50">先統一成公分</text><rect x="192" y="35" width="156" height="30" rx="5" fill="#dce8d0"/><text x="270" y="55" text-anchor="middle" font-size="12" fill="#244b50">1公里</text><path d="M270 67L270 84" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M266 79L270 84" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M274 79L270 84" stroke="#8ba193" stroke-width="1.5" fill="none"/><rect x="192" y="88" width="156" height="30" rx="5" fill="#dce8d0"/><text x="270" y="108" text-anchor="middle" font-size="12" fill="#244b50">1,000公尺</text><path d="M270 120L270 137" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M266 132L270 137" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M274 132L270 137" stroke="#8ba193" stroke-width="1.5" fill="none"/><rect x="192" y="141" width="156" height="30" rx="5" fill="#dce8d0"/><text x="270" y="161" text-anchor="middle" font-size="12" fill="#244b50">100,000公分</text><text x="312" y="78" text-anchor="middle" font-size="10" fill="#244b50">×1,000</text><text x="312" y="131" text-anchor="middle" font-size="10" fill="#244b50">×100</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#244b50">圖上距離：實地距離</text><rect x="372" y="34" width="156" height="30" rx="5" fill="#dce7ef"/><text x="450" y="54" text-anchor="middle" font-size="15" fill="#244b50">10：100,000</text><text x="450" y="85" text-anchor="middle" font-size="11" fill="#244b50">兩邊同除以10</text><path d="M450 90L450 107" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M446 102L450 107" stroke="#8ba193" stroke-width="1.5" fill="none"/><path d="M454 102L450 107" stroke="#8ba193" stroke-width="1.5" fill="none"/><rect x="372" y="115" width="156" height="30" rx="5" fill="#dce8d0"/><text x="450" y="135" text-anchor="middle" font-size="17" fill="#244b50">1：10,000</text><text x="450" y="173" text-anchor="middle" font-size="10" fill="#244b50">單位一致，才可以約分</text></g></svg>