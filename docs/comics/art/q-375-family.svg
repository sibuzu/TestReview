<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#4b8790"/></marker><marker id="b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b39863"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="21" font-size="12">本題描述的居住方式</text><path d="M99 57L134 31L169 57V135H99Z" fill="#e8eedf" stroke="#718c7e" stroke-width="2"/><text x="134" y="65" font-size="11">女方家</text><rect x="111" y="80" width="46" height="31" rx="7" fill="white" stroke="#718c7e"/><text x="134" y="101" font-size="13">女子</text><circle cx="31" cy="92" r="22" fill="#e6edf0" stroke="#4b8790"/><text x="31" y="97" font-size="13">丈夫</text><path d="M50 76Q70 60 96 76" stroke="#4b8790" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="74" y="56" font-size="11" fill="#4b8790">夜來</text><path d="M98 118Q74 137 51 118" stroke="#b39863" stroke-width="2" fill="none" marker-end="url(#b)"/><text x="74" y="151" font-size="11" fill="#9b7a42">晨去</text><text x="90" y="172" font-size="9">關係示意，非特定族群建築</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><rect x="25" y="16" width="130" height="47" rx="10" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="45" font-size="17" font-weight="bold">家產</text><path d="M90 69V107" stroke="#4b8790" stroke-width="2" marker-end="url(#a)"/><text x="119" y="91" font-size="11">繼承</text><rect x="25" y="115" width="130" height="46" rx="10" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="144" font-size="17" font-weight="bold">女子掌理</text><text x="90" y="177" font-size="9">本題的家產繼承線索</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">保留題幹的限定</text><rect x="20" y="34" width="140" height="42" rx="10" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="61" font-size="17" font-weight="bold">有些</text><path d="M90 81V112" stroke="#b3b8b1" stroke-width="2" stroke-dasharray="3 3"/><path d="M79 90L101 105M79 105L101 90" stroke="#a97059" stroke-width="2.5"/><rect x="15" y="120" width="150" height="43" rx="10" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="147" font-size="13">所有族群、所有年代</text><text x="90" y="177" font-size="9">不能把部分描述推成全部</text></g></svg>
