<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eef3e6"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="11" fill="#284d4c">從原行程地名定位</text><rect x="11" y="36" width="158" height="23" rx="5" fill="#dde8d1"/><text x="90" y="52" text-anchor="middle" font-size="10" fill="#284d4c">四草砲臺</text><rect x="11" y="64" width="158" height="23" rx="5" fill="#dde8d1"/><text x="90" y="80" text-anchor="middle" font-size="10" fill="#284d4c">鹿耳門溪口</text><rect x="11" y="92" width="158" height="23" rx="5" fill="#dde8d1"/><text x="90" y="108" text-anchor="middle" font-size="10" fill="#284d4c">鹿耳門天后宮、安平</text><path d="M90 119v10m-3-3 3 3 3-3" fill="none" stroke="#6d8c82"/><rect x="25" y="138" width="130" height="30" rx="5" fill="#aac89a"/><text x="90" y="158" text-anchor="middle" font-size="14" fill="#284d4c">臺南 → 南部</text></g><rect x="180" width="180" height="180" fill="#eaf1f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#284d4c">回表找出南部的代號</text><text x="270" y="39" text-anchor="middle" font-size="9" fill="#284d4c">人口占全臺比例</text><text x="237" y="58" text-anchor="middle" font-size="9" fill="#284d4c">1893</text><text x="286" y="58" text-anchor="middle" font-size="9" fill="#284d4c">2010</text><text x="200" y="75" text-anchor="middle" font-size="12" fill="#284d4c">甲</text><text x="237" y="75" text-anchor="middle" font-size="11" fill="#284d4c">30%</text><text x="286" y="75" text-anchor="middle" font-size="11" fill="#284d4c">45%</text><text x="335" y="75" text-anchor="middle" font-size="11" fill="#284d4c">北</text><text x="200" y="98" text-anchor="middle" font-size="12" fill="#284d4c">乙</text><text x="237" y="98" text-anchor="middle" font-size="11" fill="#284d4c">0%</text><text x="286" y="98" text-anchor="middle" font-size="11" fill="#284d4c">2%</text><text x="335" y="98" text-anchor="middle" font-size="11" fill="#284d4c">東</text><rect x="188" y="105" width="164" height="22" rx="5" fill="#bfd6a7"/><text x="200" y="121" text-anchor="middle" font-size="12" fill="#284d4c">丙</text><text x="237" y="121" text-anchor="middle" font-size="11" fill="#284d4c">43%</text><text x="286" y="121" text-anchor="middle" font-size="11" fill="#284d4c">28%</text><text x="335" y="121" text-anchor="middle" font-size="11" fill="#284d4c">南</text><text x="200" y="144" text-anchor="middle" font-size="12" fill="#284d4c">丁</text><text x="237" y="144" text-anchor="middle" font-size="11" fill="#284d4c">27%</text><text x="286" y="144" text-anchor="middle" font-size="11" fill="#284d4c">25%</text><text x="335" y="144" text-anchor="middle" font-size="11" fill="#284d4c">中</text><text x="270" y="174" text-anchor="middle" font-size="9" fill="#284d4c">比例＋開發史等線索合看</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#284d4c">比例變小，數量未必減少</text><text x="450" y="38" text-anchor="middle" font-size="8" fill="#284d4c">假設例，非臺灣歷史人口</text><rect x="372" y="51" width="156" height="43" rx="5" fill="#e3ecd7"/><text x="450" y="68" text-anchor="middle" font-size="11" fill="#284d4c">全體100人，占43%</text><text x="450" y="86" text-anchor="middle" font-size="12" fill="#284d4c">區域人口＝43人</text><path d="M450 99v10m-3-3 3 3 3-3" fill="none" stroke="#8b9585"/><rect x="372" y="117" width="156" height="43" rx="5" fill="#d0dfb7"/><text x="450" y="134" text-anchor="middle" font-size="11" fill="#284d4c">全體200人，占28%</text><text x="450" y="152" text-anchor="middle" font-size="12" fill="#284d4c">區域人口＝56人</text><text x="450" y="176" text-anchor="middle" font-size="9" fill="#284d4c">43% → 28%，43人 → 56人</text></g></svg>