<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="20" text-anchor="middle" font-size="10" fill="#244b50">A偷換行為，B偷換狀態</text><rect x="10" y="38" width="160" height="48" rx="5" fill="#fafaf5"/><text x="90" y="55" text-anchor="middle" font-size="10" fill="#244b50">原文：德軍使用毒氣</text><text x="90" y="75" text-anchor="middle" font-size="10" fill="#a47748">A改成：德國發明面具</text><rect x="10" y="101" width="160" height="48" rx="5" fill="#fafaf5"/><text x="90" y="118" text-anchor="middle" font-size="10" fill="#244b50">原文：毒氣</text><text x="90" y="138" text-anchor="middle" font-size="10" fill="#a47748">B改成：固態毒素</text><text x="90" y="174" text-anchor="middle" font-size="9" fill="#244b50">主體的行為、事物狀態要對準</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="20" text-anchor="middle" font-size="10" fill="#244b50">C把外型誤當材質</text><rect x="197" y="40" width="146" height="36" rx="5" fill="#d5e5c7"/><text x="270" y="55" text-anchor="middle" font-size="9" fill="#244b50">原文說的是外型</text><text x="270" y="71" text-anchor="middle" font-size="16" fill="#244b50">酷似豬鼻</text><text x="270" y="100" text-anchor="middle" font-size="23" fill="#244b50">≠</text><rect x="197" y="116" width="146" height="36" rx="5" fill="#eedfbe"/><text x="270" y="131" text-anchor="middle" font-size="9" fill="#244b50">C說的是材質</text><text x="270" y="147" text-anchor="middle" font-size="14" fill="#244b50">用豬皮製作</text><text x="270" y="176" text-anchor="middle" font-size="10" fill="#244b50">長得像，不能直接推材料</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="20" text-anchor="middle" font-size="10" fill="#244b50">D能由原文明確推出</text><rect x="377" y="39" width="146" height="36" rx="5" fill="#d5e5c7"/><text x="450" y="54" text-anchor="middle" font-size="9" fill="#244b50">原文</text><text x="450" y="70" text-anchor="middle" font-size="11" fill="#244b50">廣泛應用到各個領域</text><path d="M450 82v16m-4-4 4 4 4-4" fill="none" stroke="#7c9a9a" stroke-width="1.5"/><rect x="377" y="109" width="146" height="38" rx="5" fill="#d1e0e9"/><text x="450" y="125" text-anchor="middle" font-size="10" fill="#244b50">D</text><text x="450" y="141" text-anchor="middle" font-size="14" fill="#244b50">用途不限於戰場</text><text x="450" y="175" text-anchor="middle" font-size="9" fill="#244b50">沒有多加原文未說的資訊</text></g></svg>