<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf3e7"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#284d4c">從極地方向看緯線圈</text><circle cx="90" cy="88" r="60" fill="none" stroke="#80a9b1" stroke-width="3"/><circle cx="90" cy="88" r="49" fill="none" stroke="#abc097" stroke-width="3"/><circle cx="90" cy="88" r="34" fill="none" stroke="#5f896a" stroke-width="3"/><text x="90" y="91" text-anchor="middle" font-size="12" fill="#284d4c">近極地</text><text x="90" y="163" text-anchor="middle" font-size="10" fill="#284d4c">赤道（最外圈）</text><text x="90" y="177" text-anchor="middle" font-size="8" fill="#284d4c">示意，非四點精確定位</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#284d4c">同速率：路短就先到</text><text x="270" y="45" text-anchor="middle" font-size="12" fill="#284d4c">時間＝距離 ÷ 速率</text><text x="216" y="77" text-anchor="middle" font-size="10" fill="#284d4c">短圈</text><rect x="242" y="65" width="42" height="18" rx="5" fill="#75a17a"/><text x="317" y="78" text-anchor="middle" font-size="10" fill="#284d4c">較快</text><text x="216" y="113" text-anchor="middle" font-size="10" fill="#284d4c">長圈</text><rect x="242" y="101" width="88" height="18" rx="5" fill="#9db6c7"/><text x="270" y="148" text-anchor="middle" font-size="10" fill="#284d4c">只比圈長，速率相同</text><text x="270" y="173" text-anchor="middle" font-size="8" fill="#284d4c">長條示意，非實際飛行時間</text></g><rect x="360" width="180" height="180" fill="#faf0df"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#284d4c">同一圈：向東或向西</text><circle cx="450" cy="91" r="47" fill="none" stroke="#6f9c83" stroke-width="4"/><circle cx="450" cy="44" r="4" fill="#c0894a"/><path d="M481 56q16 12 16 32m-4-4 4 4 4-4 M419 56q-16 12-16 32m-4-4 4 4 4-4" fill="none" stroke="#426a82" stroke-width="2"/><text x="450" y="88" text-anchor="middle" font-size="11" fill="#284d4c">方向相反</text><text x="450" y="105" text-anchor="middle" font-size="13" fill="#284d4c">一圈同長</text><text x="450" y="157" text-anchor="middle" font-size="9" fill="#284d4c">本題排除風向等其他因素</text><text x="450" y="176" text-anchor="middle" font-size="10" fill="#284d4c">不是比較經度大小</text></g></svg>