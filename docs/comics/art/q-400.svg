<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#244b50">先看分布，再推區位需求</text><path d="M0 32H61Q48 69 61 103T58 166H0Z" fill="#bed8df"/><text x="27" y="90" text-anchor="middle" font-size="14" fill="#244b50">海</text><text x="124" y="90" text-anchor="middle" font-size="14" fill="#244b50">陸</text><rect x="70" y="49" width="17" height="13" fill="#668975"/><path d="M70 49v-7l5 4 5-4v7" fill="#668975"/><rect x="76" y="123" width="17" height="13" fill="#668975"/><path d="M76 123v-7l5 4 5-4v7" fill="#668975"/><rect x="69" y="151" width="17" height="13" fill="#668975"/><path d="M69 151v-7l5 4 5-4v7" fill="#668975"/><text x="120" y="52" text-anchor="middle" font-size="10" fill="#244b50">沿海點位</text><text x="104" y="114" text-anchor="middle" font-size="10" fill="#244b50">回原圖判讀</text><text x="90" y="177" text-anchor="middle" font-size="9" fill="#244b50">概念示意，非原圖位置</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#244b50">易腐原料：減少運送等待</text><rect x="198" y="33" width="144" height="30" rx="5" fill="#dce8d0"/><text x="270.0" y="52.0" text-anchor="middle" font-size="11" fill="#244b50">原料來源</text><path d="M270 65L270 84" stroke="#819e90" stroke-width="1.5" fill="none"/><path d="M266 79L270 84" stroke="#819e90" stroke-width="1.5" fill="none"/><path d="M274 79L270 84" stroke="#819e90" stroke-width="1.5" fill="none"/><rect x="198" y="89" width="144" height="30" rx="5" fill="#d7e6ef"/><text x="270.0" y="108.0" text-anchor="middle" font-size="11" fill="#244b50">靠近原料的加工廠</text><path d="M270 122L270 141" stroke="#819e90" stroke-width="1.5" fill="none"/><path d="M266 136L270 141" stroke="#819e90" stroke-width="1.5" fill="none"/><path d="M274 136L270 141" stroke="#819e90" stroke-width="1.5" fill="none"/><text x="270" y="158" text-anchor="middle" font-size="11" fill="#244b50">縮短運輸與等待時間</text><text x="270" y="177" text-anchor="middle" font-size="9" fill="#244b50">水產加工只是理解例子</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="9" fill="#244b50">比較哪項最能解釋分布</text><rect x="370" y="34" width="160" height="29" rx="5" fill="#f8f7ef"/><text x="450.0" y="52.5" text-anchor="middle" font-size="11" fill="#244b50"></text><text x="407" y="52" text-anchor="middle" font-size="10" fill="#244b50">A 體積</text><text x="480" y="52" text-anchor="middle" font-size="9" fill="#244b50">主要看運輸負擔</text><rect x="370" y="66" width="160" height="29" rx="5" fill="#dce8d0"/><text x="450.0" y="84.5" text-anchor="middle" font-size="11" fill="#244b50"></text><text x="407" y="84" text-anchor="middle" font-size="10" fill="#244b50">B 易腐</text><text x="480" y="84" text-anchor="middle" font-size="9" fill="#244b50">靠近原料，快處理</text><rect x="370" y="98" width="160" height="29" rx="5" fill="#f8f7ef"/><text x="450.0" y="116.5" text-anchor="middle" font-size="11" fill="#244b50"></text><text x="407" y="116" text-anchor="middle" font-size="10" fill="#244b50">C 技術</text><text x="480" y="116" text-anchor="middle" font-size="9" fill="#244b50">看人才與研發</text><rect x="370" y="130" width="160" height="29" rx="5" fill="#f8f7ef"/><text x="450.0" y="148.5" text-anchor="middle" font-size="11" fill="#244b50"></text><text x="407" y="148" text-anchor="middle" font-size="10" fill="#244b50">D 電能</text><text x="480" y="148" text-anchor="middle" font-size="9" fill="#244b50">看供電等條件</text><text x="450" y="177" text-anchor="middle" font-size="9" fill="#244b50">不能只因沿海就武斷命名</text></g></svg>