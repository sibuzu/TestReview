<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#244b50">比較幼年人口的底部</text><text x="47" y="39" text-anchor="middle" font-size="10" fill="#244b50">2022</text><rect x="39" y="52" width="16" height="7" fill="#91ad8b"/><rect x="35" y="61" width="24" height="7" fill="#91ad8b"/><rect x="27" y="70" width="40" height="7" fill="#91ad8b"/><rect x="19" y="79" width="56" height="7" fill="#91ad8b"/><rect x="15" y="88" width="64" height="7" fill="#91ad8b"/><rect x="24" y="97" width="46" height="7" fill="#91ad8b"/><rect x="32" y="106" width="30" height="7" fill="#b17c3c"/><rect x="33" y="115" width="28" height="7" fill="#b17c3c"/><path d="M47 47V125" stroke="#eff3ec" stroke-width="1"/><text x="133" y="39" text-anchor="middle" font-size="10" fill="#244b50">2050推估</text><rect x="125" y="52" width="16" height="7" fill="#91ad8b"/><rect x="114" y="61" width="38" height="7" fill="#91ad8b"/><rect x="106" y="70" width="54" height="7" fill="#91ad8b"/><rect x="103" y="79" width="60" height="7" fill="#91ad8b"/><rect x="110" y="88" width="46" height="7" fill="#91ad8b"/><rect x="116" y="97" width="34" height="7" fill="#91ad8b"/><rect x="123" y="106" width="20" height="7" fill="#b17c3c"/><rect x="124" y="115" width="18" height="7" fill="#b17c3c"/><path d="M133 47V125" stroke="#eff3ec" stroke-width="1"/><text x="90" y="146" text-anchor="middle" font-size="11" fill="#244b50">2050推估底部更窄</text><text x="90" y="163" text-anchor="middle" font-size="10" fill="#244b50">幼年人口減少的線索</text><text x="90" y="178" text-anchor="middle" font-size="8" fill="#244b50">趨勢概念，非數值重繪</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#244b50">政策如何對應問題？</text><rect x="195" y="34" width="150" height="28" rx="5" fill="#dce8d0"/><text x="270.0" y="52.0" text-anchor="middle" font-size="11" fill="#244b50">提供幼兒照顧服務</text><path d="M270 65V82m-4 -5 4 5 4-5" fill="none" stroke="#7f9a8e" stroke-width="1.5"/><rect x="195" y="87" width="150" height="28" rx="5" fill="#dbe7ef"/><text x="270.0" y="105.0" text-anchor="middle" font-size="11" fill="#244b50">減輕家庭育兒負擔</text><path d="M270 118V135m-4 -5 4 5 4-5" fill="none" stroke="#7f9a8e" stroke-width="1.5"/><text x="270" y="151" text-anchor="middle" font-size="10" fill="#244b50">對應少子化的政策方向</text><text x="270" y="176" text-anchor="middle" font-size="9" fill="#244b50">不保證單一措施必增出生</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#244b50">圖中有什麼，沒什麼？</text><rect x="370" y="32" width="160" height="33" rx="5" fill="#f8f7ef"/><text x="450.0" y="52.5" text-anchor="middle" font-size="9" fill="#244b50">A 提早退休：不合方向</text><rect x="370" y="73" width="160" height="33" rx="5" fill="#f8f7ef"/><text x="450.0" y="93.5" text-anchor="middle" font-size="9" fill="#244b50">B 普遍增校：缺需求支持</text><rect x="370" y="114" width="160" height="33" rx="5" fill="#f8f7ef"/><text x="450.0" y="134.5" text-anchor="middle" font-size="9" fill="#244b50">D 山區醫療：無區域資料</text><text x="450" y="174" text-anchor="middle" font-size="11" fill="#244b50">年齡分布 ≠ 山區分布</text></g></svg>