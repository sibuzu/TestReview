<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eef3e6"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="11" fill="#284f50">先讀方向，再讀高度</text><text x="26" y="38" text-anchor="middle" font-size="12" fill="#284f50">西</text><text x="156" y="38" text-anchor="middle" font-size="12" fill="#284f50">東</text><path d="M20 137 L48 135 L65 129 L77 123 L87 128 L102 101 L115 116 L128 68 L140 87 L158 48 L158 138 Z" fill="#8eac74"/><path d="M19 44V139H163" fill="none" stroke="#577565"/><text x="44" y="154" text-anchor="middle" font-size="10" fill="#284f50">低地</text><text x="99" y="154" text-anchor="middle" font-size="10" fill="#284f50">丘陵</text><text x="148" y="154" text-anchor="middle" font-size="10" fill="#284f50">山地</text><text x="90" y="173" text-anchor="middle" font-size="8" fill="#284f50">起伏趨勢示意，非測量重繪</text></g><rect x="180" width="180" height="180" fill="#eaf0f3"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#284f50">苗栗：由西往東的排列</text><rect x="195" y="34" width="150" height="34" rx="5" fill="#d8e7cc"/><text x="270" y="47" text-anchor="middle" font-size="8" fill="#284f50">西部</text><text x="270" y="62" text-anchor="middle" font-size="12" fill="#284f50">平原、低地</text><path d="M270 70v7m-3-3 3 3 3-3" fill="none" stroke="#78918c"/><rect x="195" y="79" width="150" height="34" rx="5" fill="#d8e7cc"/><text x="270" y="92" text-anchor="middle" font-size="8" fill="#284f50">中間</text><text x="270" y="107" text-anchor="middle" font-size="12" fill="#284f50">丘陵</text><path d="M270 115v7m-3-3 3 3 3-3" fill="none" stroke="#78918c"/><rect x="195" y="124" width="150" height="34" rx="5" fill="#d8e7cc"/><text x="270" y="137" text-anchor="middle" font-size="8" fill="#284f50">東部</text><text x="270" y="152" text-anchor="middle" font-size="12" fill="#284f50">山地</text><text x="270" y="174" text-anchor="middle" font-size="9" fill="#284f50">低 → 高，符合圖中趨勢</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#284f50">方向與高度一起比</text><rect x="370" y="34" width="160" height="34" rx="5" fill="#f5e3c3"/><text x="450" y="47" text-anchor="middle" font-size="10" fill="#284f50">宜蘭典型剖面</text><text x="450" y="62" text-anchor="middle" font-size="9" fill="#284f50">西高東低：方向相反</text><rect x="370" y="79" width="160" height="34" rx="5" fill="#f5e3c3"/><text x="450" y="92" text-anchor="middle" font-size="10" fill="#284f50">彰化八卦臺地</text><text x="450" y="107" text-anchor="middle" font-size="9" fill="#284f50">不合東側二千多公尺</text><rect x="370" y="124" width="160" height="34" rx="5" fill="#f5e3c3"/><text x="450" y="137" text-anchor="middle" font-size="10" fill="#284f50">臺北市域</text><text x="450" y="152" text-anchor="middle" font-size="9" fill="#284f50">不合本圖的高度組合</text></g></svg>