<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4c8068"/></marker></defs><rect x="2" y="2" width="196" height="196" rx="7" fill="#faf8ee" stroke="#b9cbbf"/><rect x="202" y="2" width="196" height="196" rx="7" fill="#faf8ee" stroke="#b9cbbf"/><rect x="402" y="2" width="196" height="196" rx="7" fill="#faf8ee" stroke="#b9cbbf"/><text x="100" y="23" font-family="Noto Sans CJK TC,sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">stop making fun</text><rect x="20" y="51" width="160" height="40" rx="7" fill="#f0e6d6" stroke="#b9cbbf"/><text x="100" y="71" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">原本的取笑行為</text><path d="M25 119H137" stroke="#bf9477" stroke-width="9"/><path d="M141 100V139" stroke="#9b6558" stroke-width="5"/><text x="100" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">不再繼續這件事</text><text x="300" y="23" font-family="Noto Sans CJK TC,sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">stop to V：語意對照</text><rect x="220" y="46" width="160" height="35" rx="7" fill="#e6edf3" stroke="#b9cbbf"/><text x="300" y="64" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">先停下原活動</text><path d="M300 85V111" stroke="#4c8068" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="121" width="160" height="44" rx="7" fill="#dcebdc" stroke="#b9cbbf"/><text x="300" y="143" font-family="Noto Sans CJK TC,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">再去做另一件事</text><text x="300" y="183" font-family="Noto Sans CJK TC,sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#9b6949">不合本句勸阻語意</text><text x="500" y="23" font-family="Noto Sans CJK TC,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">It's = It is</text><rect x="420" y="48" width="160" height="37" rx="7" fill="#e6edf3" stroke="#b9cbbf"/><text x="500" y="67" font-family="Noto Sans CJK TC,sans-serif" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">not right</text><path d="M500 89V109" stroke="#4c8068" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="119" width="160" height="61" rx="7" fill="#dcebdc" stroke="#b9cbbf"/><text x="500" y="138" font-family="Noto Sans CJK TC,sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">to treat people</text><text x="500" y="162" font-family="Noto Sans CJK TC,sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#2d4d3a">like that</text></svg>