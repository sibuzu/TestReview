<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#678a64"/></marker></defs><g font-family="sans-serif" fill="#304b3b"><g><rect width="180" height="180" rx="8" fill="#eef4e9"/><text x="90" y="27" text-anchor="middle" font-size="14">等時間、等位移</text><path d="M15 111H165" stroke="#8e9d83" stroke-width="2"/><circle cx="30" cy="111" r="6" fill="#678a64"/><circle cx="90" cy="111" r="6" fill="#678a64"/><circle cx="150" cy="111" r="6" fill="#678a64"/><path d="M30 88H64" stroke="#678a64" stroke-width="2" marker-end="url(#a)"/><path d="M90 88H124" stroke="#678a64" stroke-width="2" marker-end="url(#a)"/><g text-anchor="middle" font-size="13"><text x="30" y="139">0</text><text x="90" y="139">Δt</text><text x="150" y="139">2Δt</text></g><text x="90" y="166" text-anchor="middle" font-size="13">同方向、相同速度</text></g><g transform="translate(180)"><rect width="180" height="180" rx="8" fill="#f8f2e7"/><text x="90" y="25" text-anchor="middle" font-size="15">A：速度固定</text><path d="M35 42V138H163" stroke="#658069" stroke-width="1.7" fill="none"/><path d="M35 75H151" stroke="#678a64" stroke-width="3"/><circle cx="63" cy="75" r="4" fill="#678a64"/><circle cx="104" cy="75" r="4" fill="#678a64"/><circle cx="145" cy="75" r="4" fill="#678a64"/><g font-size="12"><text x="14" y="49">v</text><text x="163" y="155">t</text><text x="23" y="152">0</text></g><text x="90" y="174" text-anchor="middle" font-size="13">不同時刻，同一高度</text></g><g transform="translate(360)"><rect width="180" height="180" rx="8" fill="#edf3f6"/><text x="90" y="25" text-anchor="middle" font-size="15">上升：速度增加</text><path d="M35 42V138H163" stroke="#658069" stroke-width="1.7" fill="none"/><path d="M35 138 151 60" stroke="#b68350" stroke-width="3"/><g font-size="12"><text x="14" y="49">v</text><text x="163" y="155">t</text><text x="23" y="152">0</text></g><text x="90" y="174" text-anchor="middle" font-size="13">不是道路的走向</text></g></g></svg>
