<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf3e9"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#34564b">A的兩個要點，都見於甲文</text><rect x="8" y="35" width="164" height="28" rx="5" fill="#d2e1c3"/><text x="90" y="54" text-anchor="middle" font-size="14" fill="#34564b">獨立發展</text><text x="90" y="83" text-anchor="middle" font-size="17" fill="#34564b">＋</text><rect x="8" y="96" width="164" height="29" rx="5" fill="#d2e1c3"/><text x="90" y="115" text-anchor="middle" font-size="12" fill="#34564b">適於熱帶及亞熱帶</text><text x="90" y="145" text-anchor="middle" font-size="16" fill="#34564b">↓</text><rect x="35" y="151" width="110" height="24" rx="5" fill="#b6cda4"/><text x="90" y="168" text-anchor="middle" font-size="12" fill="#34564b">直接對應 A</text></g><rect x="180" width="180" height="180" fill="#f8efdf"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#34564b">第4個有範圍限制</text><rect x="186" y="33" width="168" height="113" rx="5" fill="#e2dfd4"/><text x="270" y="52" text-anchor="middle" font-size="10" fill="#34564b">全部綠建築評估系統</text><rect x="201" y="70" width="138" height="58" rx="5" fill="#c8d9b4"/><text x="270" y="91" text-anchor="middle" font-size="10" fill="#34564b">其中：具科學量化者</text><text x="270" y="115" text-anchor="middle" font-size="13" fill="#34564b">原文說第 4 個</text><text x="270" y="163" text-anchor="middle" font-size="9" fill="#34564b">不能放大成所有系統的排名</text><text x="270" y="178" text-anchor="middle" font-size="8" fill="#34564b">框只示範圍，不表示實際數量比例</text></g><rect x="360" width="180" height="180" fill="#ebf1ec"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#34564b">B、D與甲文明文相反</text><rect x="367" y="35" width="166" height="54" rx="5" fill="#d9e3cf"/><text x="450" y="55" text-anchor="middle" font-size="10" fill="#34564b">原文：獨立發展</text><text x="450" y="78" text-anchor="middle" font-size="10" fill="#34564b">B：全盤移植美國</text><rect x="367" y="102" width="166" height="54" rx="5" fill="#d9e3cf"/><text x="450" y="122" text-anchor="middle" font-size="10" fill="#34564b">原文：在英、美、加之後</text><text x="450" y="145" text-anchor="middle" font-size="10" fill="#34564b">D：全球首套</text><text x="450" y="178" text-anchor="middle" font-size="8" fill="#34564b">只依本篇資訊，不冒充今日統計</text></g></svg>