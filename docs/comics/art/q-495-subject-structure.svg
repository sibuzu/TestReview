<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="鄭蘇仙夢至冥府並看見，閻羅王是錄囚的主語；其他句另有指涉"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#5c8873"/></marker><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:12px;font-weight:600;fill:#294c40}.small{font-size:10px;fill:#617b6d}.blue{fill:#246e91}.line{fill:none;stroke:#5c8873;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="540" height="180" fill="#f9faf4"/>
<!-- 1: continuous narration with same omitted subject -->
<text x="90" y="19" text-anchor="middle">承接開頭的主語</text><rect x="30" y="32" width="120" height="31" rx="8" fill="#dcecf5" stroke="#729ab2" stroke-width="1.5"/><text x="90" y="53" text-anchor="middle" class="blue">鄭蘇仙</text><path d="M90 67V79" class="line" marker-end="url(#a)"/><rect x="30" y="85" width="120" height="27" rx="7" fill="#fff" stroke="#a1b79a"/><text x="90" y="104" text-anchor="middle">夢至冥府</text><path d="M90 116V128" class="line" marker-end="url(#a)"/><rect x="30" y="133" width="120" height="27" rx="7" fill="#e3efd8" stroke="#8ca477"/><text x="90" y="152" text-anchor="middle">見……</text><text x="90" y="177" text-anchor="middle" class="small">兩個動作都承接鄭蘇仙</text>
<!-- 2: embedded complement preserves distinct subject of seeing vs recording -->
<text x="270" y="19" text-anchor="middle">見：誰看見？</text><rect x="206" y="31" width="128" height="35" rx="9" fill="#dcecf5" stroke="#729ab2" stroke-width="1.5"/><text x="270" y="54" text-anchor="middle" class="blue">鄭蘇仙</text><path d="M270 71V91" class="line" marker-end="url(#a)"/><text x="307" y="83" text-anchor="middle" class="small">看見</text><rect x="201" y="98" width="138" height="56" rx="10" fill="#f7edcf" stroke="#b9a474" stroke-width="1.5"/><text x="270" y="119" text-anchor="middle">閻羅王</text><text x="270" y="141" text-anchor="middle">方錄囚</text><text x="270" y="177" text-anchor="middle" class="small">見的主語≠錄囚的主語</text>
<!-- 3: not all omitted subjects go back to the first named person -->
<text x="450" y="19" text-anchor="middle">其他句要另看語境</text><rect x="374" y="34" width="152" height="36" rx="8" fill="#fff" stroke="#a7baa2"/><text x="450" y="57" text-anchor="middle">B：泛指假設</text><rect x="374" y="81" width="152" height="36" rx="8" fill="#f4ebda" stroke="#baa680"/><text x="450" y="104" text-anchor="middle">C：木偶</text><rect x="374" y="128" width="152" height="36" rx="8" fill="#eee6ef" stroke="#ac98ad"/><text x="450" y="151" text-anchor="middle">D：那位官員</text><text x="450" y="178" text-anchor="middle" class="small">不能一律補成第一個人名</text></svg>