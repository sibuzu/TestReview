<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="20" text-anchor="middle" font-size="10" fill="#244b50">A、C都差在聲調</text><text x="90" y="40" text-anchor="middle" font-size="10" fill="#244b50">A：委／萎</text><rect x="15" y="47" width="68" height="30" rx="4" fill="#dfebcf"/><rect x="97" y="47" width="68" height="30" rx="4" fill="#f2e2c5"/><text x="49" y="68" text-anchor="middle" font-size="15" fill="#244b50">ㄨㄟˇ</text><text x="131" y="68" text-anchor="middle" font-size="15" fill="#244b50">ㄨㄟ</text><text x="49" y="91" text-anchor="middle" font-size="9" fill="#244b50">第三聲</text><text x="131" y="91" text-anchor="middle" font-size="9" fill="#244b50">第一聲</text><text x="90" y="103" text-anchor="middle" font-size="10" fill="#244b50">C：坷／苛</text><rect x="15" y="110" width="68" height="30" rx="4" fill="#dfebcf"/><rect x="97" y="110" width="68" height="30" rx="4" fill="#f2e2c5"/><text x="49" y="131" text-anchor="middle" font-size="15" fill="#244b50">ㄎㄜˇ</text><text x="131" y="131" text-anchor="middle" font-size="15" fill="#244b50">ㄎㄜ</text><text x="49" y="154" text-anchor="middle" font-size="9" fill="#244b50">第三聲</text><text x="131" y="154" text-anchor="middle" font-size="9" fill="#244b50">第一聲</text><text x="90" y="174" text-anchor="middle" font-size="9" fill="#244b50">不只比符號，也要比聲調</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="20" text-anchor="middle" font-size="10" fill="#244b50">B：兩字完整讀音相同</text><text x="227" y="58" text-anchor="middle" font-size="26" fill="#244b50">偽</text><rect x="194" y="71" width="66" height="32" rx="4" fill="#dbe8c9"/><text x="227" y="93" text-anchor="middle" font-size="17" fill="#244b50">ㄨㄟˋ</text><text x="313" y="58" text-anchor="middle" font-size="26" fill="#244b50">為</text><rect x="280" y="71" width="66" height="32" rx="4" fill="#dbe8c9"/><text x="313" y="93" text-anchor="middle" font-size="17" fill="#244b50">ㄨㄟˋ</text><text x="270" y="90" text-anchor="middle" font-size="15" fill="#244b50">＝</text><text x="270" y="126" text-anchor="middle" font-size="12" fill="#244b50">為國：替國家</text><text x="270" y="153" text-anchor="middle" font-size="11" fill="#244b50">都是第四聲</text><text x="270" y="174" text-anchor="middle" font-size="10" fill="#244b50">不同字，也可以同音</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="20" text-anchor="middle" font-size="10" fill="#244b50">D：凌多一個介音ㄧ</text><text x="383" y="62" text-anchor="middle" font-size="20" fill="#244b50">稜</text><rect x="400" y="42" width="25" height="30" rx="4" fill="#dce6df"/><text x="412" y="63" text-anchor="middle" font-size="17" fill="#244b50">ㄌ</text><rect x="429" y="42" width="25" height="30" rx="4" fill="#dce6df"/><text x="441" y="63" text-anchor="middle" font-size="17" fill="#244b50"></text><rect x="458" y="42" width="25" height="30" rx="4" fill="#dce6df"/><text x="470" y="63" text-anchor="middle" font-size="17" fill="#244b50">ㄥ</text><rect x="487" y="42" width="25" height="30" rx="4" fill="#dce6df"/><text x="499" y="63" text-anchor="middle" font-size="17" fill="#244b50">ˊ</text><text x="383" y="110" text-anchor="middle" font-size="20" fill="#244b50">凌</text><rect x="400" y="90" width="25" height="30" rx="4" fill="#dce6df"/><text x="412" y="111" text-anchor="middle" font-size="17" fill="#244b50">ㄌ</text><rect x="429" y="90" width="25" height="30" rx="4" fill="#f2dcb6"/><text x="441" y="111" text-anchor="middle" font-size="17" fill="#244b50">ㄧ</text><rect x="458" y="90" width="25" height="30" rx="4" fill="#dce6df"/><text x="470" y="111" text-anchor="middle" font-size="17" fill="#244b50">ㄥ</text><rect x="487" y="90" width="25" height="30" rx="4" fill="#dce6df"/><text x="499" y="111" text-anchor="middle" font-size="17" fill="#244b50">ˊ</text><text x="450" y="150" text-anchor="middle" font-size="13" fill="#244b50">ㄌㄥˊ ≠ ㄌㄧㄥˊ</