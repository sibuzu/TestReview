<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="up" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#287f9b"/></marker><marker id="down" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b47a39"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="48" y="19" font-size="13">以前靠左</text><text x="133" y="19" font-size="13">之後靠右</text><rect x="19" y="31" width="58" height="103" rx="5" fill="#e0e6e4" stroke="#84978c"/><rect x="104" y="31" width="58" height="103" rx="5" fill="#e0e6e4" stroke="#84978c"/><path d="M48 35V131M133 35V131" stroke="white" stroke-width="2" stroke-dasharray="7 5"/><path d="M33 112V55" stroke="#287f9b" stroke-width="3" marker-end="url(#up)"/><path d="M63 53V111" stroke="#b47a39" stroke-width="3" marker-end="url(#down)"/><path d="M118 53V111" stroke="#b47a39" stroke-width="3" marker-end="url(#down)"/><path d="M148 112V55" stroke="#287f9b" stroke-width="3" marker-end="url(#up)"/><text x="90" y="154" font-size="13" font-weight="bold">1967.9.3 H日</text><text x="90" y="174" font-size="8">各方向依行進方向看左、右；非現場圖</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="21" font-size="12">先前的投票與準備</text><rect x="11" y="32" width="158" height="53" rx="9" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="53" font-size="12">1955年投票</text><text x="90" y="75" font-size="17" font-weight="bold">83% 不贊成</text><rect x="11" y="98" width="158" height="61" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="123" font-size="15" font-weight="bold">花四年宣導</text><text x="90" y="146" font-size="12">路標、道路與計畫</text><text x="90" y="175" font-size="9">原文：spent four years telling</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="21" font-size="12">文章所記當天數字</text><rect x="9" y="34" width="162" height="56" rx="9" fill="#e6edf0" stroke="#4b8790"/><text x="52" y="58" font-size="20" font-weight="bold">157</text><text x="129" y="58" font-size="20" font-weight="bold">0</text><text x="52" y="79" font-size="11">起小事故</text><text x="129" y="79" font-size="11">人死亡</text><rect x="11" y="106" width="158" height="52" rx="9" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="129" font-size="17" font-weight="bold">Maybe</text><text x="90" y="149" font-size="11">也許因為開得更小心</text><text x="90" y="175" font-size="10">推測 ≠ 已證明唯一原因</text></g></svg>
