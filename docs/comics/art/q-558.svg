<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="sans-serif" text-anchor="middle" fill="#473f2e"><rect width="180" height="180" fill="#f4f2e5"/><text x="90" y="21" font-size="13">質量例子：融化前</text><rect x="42" y="43" width="96" height="100" fill="#dfb67c"/><rect x="42" y="43" width="96" height="20" fill="#c8dfed"/><rect x="42" y="43" width="96" height="100" fill="none" stroke="#7a8368" stroke-width="2"/><text x="90" y="58" font-size="11">冰50g</text><text x="90" y="98" font-size="11">原溶液200g</text><text x="90" y="120" font-size="11">其中糖20g</text><text x="90" y="167" font-size="13">冰＋溶液＝250g</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#473f2e"><rect width="180" height="180" fill="#edf3f3"/><text x="90" y="21" font-size="13">融化後混合均勻</text><rect x="42" y="43" width="96" height="100" fill="#dfb67c" stroke="#7a8368" stroke-width="2"/><text x="90" y="91" font-size="12">溶液250g</text><text x="90" y="116" font-size="12">糖仍20g</text><text x="90" y="167" font-size="13">總質量仍250g</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#473f2e"><rect width="180" height="180" fill="#f5efe4"/><text x="90" y="21" font-size="13">重量百分率變小</text><text x="49" y="48" font-size="15">20</text><path d="M25 55H73" stroke="#7c745a" stroke-width="1.5"/><text x="49" y="75" font-size="15">200</text><text x="124" y="63" font-size="15">＝10%</text><text x="49" y="113" font-size="15">20</text><path d="M25 120H73" stroke="#7c745a" stroke-width="1.5"/><text x="49" y="140" font-size="15">250</text><text x="124" y="128" font-size="15">＝8%</text><text x="90" y="167" font-size="11">糖不變，溶液增加</text></g></svg>
