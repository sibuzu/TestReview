<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="boat" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a77a4e"/></marker><marker id="flow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#467e9c"/></marker><marker id="black" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4b5750"/></marker></defs><g font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#f5efdf"/><text x="90" y="27" font-size="14">先讀原圖圖例</text><path d="M32 75H142" stroke="#4b5750" stroke-width="3" marker-end="url(#black)"/><text x="90" y="113" font-size="16">代表航行方向</text><text x="90" y="147" font-size="13">不是洋流方向</text><text x="90" y="172" font-size="11">箭頭本身不提供速度</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#e8f3f7"/><path d="M0 43H65Q54 99 69 156H0Z" fill="#c6d7b5"/><path d="M65 43Q54 99 69 156" fill="none" stroke="#879d79" stroke-width="2"/><text x="31" y="102" font-size="13">陸側</text><path d="M122 148V52" stroke="#467e9c" stroke-width="4" marker-end="url(#flow)"/><text x="116" y="31" font-size="13">北</text><text x="155" y="107" font-size="12">黑潮</text><text x="122" y="168" font-size="11">東側海域方向簡圖</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#edf1f7"/><text x="90" y="24" font-size="13">丙：航向與海流相反</text><text x="90" y="48" font-size="12">北</text><path d="M55 139V64" stroke="#467e9c" stroke-width="4" marker-end="url(#flow)"/><path d="M125 64V139" stroke="#a77a4e" stroke-width="4" marker-end="url(#boat)"/><text x="55" y="162" font-size="12">黑潮向北</text><text x="125" y="162" font-size="12">船向南</text><text x="90" y="178" font-size="10">僅比方向，非流速大小</text></g></svg>