<text x="90" y="22" font-size="15">先找原句的be動詞</text><text x="90" y="60" font-size="21">They</text><rect x="55" y="74" width="70" height="37" rx="6" fill="#c8dbb9"/><text x="90" y="100" font-size="22">are</text><text x="90" y="140" font-size="17">in the library.</text><text x="90" y="168" font-size="12">原句本來就有are</text>
