<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d8678"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eef3e8"/><path d="M180 0h180v180H180Z" fill="#edf1f7"/><path d="M360 0h180v180H360Z" fill="#f7f0e3"/>
<text x="90" y="22" font-size="15">is與angry分工不同</text><text x="90" y="57" font-size="20">She</text><rect x="27" y="76" width="43" height="33" rx="5" fill="#c7dab7"/><rect x="82" y="76" width="71" height="33" rx="5" fill="#e9dcc2"/><text x="48" y="100" font-size="22">is</text><text x="117" y="99" font-size="20">angry</text><text x="48" y="135" font-size="12">be動詞</text><text x="117" y="135" font-size="12">形容詞</text><text x="90" y="169" font-size="12">否定要接在is後面</text>
<text x="270" y="22" font-size="15">插入not，其餘保留</text><text x="270" y="59" font-size="20">She</text><rect x="201" y="77" width="138" height="33" rx="5" fill="#d6e3ee"/><text x="270" y="100" font-size="20">is not angry</text><text x="270" y="139" font-size="16">with her brother.</text><text x="270" y="169" font-size="12">不是刪掉is、只留not</text>
<text x="450" y="22" font-size="15">縮寫保留否定意思</text><rect x="395" y="36" width="110" height="28" rx="5" fill="#e9dcc2"/><text x="450" y="57" font-size="19">is not</text><path d="M450 68V84" stroke="#6d8678" marker-end="url(#a)"/><rect x="395" y="92" width="110" height="28" rx="5" fill="#c7dab7"/><text x="450" y="113" font-size="19">isn't</text><text x="450" y="147" font-size="17">does not is</text><path d="M394 142L506 142" stroke="#b77964" stroke-width="2"/><text x="450" y="174" font-size="12">本句不另加does</text></g></svg>