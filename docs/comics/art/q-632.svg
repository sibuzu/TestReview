<text x="90" y="22" font-size="15">一群學生中的一位</text><rect x="19" y="42" width="142" height="91" rx="8" fill="#e4e9df" stroke="#92a28d"/><g fill="#b8c6bc"><circle cx="47" cy="71" r="13"/><circle cx="89" cy="71" r="13"/><circle cx="131" cy="71" r="13"/><circle cx="47" cy="110" r="13"/><circle cx="131" cy="110" r="13"/></g><circle cx="89" cy="110" r="16" fill="#729763" stroke="#416d49" stroke-width="2"/><text x="89" y="115" font-size="16" fill="#fff">1</text><text x="90" y="153" font-size="12">圖僅示意班級成員</text><text x="90" y="173" font-size="13">One：其中一位</text>
<text x="270" y="22" font-size="15">動詞跟One配對</text><rect x="201" y="41" width="65" height="34" rx="5" fill="#c7dab8"/><text x="233" y="65" font-size="21">One</text><path d="M270 58H289" stroke="#70897a" marker-end="url(#a)"/><rect x="294" y="41" width="51" height="34" rx="5" fill="#c7dab8"/><text x="319" y="65" font-size="21">is</text><rect x="199" y="94" width="142" height="46" rx="5" fill="#dce4ee"/><text x="270" y="114" font-size="15">of the students</text><text x="270" y="134" font-size="15">in our class</text><text x="270" y="165" font-size="12">這段限定哪一群人</text>
<text x="450" y="22" font-size="15">換核心，配對才不同</text><rect x="377" y="42" width="146" height="43" rx="5" fill="#d5e1c7"/><text x="450" y="62" font-size="16">One → is</text><text x="450" y="79" font-size="12">其中一位，單數</text><rect x="377" y="102" width="146" height="43" rx="5" fill="#e6dbc6"/><text x="450" y="122" font-size="15">The students → are</text><text x="450" y="139" font-size="12">學生們，複數</text><text x="450" y="173" font-size="12">本題核心是One</text></g></svg>