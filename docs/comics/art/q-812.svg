<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A同義重複，B受事重複，C動詞搭配三種語病對照"><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#274b48}.h{font-size:24px;font-weight:700}.w{font-size:25px;font-weight:600}.s{font-size:20px}.bad{fill:#a65746}.good{fill:#3c7659}</style><rect width="900" height="300" fill="#faf8ed"/><g id="a"><text x="150" y="35" class="h">A　同義重複</text><rect x="38" y="64" width="224" height="54" rx="12" fill="#f0e3dc"/><text x="150.0" y="100.0" class="w bad" style="font-size:25px">發自內心</text><rect x="38" y="133" width="224" height="54" rx="12" fill="#f0e3dc"/><text x="150.0" y="169.0" class="w bad" style="font-size:25px">由衷</text><path d="M55 205 H245" stroke="#8c9c88" stroke-width="2"/><text x="150" y="237" class="s">同樣表達出於本心</text><text x="150" y="272" class="w good">擇一即可</text></g><g id="b" transform="translate(300 0)"><text x="150" y="35" class="h">B　受事表達重複</text><rect x="25" y="64" width="250" height="54" rx="12" fill="#f0e3dc"/><text x="150.0" y="100.0" class="w bad" style="font-size:25px">被挨罵</text><text x="150" y="153" class="s">可改為</text><rect x="25" y="172" width="250" height="47" rx="12" fill="#e7eee0"/><text x="150.0" y="204.5" class="w good" style="font-size:25px">一定挨罵</text><rect x="25" y="235" width="250" height="47" rx="12" fill="#e7eee0"/><text x="150.0" y="267.5" class="w good" style="font-size:25px">一定被責罵</text></g><g id="c" transform="translate(600 0)"><text x="150" y="35" class="h">C　動詞搭配不當</text><rect x="25" y="64" width="250" height="54" rx="12" fill="#f0e3dc"/><text x="150.0" y="99.64" class="w bad" style="font-size:24px">恢復身體疲勞</text><text x="150" y="153" class="s">可改為</text><rect x="25" y="172" width="250" height="47" rx="12" fill="#e7eee0"/><text x="150.0" y="204.14" class="w good" style="font-size:24px">消除身體疲勞</text><rect x="25" y="235" width="250" height="47" rx="12" fill="#e7eee0"/><text x="150.0" y="267.5" class="w good" style="font-size:25px">恢復體力</text></g></svg>