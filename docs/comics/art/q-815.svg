<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="可求與不可求兩條件，對照不義富貴如浮雲"><rect width="900" height="300" fill="#faf8ed"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#294c48}.h{font-size:26px;font-weight:700}.w{font-size:25px;font-weight:700}.s{font-size:20px}</style><g id="panel-0" transform="translate(0 0)"><text x="150" y="38" class="h">如可求</text><rect x="25" y="65" width="250" height="56" rx="13" fill="#f0e8d6"/><text x="150.0" y="102.0" class="w">雖執鞭之士</text><path d="M150 128 V159 M143 152 L150 160 L157 152" fill="none" stroke="#8a9d88" stroke-width="3"/><rect x="25" y="173" width="250" height="56" rx="13" fill="#e5eddf"/><text x="150.0" y="210.0" class="w">吾亦為之</text><text x="150" y="267" class="s">較卑微工作，也願做</text></g><g id="panel-1" transform="translate(300 0)"><text x="150" y="38" class="h">如不可求</text><rect x="25" y="65" width="250" height="56" rx="13" fill="#e0eaf0"/><text x="150.0" y="102.0" class="w">從吾所好</text><path d="M150 128 V159 M143 152 L150 160 L157 152" fill="none" stroke="#8a9d88" stroke-width="3"/><rect x="25" y="173" width="250" height="56" rx="13" fill="#e5eddf"/><text x="150.0" y="210.0" class="w">依志趣，不強逐</text><text x="150" y="267" class="s">不為富貴失去原則</text></g><g id="panel-2" transform="translate(600 0)"><text x="150" y="38" class="h">B　最相近</text><rect x="18" y="65" width="264" height="56" rx="13" fill="#f0e3dc"/><text x="150.0" y="102.0" class="w">不義而富且貴</text><rect x="18" y="136" width="264" height="56" rx="13" fill="#e0eaf0"/><text x="150.0" y="173.0" class="w">於我如浮雲</text><path d="M45 213 H255" stroke="#8a9d88" stroke-width="2"/><text x="150" y="248" class="w">重道義，不苟求</text><text x="150" y="280" class="s">不是一概排斥富貴</text></g></svg>