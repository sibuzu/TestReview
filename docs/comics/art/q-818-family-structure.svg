<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="榮公到寶玉世系、王氏兒女順序、子興敘述雨村聽的三張結構圖">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526d66"/></marker></defs>
<g font-family="Noto Sans CJK TC,Noto Sans TC,sans-serif" text-anchor="middle" fill="#203e36" stroke-linejoin="round">
<rect width="180" height="180" fill="#f5f1e8"/>
<g stroke="#526d66" stroke-width="1.7" fill="none"><path d="M84 30V34H47V40" marker-end="url(#a)"/><path d="M86 54H95M90 54V95" marker-end="url(#a)"/><path d="M90 123V146" marker-end="url(#a)"/></g>
<g stroke="#71897c" stroke-width="1.3"><rect x="40" y="5" width="88" height="25" rx="5" fill="#e2e9df"/><rect x="8" y="40" width="78" height="28" rx="5" fill="white"/><rect x="95" y="40" width="78" height="28" rx="5" fill="#d1e9d4"/><rect x="49" y="95" width="82" height="28" rx="5" fill="white"/><rect x="49" y="146" width="82" height="27" rx="5" fill="#e5edf6"/></g>
<g font-size="12"><text x="84" y="23">榮國公</text><text x="47" y="59">賈代善</text><text x="134" y="59" font-weight="700">史老太君</text><text x="90" y="114">賈政</text><text x="90" y="165">賈寶玉</text></g>
<g font-size="10.5"><text x="153" y="23">曾祖父</text><text x="47" y="82">祖父</text><text x="134" y="82" font-weight="700">祖母</text><text x="149" y="113">父親</text></g>
<g transform="translate(180)"><rect width="180" height="180" fill="#edf3ef"/><text x="90" y="18" font-size="12" font-weight="700">王氏所生兒女</text><g stroke="#71897c" stroke-width="1.2"><rect x="12" y="29" width="156" height="39" rx="6" fill="white"/><rect x="12" y="77" width="156" height="39" rx="6" fill="#f6ead6"/><rect x="12" y="125" width="156" height="43" rx="6" fill="#d6e7f5"/></g><g font-size="12"><text x="90" y="45">頭胎：賈珠</text><text x="90" y="93">第二胎：女兒</text><text x="90" y="142">後來：寶玉</text></g><g font-size="11" font-weight="700"><text x="90" y="60">長子</text><text x="90" y="108">女兒也算胎次</text><text x="90" y="158">次子，非第三個兒子</text></g></g>
<g transform="translate(360)"><rect width="180" height="180" fill="#f6f0e8"/><text x="90" y="18" font-size="12" font-weight="700">異事的說話者</text><rect x="14" y="30" width="152" height="49" rx="7" fill="#d1e9d4" stroke="#71897c" stroke-width="1.3"/><text x="90" y="50" font-size="14" font-weight="700">子興敘述</text><text x="90" y="69" font-size="12">寶玉銜玉出生</text><path d="M90 80V99" fill="none" stroke="#526d66" stroke-width="1.7" marker-end="url(#a)"/><rect x="14" y="102" width="152" height="49" rx="7" fill="#e4eaf2" stroke="#71897c" stroke-width="1.3"/><text x="90" y="122" font-size="14" font-weight="700">雨村聽後回應</text><text x="90" y="141" font-size="12">「果然奇異」</text><text x="90" y="172" font-size="11">故事主角 ≠ 敘述者</text></g>
</g></svg>
