<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="已賣房是過去、下月搬家是未來，現在進行式可表已安排未來的時間軸與句構">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526d66"/></marker></defs>
<g font-family="Noto Sans CJK TC,Noto Sans TC,sans-serif" text-anchor="middle" fill="#203e36" stroke-linejoin="round">
<rect width="180" height="180" fill="#f5f1e8"/><text x="90" y="20" font-size="13" font-weight="700">時間線索分開看</text><path d="M12 79H171" stroke="#526d66" stroke-width="1.8" marker-end="url(#a)"/><circle cx="31" cy="79" r="5" fill="#ac7543"/><circle cx="88" cy="79" r="5" fill="#3d7b61"/><circle cx="146" cy="79" r="5" fill="#497aa0"/><text x="31" y="58" font-size="14" font-weight="700">sold</text><text x="88" y="58" font-size="12">now</text><text x="146" y="58" font-size="13">move</text><g font-size="11.5"><text x="31" y="103">過去</text><text x="88" y="103">現在</text><text x="146" y="103">未來</text></g><path d="M146 87V121" stroke="#497aa0" fill="none" stroke-width="1.4"/><text x="132" y="139" font-size="12" font-weight="700">next month</text><text x="90" y="169" font-size="11.5">sold 不支配整句時態</text>
<g transform="translate(180)"><rect width="180" height="180" fill="#edf3ef"/><text x="90" y="20" font-size="13" font-weight="700">現在進行式</text><g stroke="#71897c" stroke-width="1.2"><rect x="8" y="36" width="48" height="29" rx="4" fill="white"/><rect x="61" y="36" width="47" height="29" rx="4" fill="#e1eaf5"/><rect x="113" y="36" width="60" height="29" rx="4" fill="#d1e9d4"/></g><text x="32" y="56" font-size="14">They</text><text x="84" y="56" font-size="14" font-weight="700">are</text><text x="143" y="56" font-size="13" font-weight="700">moving</text><text x="90" y="86" font-size="14">be + V-ing</text><path d="M39 109H144" stroke="#526d66" stroke-width="1.8" marker-end="url(#a)"/><circle cx="39" cy="109" r="4" fill="#3d7b61"/><circle cx="144" cy="109" r="4" fill="#497aa0"/><g font-size="11.5"><text x="39" y="130">現在</text><text x="39" y="146">已安排</text><text x="142" y="130" font-size="10.5">next month</text><text x="142" y="146">預定搬家</text></g><text x="90" y="172" font-size="12" font-weight="700">這裡表已安排的未來</text></g>
<g transform="translate(360)"><rect width="180" height="180" fill="#f6f0e8"/><text x="90" y="18" font-size="12.5" font-weight="700">各形式的時間觀點</text><g fill="white" stroke="#8b9c91" stroke-width="1.2"><rect x="9" y="27" width="162" height="38" rx="5"/><rect x="9" y="77" width="162" height="38" rx="5"/><rect x="9" y="127" width="162" height="42" rx="5"/></g><text x="90" y="44" font-size="13" font-weight="700">A moved</text><text x="90" y="59" font-size="11">過去的搬家動作</text><text x="90" y="94" font-size="13" font-weight="700">C would move</text><text x="90" y="109" font-size="11">過去觀點／假設語境</text><text x="90" y="145" font-size="10.5" font-weight="700">D were going to move</text><text x="90" y="162" font-size="11.5">過去曾有的計畫</text></g>
</g></svg>
