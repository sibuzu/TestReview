<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#608da0"/></marker></defs><rect x="0" width="180" height="180" fill="#eaf1f4"/><g font-family="sans-serif"><text x="102" y="18" text-anchor="middle" font-size="10" fill="#33564c">與那國島向西看臺灣</text><text x="20" y="38" text-anchor="middle" font-size="10" fill="#33564c">北</text><path d="M20 73V47" stroke="#608da0" stroke-width="1.7" marker-end="url(#a)"/><rect x="7" y="86" width="57" height="28" rx="4" fill="#d5e2ca"/><text x="35.5" y="105" text-anchor="middle" font-size="10" fill="#33564c">蘇澳一帶</text><rect x="105" y="86" width="69" height="28" rx="4" fill="#d0e2e5"/><text x="139.5" y="105" text-anchor="middle" font-size="10" fill="#33564c">與那國島</text><path data-looking="west" d="M103 100H68" stroke="#608da0" stroke-width="2.5" marker-end="url(#a)"/><text x="86" y="85" text-anchor="middle" font-size="9" fill="#33564c">向西</text><path d="M35 128V133H140V128" fill="none" stroke="#a4b4a6"/><text x="87.5" y="152" text-anchor="middle" font-size="10" fill="#33564c">題示相距約 110 公里</text><text x="90" y="178" text-anchor="middle" font-size="8" fill="#33564c">僅方位關係，非地圖與光學剖面</text></g><rect x="180" width="180" height="180" fill="#eef2e7"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#33564c">中央山脈：北端近蘇澳</text><rect x="205" y="35" width="130" height="28" rx="4" fill="#d5e2ca"/><text x="270" y="55" text-anchor="middle" font-size="13" fill="#33564c">蘇澳附近</text><path d="M270 67V136" stroke="#87a478" stroke-width="20"/><text x="270" y="91" text-anchor="middle" font-size="12" fill="#33564c">中央山脈</text><text x="270" y="115" text-anchor="middle" font-size="11" fill="#33564c">北段</text><path d="M270 137V153" stroke="#608da0" stroke-width="2" marker-end="url(#a)"/><text x="270" y="171" text-anchor="middle" font-size="9" fill="#33564c">山脈向南延伸（概念示意）</text></g><rect x="360" width="180" height="180" fill="#f8efdf"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#33564c">按本題主要相對位置比較</text><rect x="368" y="31" width="164" height="27" rx="4" fill="#e3e4d6"/><text x="450" y="50" text-anchor="middle" font-size="10" fill="#33564c">A 雪山：較偏西北</text><rect x="368" y="63" width="164" height="27" rx="4" fill="#bfd5ae"/><text x="450" y="82" text-anchor="middle" font-size="10" fill="#33564c">B 中央：北段近蘇澳</text><rect x="368" y="95" width="164" height="27" rx="4" fill="#e3e4d6"/><text x="450" y="114" text-anchor="middle" font-size="10" fill="#33564c">C 海岸：較偏南</text><rect x="368" y="127" width="164" height="27" rx="4" fill="#e3e4d6"/><text x="450" y="146" text-anchor="middle" font-size="10" fill="#33564c">D 玉山：內陸且偏南</text><text x="450" y="178" text-anchor="middle" font-size="8" fill="#33564c">不代表任何天氣只看得見一山脈</text></g></svg>