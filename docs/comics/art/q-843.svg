<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e7"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#284d4d">不同元素：質量、性質不同</text><circle cx="53" cy="55" r="21" fill="#d5a99a"/><circle cx="125" cy="55" r="21" fill="#99bccb"/><text x="53" y="60" text-anchor="middle" font-size="13" fill="#284d4d">A</text><text x="125" y="60" text-anchor="middle" font-size="13" fill="#284d4d">B</text><text x="90" y="91" text-anchor="middle" font-size="10" fill="#284d4d">不是以不同幾何形狀分類</text><path d="M39 143L53 113L67 143Z" fill="#d3d8d1"/><rect x="113" y="115" width="27" height="27" fill="#d3d8d1"/><path d="M24 107L153 153M153 107L24 153" stroke="#b67963" stroke-width="2"/><text x="90" y="176" text-anchor="middle" font-size="8" fill="#284d4d">圓球是模型示意，非真實外觀</text></g><rect x="180" width="180" height="180" fill="#faf0e6"/><g font-family="sans-serif"><text x="270" y="17" text-anchor="middle" font-size="10" fill="#284d4d">當時理論 ≠ 今日全部結論</text><rect x="188" y="32" width="164" height="28" rx="4" fill="#dae6cd"/><text x="270" y="50" text-anchor="middle" font-size="9" fill="#284d4d">B：同元素原子質量相同</text><rect x="188" y="66" width="164" height="28" rx="4" fill="#dae6cd"/><text x="270" y="84" text-anchor="middle" font-size="10" fill="#284d4d">C：原子不可分割</text><path d="M270 101v12m-3-3 3 3 3-3" stroke="#8b9c91" fill="none"/><rect x="188" y="121" width="164" height="28" rx="4" fill="#e0e8ef"/><text x="270" y="139" text-anchor="middle" font-size="9" fill="#284d4d">後來：同位素、次原子粒子</text><text x="270" y="175" text-anchor="middle" font-size="9" fill="#284d4d">本題核對道耳頓當時的內容</text></g><rect x="360" width="180" height="180" fill="#eaf1f4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#284d4d">D：化學反應重新排列</text><path d="M402 53H427M474 53H499" stroke="#587977" stroke-width="2"/><circle cx="402" cy="53" r="12" fill="#d5a99a" stroke="#658581" data-element="A" data-stage="before"/><text x="402" y="57" text-anchor="middle" font-size="10" fill="#284d4d">A</text><circle cx="427" cy="53" r="12" fill="#d5a99a" stroke="#658581" data-element="A" data-stage="before"/><text x="427" y="57" text-anchor="middle" font-size="10" fill="#284d4d">A</text><circle cx="474" cy="53" r="12" fill="#99bccb" stroke="#658581" data-element="B" data-stage="before"/><text x="474" y="57" text-anchor="middle" font-size="10" fill="#284d4d">B</text><circle cx="499" cy="53" r="12" fill="#99bccb" stroke="#658581" data-element="B" data-stage="before"/><text x="499" y="57" text-anchor="middle" font-size="10" fill="#284d4d">B</text><path d="M402 125H427M474 125H499" stroke="#587977" stroke-width="2"/><circle cx="402" cy="125" r="12" fill="#d5a99a" stroke="#658581" data-element="A" data-stage="after"/><text x="402" y="129" text-anchor="middle" font-size="10" fill="#284d4d">A</text><circle cx="427" cy="125" r="12" fill="#99bccb" stroke="#658581" data-element="B" data-stage="after"/><text x="427" y="129" text-anchor="middle" font-size="10" fill="#284d4d">B</text><circle cx="474" cy="125" r="12" fill="#d5a99a" stroke="#658581" data-element="A" data-stage="after"/><text x="474" y="129" text-anchor="middle" font-size="10" fill="#284d4d">A</text><circle cx="499" cy="125" r="12" fill="#99bccb" stroke="#658581" data-element="B" data-stage="after"/><text x="499" y="129" text-anchor="middle" font-size="10" fill="#284d4d">B</text><path d="M450 78v19m-4-4 4 4 4-4" stroke="#587977" fill="none" stroke-width="2"/><text x="450" y="157" text-anchor="middle" font-size="11" fill="#284d4d">前後A各2、B各2</text><text x="450" y="176" text-anchor="middle" font-size="8" fill="#284d4d">假設組合，非特定化學反應</text></g></svg>