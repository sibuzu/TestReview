<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eaf1f4"/><g font-family="sans-serif"><text x="90" y="19" text-anchor="middle" font-size="11" fill="#284d4d">電荷總和要等於0</text><rect x="10" y="64" width="67" height="39" rx="5" fill="#c1d8e1" data-ion="Mg" data-charge="2"/><text x="43.5" y="88.5" text-anchor="middle" font-size="16" fill="#284d4d">Mg²⁺</text><rect x="104" y="34" width="64" height="35" rx="5" fill="#dce7cf" data-ion="OH" data-charge="-1"/><text x="136.0" y="56.5" text-anchor="middle" font-size="16" fill="#284d4d">OH⁻</text><rect x="104" y="98" width="64" height="35" rx="5" fill="#dce7cf" data-ion="OH" data-charge="-1"/><text x="136.0" y="120.5" text-anchor="middle" font-size="16" fill="#284d4d">OH⁻</text><text x="91" y="89" text-anchor="middle" font-size="14" fill="#284d4d">+</text><text x="90" y="157" text-anchor="middle" font-size="11" fill="#284d4d">(+2)＋(−1)＋(−1)＝0</text><text x="90" y="177" text-anchor="middle" font-size="8" fill="#284d4d">離子比例示意，非晶體結構</text></g><rect x="180" width="180" height="180" fill="#eef3e7"/><g font-family="sans-serif"><text x="270" y="19" text-anchor="middle" font-size="11" fill="#284d4d">下標2作用於整組OH</text><text x="270" y="49" text-anchor="middle" font-size="20" fill="#284d4d">Mg(OH)₂</text><rect x="192" y="75" width="42" height="34" rx="5" fill="#c1d8e1" /><text x="213.0" y="97.0" text-anchor="middle" font-size="14" fill="#284d4d">Mg</text><rect x="247" y="75" width="44" height="34" rx="5" fill="#dce7cf" /><text x="269.0" y="97.0" text-anchor="middle" font-size="14" fill="#284d4d">OH</text><rect x="303" y="75" width="44" height="34" rx="5" fill="#dce7cf" /><text x="325.0" y="97.0" text-anchor="middle" font-size="14" fill="#284d4d">OH</text><text x="270" y="137" text-anchor="middle" font-size="12" fill="#284d4d">Mg：1　O：2　H：2</text><text x="270" y="163" text-anchor="middle" font-size="10" fill="#284d4d">兩組OH，不是只加倍H</text><text x="270" y="178" text-anchor="middle" font-size="8" fill="#284d4d">化學式比例，不是分子圖</text></g><rect x="360" width="180" height="180" fill="#faf0e6"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#284d4d">核對原卷B的化學式</text><rect x="375" y="33" width="150" height="34" rx="5" fill="#edcfbf" /><text x="450.0" y="55.0" text-anchor="middle" font-size="15" fill="#284d4d">MgOH（錯）</text><text x="450" y="87" text-anchor="middle" font-size="11" fill="#284d4d">+2−1＝+1，不平衡</text><rect x="375" y="106" width="150" height="34" rx="5" fill="#cee0bc" /><text x="450.0" y="128.0" text-anchor="middle" font-size="15" fill="#284d4d">Mg(OH)₂（正）</text><text x="450" y="160" text-anchor="middle" font-size="13" fill="#284d4d">+2−2＝0</text></g></svg>