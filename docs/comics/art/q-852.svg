<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">分節附肢是分類線索</text><rect x="34" y="38" width="112" height="30" rx="8" fill="#e2edd8"/><text x="90" y="59" font-size="13">動物界</text><path d="M90 68V88" stroke="#648974" stroke-width="2"/><rect x="18" y="87" width="144" height="32" rx="8" fill="#cfe2cd"/><text x="90" y="108" font-size="13" font-weight="bold">節肢動物門</text><path d="M90 120V139" stroke="#648974" stroke-width="2"/><text x="90" y="157" font-size="13">塵蟎在此分類範圍內</text><g transform="translate(180)"><text x="90" y="20" font-size="12">比較成體腳數</text><path d="M32 73L17 70L6 48" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M32 84L17 81L6 77" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M32 95L17 98L6 111" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M32 106L17 109L6 138" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M129 75L116 72L105 57" fill="none" stroke="#af8653" stroke-width="2.5"/><path d="M129 82L116 85L105 91" fill="none" stroke="#af8653" stroke-width="2.5"/><path d="M129 89L116 92L105 124" fill="none" stroke="#af8653" stroke-width="2.5"/><path d="M58 73L73 70L84 48" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M58 84L73 81L84 77" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M58 95L73 98L84 111" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M58 106L73 109L84 138" fill="none" stroke="#6a8e77" stroke-width="2.5"/><path d="M143 75L156 72L167 57" fill="none" stroke="#af8653" stroke-width="2.5"/><path d="M143 82L156 85L167 91" fill="none" stroke="#af8653" stroke-width="2.5"/><path d="M143 89L156 92L167 124" fill="none" stroke="#af8653" stroke-width="2.5"/><ellipse cx="45" cy="91" rx="18" ry="28" fill="#e2edd8" stroke="#527b66" stroke-width="2"/><circle cx="136" cy="57" r="8" fill="#f3e4ce" stroke="#a47d4c" stroke-width="2"/><ellipse cx="136" cy="82" rx="9" ry="13" fill="#f3e4ce" stroke="#a47d4c" stroke-width="2"/><ellipse cx="136" cy="109" rx="12" ry="16" fill="#f3e4ce" stroke="#a47d4c" stroke-width="2"/><text x="45" y="157" font-size="11" font-weight="bold">塵蟎8腳</text><text x="136" y="157" font-size="11">昆蟲6腳</text><text x="90" y="174" font-size="9.5">概念示意，非等比例</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">殺死，不等於全部移除</text><rect x="38" y="34" width="104" height="29" rx="8" fill="#f4e6d0"/><text x="90" y="54" font-size="13">殺死塵蟎</text><text x="90" y="88" font-size="26" fill="#b87e45">≠</text><rect x="14" y="98" width="152" height="29" rx="8" fill="#e2edd8"/><text x="90" y="118" font-size="12">過敏原全部消失</text><text x="90" y="150" font-size="11">屍體、排泄物、蟲卵</text><text x="90" y="169" font-size="10.5">題文都列為小張的過敏原</text></g></g></svg>