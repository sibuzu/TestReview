<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">兩方談的是清帝退位</text><rect x="14" y="33" width="152" height="52" rx="9" fill="#e2edd8"/><text x="90" y="54" font-size="12" font-weight="bold">民國代表</text><text x="90" y="74" font-size="11">給退位後的優待</text><rect x="14" y="98" width="152" height="52" rx="9" fill="#f4e6d0"/><text x="90" y="119" font-size="12" font-weight="bold">清帝國代表</text><text x="90" y="139" font-size="11">交出統治權、接受共和</text><text x="90" y="170" font-size="10.5">保留尊號，不等於保留政權</text><g transform="translate(180)"><text x="90" y="20" font-size="12">角色前後不要混淆</text><path d="M23 48V144" stroke="#829b7e" stroke-width="3"/><g fill="#6e9276"><circle cx="23" cy="49" r="5"/><circle cx="23" cy="96" r="5"/><circle cx="23" cy="144" r="5"/></g><g text-anchor="start"><text x="37" y="48" font-size="12" font-weight="bold">孫中山</text><text x="37" y="66" font-size="10.5">南京臨時大總統</text><text x="37" y="99" font-size="12">1912年清帝退位</text><text x="37" y="144" font-size="12" font-weight="bold">袁世凱</text><text x="37" y="162" font-size="10.5">後接任臨時大總統</text></g></g><g transform="translate(360)"><text x="90" y="20" font-size="12">回到退位詔書的指定者</text><rect x="15" y="36" width="150" height="38" rx="9" fill="#edf3e4"/><text x="90" y="62" font-size="21">○○○</text><path d="M90 76V95M84 88L90 96L96 88" fill="none" stroke="#7a967d" stroke-width="2"/><rect x="33" y="100" width="114" height="34" rx="9" fill="#cfe2cd"/><text x="90" y="124" font-size="20" font-weight="bold">袁世凱</text><text x="90" y="155" font-size="11">組織臨時共和政府</text><text x="90" y="173" font-size="11">與民軍協商統一</text></g></g></svg>