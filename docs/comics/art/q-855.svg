<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="5" fill="#f5f3e9"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">先找原圖甲、乙方位</text><path d="M45 45L150 43L177 67L153 94L115 183L78 119L50 92Z" fill="#dce7ce" stroke="#9bad96"/><text x="61" y="68" font-size="22" text-anchor="middle" fill="#29483e">甲</text><text x="151" y="68" font-size="22" text-anchor="middle" fill="#29483e">乙</text><text x="44" y="40" font-size="11" text-anchor="middle" fill="#29483e">西北</text><text x="164" y="40" font-size="11" text-anchor="middle" fill="#29483e">東北</text><path d="M143 82L75 82" stroke="#63867e" stroke-width="2" fill="none"/><text x="100" y="114" font-size="15" text-anchor="middle" fill="#29483e">乙 → 甲</text><text x="100" y="190" font-size="10" text-anchor="middle" fill="#29483e">方位示意，非比例地圖</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="5" fill="#f5f3e9"/><text x="100" y="23" font-size="13" text-anchor="middle" fill="#29483e">西南季風影響的時間</text><text x="20" y="69" font-size="16" text-anchor="middle" fill="#29483e">乙</text><rect x="39" y="50" width="145" height="25" rx="5" fill="#a6cad7"/><text x="110" y="68" font-size="12" text-anchor="middle" fill="#29483e">雨季較長</text><text x="20" y="122" font-size="16" text-anchor="middle" fill="#29483e">甲</text><rect x="79" y="103" width="76" height="25" rx="5" fill="#d3dfc2"/><text x="117" y="121" font-size="12" text-anchor="middle" fill="#29483e">較短</text><text x="100" y="171" font-size="10" text-anchor="middle" fill="#29483e">示意長短，不代表精確日數</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="5" fill="#f5f3e9"/><text x="100" y="23" font-size="13" text-anchor="middle" fill="#29483e">回圖例讀兩地雨量</text><rect x="30" y="52" width="50" height="103" rx="5" fill="#83b0d2"/><rect x="122" y="125" width="50" height="30" rx="5" fill="#e5ca8d"/><text x="55" y="176" font-size="14" text-anchor="middle" fill="#29483e">乙較多</text><text x="147" y="176" font-size="14" text-anchor="middle" fill="#29483e">甲較少</text><text x="100" y="40" font-size="10" text-anchor="middle" fill="#29483e">不另編降雨數字</text></g></svg>