<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">先由帝制名號認人</text><rect x="21" y="38" width="138" height="35" rx="8" fill="#f4e6d0"/><text x="90" y="62" font-size="16">洪憲帝制</text><path d="M90 74V93M84 86L90 94L96 86" fill="none" stroke="#74967b" stroke-width="2"/><rect x="29" y="100" width="122" height="37" rx="9" fill="#d9e8d3"/><text x="90" y="126" font-size="21" font-weight="bold">袁世凱</text><text x="90" y="166" font-size="11">再找與他「無關」的事件</text><g transform="translate(180)"><text x="90" y="20" font-size="12">A：武昌起事的直接角色</text><rect x="16" y="36" width="148" height="31" rx="8" fill="#e8efdf"/><text x="90" y="57" font-size="12">湖北新軍革命黨人</text><path d="M90 68V84" stroke="#7a987d" stroke-width="2"/><rect x="28" y="83" width="124" height="31" rx="8" fill="#d9e8d3"/><text x="90" y="105" font-size="14">1911年武昌起事</text><text x="90" y="141" font-size="12">反清，不是討袁</text><text x="90" y="166" font-size="10.5">也不是袁世凱發動</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">其餘三項直接涉及袁</text><g text-anchor="start"><rect x="7" y="34" width="166" height="36" rx="7" fill="#edf2e6"/><text x="15" y="49" font-size="10.5">1913　二次革命</text><text x="15" y="64" font-size="10.5">革命派起兵討袁</text><rect x="7" y="79" width="166" height="36" rx="7" fill="#e0ecd8"/><text x="15" y="94" font-size="10.5">1914　解散國會</text><text x="15" y="109" font-size="10.5">袁世凱下令</text><rect x="7" y="124" width="166" height="36" rx="7" fill="#edf2e6"/><text x="15" y="139" font-size="10.5">1915　五九國恥</text><text x="15" y="154" font-size="10.5">袁政府對日交涉</text></g><text x="90" y="176" font-size="9.5">有關：作為、對象或執政交涉</text></g></g></svg>