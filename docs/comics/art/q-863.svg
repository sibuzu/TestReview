<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">同一年，三個季節</text><circle cx="44" cy="66" r="12" fill="#e7b96e"/><path d="M67.0 66.0L73.0 66.0" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M60.2634559672906 82.2634559672906L64.50609665440987 86.50609665440987" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M44.0 89.0L44.0 95.0" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M27.736544032709407 82.2634559672906L23.493903345590123 86.50609665440987" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M21.0 66.0L15.0 66.0" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M27.736544032709403 49.7365440327094L23.493903345590116 45.49390334559013" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M43.99999999999999 43.0L43.99999999999999 37.0" stroke="#d39c4e" stroke-width="2" fill="none"/><path d="M60.26345596729059 49.7365440327094L64.50609665440987 45.49390334559011" stroke="#d39c4e" stroke-width="2" fill="none"/><ellipse cx="151" cy="58" rx="32" ry="15" fill="#b4cfda"/><path d="M131 83L124 105" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M143 83L136 105" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M155 83L148 105" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M167 83L160 105" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M179 83L172 105" stroke="#709fb8" stroke-width="2" fill="none"/><text x="43" y="115" font-size="14" text-anchor="middle" fill="#29483e">熱季</text><text x="152" y="115" font-size="14" text-anchor="middle" fill="#29483e">雨季</text><path d="M38 136L159 136" stroke="#67887d" stroke-width="2" fill="none"/><text x="100" y="162" font-size="14" text-anchor="middle" fill="#29483e">涼季較乾涼</text><text x="100" y="187" font-size="10" text-anchor="middle" fill="#29483e">季節概念；不是實測氣候圖</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">主要雨季連到西南季風</text><path d="M33 164Q82 106 164 66" stroke="#7aa8bb" stroke-width="16" fill="none"/><path d="M145 60L173 58L165 88Z" fill="#7aa8bb"/><ellipse cx="139" cy="51" rx="32" ry="15" fill="#b4cfda"/><path d="M119 76L112 98" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M131 76L124 98" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M143 76L136 98" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M155 76L148 98" stroke="#709fb8" stroke-width="2" fill="none"/><path d="M167 76L160 98" stroke="#709fb8" stroke-width="2" fill="none"/><text x="63" y="94" font-size="13" text-anchor="middle" fill="#29483e">海洋</text><text x="135" y="145" font-size="14" text-anchor="middle" fill="#29483e">北印度</text><text x="100" y="185" font-size="10" text-anchor="middle" fill="#29483e">水氣方向概念，非精確路徑</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">比較全年降雨型態</text><path d="M20 160L182 160" stroke="#67887d" stroke-width="2" fill="none"/><rect x="27" y="142" width="21" height="18" rx="3" fill="#a3c5d1"/><rect x="63" y="125" width="21" height="35" rx="3" fill="#a3c5d1"/><rect x="99" y="60" width="21" height="100" rx="3" fill="#a3c5d1"/><rect x="135" y="134" width="21" height="26" rx="3" fill="#a3c5d1"/><text x="100" y="182" font-size="12" text-anchor="middle" fill="#29483e">明顯雨季，也有乾季</text><text x="100" y="38" font-size="11" text-anchor="middle" fill="#29483e">本題按南亞區域分區</text></g></svg>