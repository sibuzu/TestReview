<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">約西元前1500年</text><path d="M72 57L156 62L169 87L124 172L86 117Z" fill="#d7e2bf" stroke="#8d9e80"/><path d="M20 50L105 94" stroke="#b88d56" stroke-width="4" fill="none"/><path d="M90 77L109 95L86 95Z" fill="#b88d56"/><text x="63" y="47" font-size="13" text-anchor="middle" fill="#29483e">進入印度</text><text x="100" y="191" font-size="10" text-anchor="middle" fill="#29483e">進入方向概念，非完整路線</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">先比年代，不只記外族</text><path d="M20 98L181 98" stroke="#67887d" stroke-width="2" fill="none"/><circle cx="45" cy="98" r="6" fill="#a27b46"/><circle cx="157" cy="98" r="6" fill="#6f9eaf"/><text x="50" y="58" font-size="13" text-anchor="middle" fill="#29483e">前1500年</text><text x="50" y="79" font-size="12" text-anchor="middle" fill="#29483e">阿利安人</text><text x="150" y="133" font-size="13" text-anchor="middle" fill="#29483e">13世紀</text><text x="150" y="155" font-size="12" text-anchor="middle" fill="#29483e">蒙古帝國</text><text x="100" y="187" font-size="10" text-anchor="middle" fill="#29483e">年代比較，間距不按比例</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">制度經過長期發展</text><rect x="29" y="43" width="142" height="23" rx="3" fill="#dfc497"/><rect x="39" y="74" width="122" height="23" rx="3" fill="#d9cba8"/><rect x="49" y="105" width="102" height="23" rx="3" fill="#c7d9bc"/><rect x="59" y="136" width="82" height="23" rx="3" fill="#b9d0cc"/><text x="100" y="183" font-size="10" text-anchor="middle" fill="#29483e">歷史分層概念，非現代價值</text></g></svg>