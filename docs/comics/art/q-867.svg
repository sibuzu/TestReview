<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">本題2023年底的成員</text><circle cx="100" cy="95" r="31" fill="#dfcfae"/><text x="100" y="100" font-size="13" text-anchor="middle" fill="#29483e">CPTPP</text><path d="M100 95L42 48" stroke="#67887d" stroke-width="2" fill="none"/><path d="M100 95L157 48" stroke="#67887d" stroke-width="2" fill="none"/><path d="M100 95L42 153" stroke="#67887d" stroke-width="2" fill="none"/><path d="M100 95L157 153" stroke="#67887d" stroke-width="2" fill="none"/><text x="40" y="42" font-size="14" text-anchor="middle" fill="#29483e">澳洲</text><text x="161" y="42" font-size="14" text-anchor="middle" fill="#29483e">日本</text><text x="38" y="176" font-size="13" text-anchor="middle" fill="#29483e">加拿大</text><text x="161" y="176" font-size="13" text-anchor="middle" fill="#29483e">智利</text><text x="100" y="191" font-size="9" text-anchor="middle" fill="#29483e">僅列成員例子；完整見原圖</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">原料貿易的投入鏈</text><path d="M13 90L38 49L64 90Z" fill="#9f8976"/><text x="38" y="114" font-size="11" text-anchor="middle" fill="#29483e">澳洲鐵礦</text><path d="M65 79L130 79" stroke="#67887d" stroke-width="2" fill="none"/><path d="M79 82h51l-10 19H89Z" fill="#7ea4b1"/><rect x="87" y="67" width="15" height="14" rx="3" fill="#c3a16c"/><rect x="103" y="67" width="15" height="14" rx="3" fill="#c3a16c"/><rect x="142" y="54" width="45" height="43" rx="3" fill="#b5cdb4"/><path d="M145 54V37h10v17M170 54V28h10v26" fill="#b5cdb4"/><text x="164" y="121" font-size="11" text-anchor="middle" fill="#29483e">我國業者</text><text x="100" y="160" font-size="12" text-anchor="middle" fill="#29483e">假設加入且適用優惠</text><text x="100" y="185" font-size="10" text-anchor="middle" fill="#29483e">不是已加入的事實圖</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">優惠有適用條件</text><rect x="20" y="49" width="159" height="29" rx="3" fill="#dbd1b8"/><text x="100" y="69" font-size="12" text-anchor="middle" fill="#29483e">成員、品項、原產地</text><path d="M100 79L100 106" stroke="#67887d" stroke-width="2" fill="none"/><rect x="32" y="108" width="135" height="30" rx="3" fill="#c0d7c9"/><text x="100" y="128" font-size="13" text-anchor="middle" fill="#29483e">成本有機會下降</text><text x="100" y="163" font-size="11" text-anchor="middle" fill="#29483e">利潤改善 ≠ 必然獲利</text><text x="100" y="188" font-size="10" text-anchor="middle" fill="#29483e">未捏造關稅或成本數字</text></g></svg>