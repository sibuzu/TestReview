<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">讀寬度，不讀所在位置</text><path d="M18 152L184 152" stroke="#67887d" stroke-width="2" fill="none"/><path d="M18 149L18 156" stroke="#67887d" stroke-width="2" fill="none"/><path d="M55 149L55 156" stroke="#67887d" stroke-width="2" fill="none"/><path d="M91 149L91 156" stroke="#67887d" stroke-width="2" fill="none"/><path d="M128 149L128 156" stroke="#67887d" stroke-width="2" fill="none"/><path d="M165 149L165 156" stroke="#67887d" stroke-width="2" fill="none"/><text x="55" y="173" font-size="12" text-anchor="middle" fill="#29483e">20%</text><text x="91" y="173" font-size="12" text-anchor="middle" fill="#29483e">38%</text><rect x="55" y="70" width="36" height="81" rx="3" fill="#b6d0de"/><path d="M55 52L91 52" stroke="#b7894d" stroke-width="2" fill="none"/><path d="M55 47L55 58" stroke="#b7894d" stroke-width="2" fill="none"/><path d="M91 47L91 58" stroke="#b7894d" stroke-width="2" fill="none"/><text x="73" y="111" font-size="18" text-anchor="middle" fill="#29483e">乙</text><text x="120" y="39" font-size="14" text-anchor="middle" fill="#29483e">約18%</text><text x="100" y="191" font-size="10" text-anchor="middle" fill="#29483e">左右兩端相減，不是38%</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">高度是人均GDP</text><path d="M23 163L184 163" stroke="#67887d" stroke-width="2" fill="none"/><path d="M23 44L23 163" stroke="#67887d" stroke-width="2" fill="none"/><path d="M23 85L182 85" stroke="#c06b61" stroke-width="2" fill="none"/><rect x="55" y="125" width="71" height="38" rx="3" fill="#a4c8d7"/><text x="145" y="75" font-size="12" text-anchor="middle" fill="#a5574c">13,460</text><text x="153" y="103" font-size="11" text-anchor="middle" fill="#29483e">平均線</text><text x="91" y="150" font-size="12" text-anchor="middle" fill="#29483e">乙較低</text><text x="100" y="187" font-size="9" text-anchor="middle" fill="#29483e">只示相對高低；非重建數據</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="3" fill="#f4f4eb"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">面積聯繫經濟規模</text><rect x="42" y="56" width="116" height="88" rx="3" fill="#c9dcbf"/><path d="M41 157L158 157" stroke="#67887d" stroke-width="2" fill="none"/><path d="M30 56L30 145" stroke="#67887d" stroke-width="2" fill="none"/><text x="100" y="178" font-size="13" text-anchor="middle" fill="#29483e">人口 × 人均GDP</text><text x="101" y="100" font-size="16" text-anchor="middle" fill="#29483e">經濟規模</text><text x="100" y="122" font-size="12" text-anchor="middle" fill="#29483e">看矩形面積</text><text x="100" y="193" font-size="9" text-anchor="middle" fill="#29483e">示意矩形，非新年度統計</text></g></svg>