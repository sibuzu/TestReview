<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">輸出的是農礦原料</text><rect x="8" y="35" width="75" height="117" rx="10" fill="#e4ebdd"/><rect x="96" y="35" width="75" height="117" rx="10" fill="#f2e7d5"/><path d="M19 106L27 79L47 70L66 87L74 109Z" fill="#40564d"/><path d="M28 81L39 93L48 72M40 94L66 88" fill="none" stroke="#869c88" stroke-width="2"/><path d="M110 83H157L152 116H115Z" fill="#f9faf2" stroke="#a68a61" stroke-width="2"/><path d="M135 51C130 59 123 65 126 72C130 79 143 77 144 69C145 63 139 57 135 51Z" fill="#f8fbef" stroke="#b4bca4"/><text x="45" y="137" font-size="13">煤礦</text><text x="134" y="137" font-size="13">橡膠</text><text x="90" y="173" font-size="10.5">資源圖示，不代表實際物態比例</text><g transform="translate(180)"><text x="90" y="20" font-size="12">交通是外運的工具</text><rect x="28" y="34" width="124" height="29" rx="8" fill="#e3edd9"/><text x="90" y="54" font-size="13">產地的農礦資源</text><path d="M90 64V82M84 75L90 83L96 75" fill="none" stroke="#739279" stroke-width="2"/><rect x="17" y="85" width="146" height="31" rx="8" fill="#d2e4cc"/><text x="90" y="106" font-size="13">鐵路、航運</text><path d="M90 117V135M84 128L90 136L96 128" fill="none" stroke="#739279" stroke-width="2"/><rect x="37" y="139" width="106" height="28" rx="8" fill="#e3edd9"/><text x="90" y="159" font-size="13">輸出到外地</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">外運，不等於加工製造</text><rect x="10" y="37" width="160" height="42" rx="8" fill="#d7e7d0"/><text x="90" y="55" font-size="11">題幹有明說</text><text x="90" y="73" font-size="12" font-weight="bold">煤礦、橡膠輸出</text><rect x="10" y="95" width="160" height="62" rx="8" fill="#f2eadf"/><text x="90" y="113" font-size="11">題幹未描述</text><text x="90" y="133" font-size="12">加工製造、鋼鐵生產</text><text x="90" y="150" font-size="10">不能只由交通設施推得</text><text x="90" y="175" font-size="10.5">依已給證據判斷主要模式</text></g></g></svg>