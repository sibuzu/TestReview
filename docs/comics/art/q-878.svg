<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">先看這張圖的圖例</text><g font-size="15"><rect x="28" y="40" width="48" height="25" fill="#d5d5d5"/><text x="113" y="59">甲：淺</text><rect x="28" y="83" width="48" height="25" fill="#999999"/><text x="113" y="102">乙：中</text><rect x="28" y="126" width="48" height="25" fill="#4c4c4c"/><text x="113" y="145">丙：深</text></g><text x="90" y="174" font-size="10.5">深淺在此表示宗教類別</text><g transform="translate(180)"><text x="90" y="20" font-size="12">再定位甲色的主要區域</text><rect x="19" y="35" width="142" height="33" rx="8" fill="#dddddd"/><text x="90" y="57" font-size="14">甲色覆蓋</text><path d="M90 69V85M84 78L90 86L96 78" fill="none" stroke="#78927c" stroke-width="2"/><rect x="11" y="88" width="158" height="32" rx="8" fill="#d9e8d3"/><text x="90" y="110" font-size="14">印度大部分地區</text><path d="M90 122V137M84 130L90 138L96 130" fill="none" stroke="#78927c" stroke-width="2"/><text x="90" y="160" font-size="19" font-weight="bold">印度教</text><text x="90" y="177" font-size="9.5">判讀流程，非重畫宗教邊界</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">發源地與主要分布要分清</text><rect x="13" y="38" width="154" height="44" rx="8" fill="#f1e6d5"/><text x="90" y="58" font-size="13">佛教源於古印度地區</text><text x="90" y="76" font-size="10.5">談的是歷史上的發源</text><text x="90" y="110" font-size="23" fill="#b38954">≠</text><rect x="13" y="121" width="154" height="39" rx="8" fill="#d9e8d3"/><text x="90" y="145" font-size="12">今天印度以佛教為主</text><text x="90" y="178" font-size="9.5">本題須按信仰分布圖判斷</text></g></g></svg>