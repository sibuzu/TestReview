<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="21" font-size="12">從景點辨認城市</text><rect x="12" y="37" width="156" height="35" rx="7" fill="#e6ddce"/><text x="90" y="60" font-size="15" font-weight="bold">泰姬瑪哈陵</text><path d="M90 73V91M84 84L90 92L96 84" fill="none" stroke="#78917c" stroke-width="2"/><rect x="26" y="97" width="128" height="32" rx="7" fill="#d8e7d3"/><text x="90" y="119" font-size="16">阿格拉</text><text x="90" y="153" font-size="12">印度北部內陸</text><text x="90" y="174" font-size="9.5">名稱與區位的判讀關係</text><g transform="translate(180)"><text x="90" y="20" font-size="12">流域不同於主河道</text><rect x="12" y="33" width="156" height="39" rx="7" fill="#dce9f0"/><text x="90" y="51" font-size="12">亞穆納河岸：泰姬陵</text><text x="90" y="66" font-size="10">亞穆納河是恆河支流</text><path d="M90 74V98M84 91L90 99L96 91" fill="none" stroke="#6d9ca9" stroke-width="3"/><text x="117" y="89" font-size="10">匯入</text><rect x="30" y="105" width="120" height="32" rx="7" fill="#b9d9e5"/><text x="90" y="127" font-size="14">恆河主河道</text><text x="90" y="157" font-size="10.5">同流域，不等於同一河岸</text><text x="90" y="176" font-size="9.5">支流關係示意，不按比例</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">回到原圖比較四點</text><rect x="15" y="32" width="150" height="32" rx="7" fill="#d0e2c9"/><text x="90" y="54" font-size="14" font-weight="bold">乙：北部內陸 ✓</text><g font-size="12"><text x="90" y="88">甲：西岸一帶</text><text x="90" y="115">丙：東岸一帶</text><text x="90" y="142">丁：南部地區</text></g><text x="90" y="173" font-size="10">用相對區位對回原圖代號</text></g></g></svg>