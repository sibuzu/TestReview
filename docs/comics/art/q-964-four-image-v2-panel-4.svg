<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><title>第四圖共同起點座標：甲路程66m，乙含起點距離位置70m，差4m</title><rect width="240" height="240" fill="#faf8ef"/><path d="M25 110L218 110" fill="none" stroke="#bcc7c1" stroke-width="1"/><rect x="25" y="87" width="165" height="18" fill="#23836b"/><rect x="50" y="147" width="150" height="18" fill="#365f9c"/><path d="M190 75L190 184" fill="none" stroke="#23836b" stroke-width="1" stroke-dasharray="3 2"/><path d="M200 75L200 184" fill="none" stroke="#365f9c" stroke-width="1" stroke-dasharray="3 2"/><text x="110" y="65" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#284c44">甲：2.2 × 30 = 66</text><text x="125" y="204" font-family="sans-serif" text-anchor="middle" font-size="13" fill="#284c44">乙：10 + 2 × 30 = 70</text><text x="194" y="30" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#b4772d">4 m</text></svg>