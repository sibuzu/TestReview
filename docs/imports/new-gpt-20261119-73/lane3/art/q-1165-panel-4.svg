<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img"><title>細繩受到天花板向上和木塊向下的拉力平衡</title><rect width="400" height="400" rx="18" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="200" y="35" font-size="24" fill="#17334b" text-anchor="middle">只看細繩的受力</text><line x1="200" y1="135" x2="200" y2="275" stroke="#64748b" stroke-width="7"/><line x1="200" y1="135" x2="200" y2="55" stroke="#16a34a" stroke-width="4"/><polygon points="200,55 205.27368092464624,64.6534081807941 194.72631907535376,64.6534081807941" fill="#16a34a"/><line x1="200" y1="275" x2="200" y2="355" stroke="#ea580c" stroke-width="4"/><polygon points="200,355 194.72631907535376,345.3465918192059 205.27368092464624,345.3465918192059" fill="#ea580c"/><text x="265" y="100" font-size="25" fill="#17334b" text-anchor="middle">F₅</text><text x="265" y="325" font-size="25" fill="#17334b" text-anchor="middle">F₃</text><text x="100" y="210" font-size="22" fill="#17334b" text-anchor="middle">細繩</text><text x="200" y="385" font-size="20" fill="#17334b" text-anchor="middle">F₅ = F₃；不包含 F₄</text></g></svg>