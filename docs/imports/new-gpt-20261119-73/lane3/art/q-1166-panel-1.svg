<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img"><title>兩木塊相互接觸力是反作用力對</title><rect width="400" height="400" rx="18" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="200" y="35" font-size="24" fill="#17334b" text-anchor="middle">接觸力：F₃ 與 F₄</text><rect x="105" y="160" width="95" height="80" rx="5" fill="#fde68a" stroke="#334155" stroke-width="2"/><rect x="200" y="160" width="95" height="80" rx="5" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="150" y="210" font-size="25" fill="#17334b" text-anchor="middle">甲</text><text x="245" y="210" font-size="25" fill="#17334b" text-anchor="middle">乙</text><line x1="50" y1="245" x2="350" y2="245" stroke="#334155" stroke-width="3"/><line x1="205" y1="130" x2="290" y2="130" stroke="#2563eb" stroke-width="4"/><polygon points="290,130 280.3465918192059,135.27368092464624 280.3465918192059,124.72631907535377" fill="#2563eb"/><text x="255" y="110" font-size="25" fill="#17334b" text-anchor="middle">F₃</text><line x1="195" y1="275" x2="110" y2="275" stroke="#ea580c" stroke-width="4"/><polygon points="110,275 119.6534081807941,269.7263190753538 119.6534081807941,280.2736809246462" fill="#ea580c"/><text x="145" y="315" font-size="25" fill="#17334b" text-anchor="middle">F₄</text><text x="200" y="365" font-size="20" fill="#17334b" text-anchor="middle">大小相等，受力物體不同</text></g></svg>