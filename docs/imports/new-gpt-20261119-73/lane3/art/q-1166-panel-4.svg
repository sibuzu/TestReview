<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img"><title>示意長條比較四個力的大小，數值非原題給定</title><rect width="400" height="400" rx="18" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="200" y="35" font-size="23" fill="#17334b" text-anchor="middle">比較大小，不表示方向</text><text x="45" y="110" font-size="24" fill="#17334b" text-anchor="middle">F₁</text><rect x="85" y="92" width="245" height="22" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="45" y="175" font-size="24" fill="#17334b" text-anchor="middle">F₄</text><rect x="85" y="157" width="165" height="22" rx="2" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="45" y="240" font-size="24" fill="#17334b" text-anchor="middle">F₃</text><rect x="85" y="222" width="165" height="22" rx="2" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="45" y="305" font-size="24" fill="#17334b" text-anchor="middle">F₂</text><rect x="85" y="287" width="85" height="22" rx="2" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="200" y="370" font-size="26" fill="#17334b" text-anchor="middle">F₁ &gt; F₄ = F₃ &gt; F₂</text></g></svg>