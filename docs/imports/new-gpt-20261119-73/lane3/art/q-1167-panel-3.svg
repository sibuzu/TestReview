<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img"><title>火箭受力圖只列氣體作用在火箭的力</title><rect width="400" height="400" rx="18" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="200" y="35" font-size="25" fill="#17334b" text-anchor="middle">只畫火箭的受力</text><g transform="translate(190,190) scale(0.85)"><rect x="-60" y="-40" width="120" height="80" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><path d="M60 -40 L110 0 L60 40Z" fill="#60a5fa" stroke="#334155" stroke-width="2"/><path d="M-60 -40 L-80 -65 L-30 -40M-60 40L-80 65L-30 40" fill="#93c5fd" stroke="#334155" stroke-width="2"/><rect x="-72" y="-26" width="12" height="52" rx="5" fill="#475569" stroke="#334155" stroke-width="2"/><circle cx="35" cy="0" r="18" fill="#dbeafe" stroke="#334155" stroke-width="2"/></g><line x1="220" y1="110" x2="345" y2="110" stroke="#2563eb" stroke-width="4"/><polygon points="345,110 335.3465918192059,115.27368092464623 335.3465918192059,104.72631907535377" fill="#2563eb"/><text x="265" y="85" font-size="18" fill="#17334b" text-anchor="middle">氣體給火箭的推力</text><text x="200" y="335" font-size="22" fill="#17334b" text-anchor="middle">另一個力在氣體上</text><text x="200" y="370" font-size="21" fill="#17334b" text-anchor="middle">不能在火箭上彼此抵銷</text></g></svg>