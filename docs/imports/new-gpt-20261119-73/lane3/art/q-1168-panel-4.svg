<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img"><title>速度時間圖顯示推牆時加速、離牆後等速，示意未按數值</title><rect width="400" height="400" rx="18" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="200" y="35" font-size="23" fill="#17334b" text-anchor="middle">接觸加速 → 離牆等速</text><line x1="60" y1="310" x2="335" y2="310" stroke="#475569" stroke-width="2"/><polygon points="335,310 325.3465918192059,315.2736809246462 325.3465918192059,304.7263190753538" fill="#475569"/><line x1="60" y1="310" x2="60" y2="80" stroke="#475569" stroke-width="2"/><polygon points="60,80 65.27368092464623,89.6534081807941 54.726319075353764,89.6534081807941" fill="#475569"/><text x="45" y="335" font-size="15" fill="#17334b" text-anchor="middle">0</text><text x="345" y="335" font-size="20" fill="#17334b" text-anchor="middle">t</text><text x="45" y="70" font-size="20" fill="#17334b" text-anchor="middle">v</text><line x1="60" y1="310" x2="185" y2="150" stroke="#2563eb" stroke-width="4"/><line x1="185" y1="150" x2="330" y2="150" stroke="#16a34a" stroke-width="4"/><line x1="185" y1="310" x2="185" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><text x="185" y="340" font-size="19" fill="#17334b" text-anchor="middle">離牆</text><text x="120" y="80" font-size="17" fill="#17334b" text-anchor="middle">有向右推力</text><text x="272" y="120" font-size="17" fill="#17334b" text-anchor="middle">水平合力為0</text><text x="200" y="380" font-size="22" fill="#17334b" text-anchor="middle">D 錯：離牆後不再變快</text></g></svg>