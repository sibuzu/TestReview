<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>岩石圈與板塊的厚度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="rock" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M3 5l4 3m3 4l3-4" stroke="#706a68" stroke-width="1" opacity=".3"/></pattern><linearGradient id="mantle" x2="0" y2="1"><stop stop-color="#f2d3aa"/><stop offset="1" stop-color="#e2ac78"/></linearGradient></defs><rect width="360" height="360" rx="16" fill="#f4f8f5"/><text x="180" y="36" text-anchor="middle" fill="#28465a" font-size="23" font-family="sans-serif">板塊就是岩石圈區塊</text><rect x="25" y="95" width="310" height="38" fill="#c5ac85"/><rect x="25" y="134" width="310" height="95" fill="#8b9c9e"/><rect x="25" y="230" width="310" height="84" fill="url(#mantle)"/><path d="M166 95V229" fill="none" stroke="#28465a" stroke-width="5" stroke-linejoin="round"/><text x="95" y="121" text-anchor="middle" fill="#28465a" font-size="22" font-family="sans-serif">地殼</text><text x="180" y="187" text-anchor="middle" fill="#28465a" font-size="22" font-family="sans-serif">上部地函堅硬層</text><text x="180" y="280" text-anchor="middle" fill="#ce704a" font-size="24" font-family="sans-serif">軟流圈</text><path d="M18 95H9V229H18M340 95H350V229H340" fill="none" stroke="#37816c" stroke-width="4" stroke-linejoin="round"/><text x="95" y="72" text-anchor="middle" fill="#37816c" font-size="22" font-family="sans-serif">板塊甲</text><text x="255" y="72" text-anchor="middle" fill="#37816c" font-size="22" font-family="sans-serif">板塊乙</text><text x="180" y="342" text-anchor="middle" fill="#28465a" font-size="21" font-family="sans-serif">同處厚度：板塊＝岩石圈</text></svg>