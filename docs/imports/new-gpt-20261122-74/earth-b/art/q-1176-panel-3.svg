<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>原選項B張裂、C與D水平錯動的運動關係</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f7"/><text x="180" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#243f50">B、C、D不是隱沒</text><text x="90" y="72" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#243f50">B：張裂</text><g transform="translate(0 85) scale(.45)"><rect x="15" y="70" width="330" height="95" fill="#d5e9f0" stroke="none"/><rect x="15" y="173" width="330" height="110" fill="#ecd0a8" stroke="none"/><path d="M15 155H120L176 121L232 155H345V175H230L176 141L122 175H15Z" fill="#8ba9bc" stroke="#377da1" stroke-width="2" stroke-linejoin="round"/><path d="M176 270V140" fill="none" stroke="#bf593b" stroke-width="9" stroke-linejoin="round"/><path d="M176 220L176 145" fill="none" stroke="#bf593b" stroke-width="4" marker-end="url(#arrow)"/><path d="M142 90L48 90" fill="none" stroke="#377da1" stroke-width="5" marker-end="url(#arrow)"/><path d="M210 90L308 90" fill="none" stroke="#377da1" stroke-width="5" marker-end="url(#arrow)"/></g><text x="271" y="72" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#243f50">C、D：水平錯動</text><rect x="207" y="150" width="47" height="90" fill="#92b5b3" stroke="#243f50"/><rect x="264" y="135" width="47" height="90" fill="#b7bc91" stroke="#243f50"/><path d="M230 215L230 166" fill="none" stroke="#16816e" stroke-width="4" marker-end="url(#arrow)"/><path d="M288 154L288 203" fill="none" stroke="#16816e" stroke-width="4" marker-end="url(#arrow)"/><text x="90" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#377da1">←   →</text><text x="270" y="295" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#243f50">交界兩側平行錯移</text><text x="180" y="340" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#243f50">以淺源地震為主</text></svg>