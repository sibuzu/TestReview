<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>以海底中洋脊隆起定位板塊交界</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f7"/><text x="180" y="30" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#243f50">圖（一）：海底中央隆起</text><rect x="15" y="95" width="330" height="95" fill="#d5e9f0" stroke="none"/><rect x="15" y="198" width="330" height="110" fill="#ecd0a8" stroke="none"/><path d="M15 180H120L176 146L232 180H345V200H230L176 166L122 200H15Z" fill="#8ba9bc" stroke="#377da1" stroke-width="2" stroke-linejoin="round"/><path d="M176 295V165" fill="none" stroke="#bf593b" stroke-width="9" stroke-linejoin="round"/><path d="M176 245L176 170" fill="none" stroke="#bf593b" stroke-width="4" marker-end="url(#arrow)"/><text x="176" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#243f50">板塊交界</text><path d="M176 122L176 143" fill="none" stroke="#243f50" stroke-width="2" marker-end="url(#arrow)"/><text x="62" y="76" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#377da1">海水</text><text x="180" y="327" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#243f50">辨認中洋脊，才判運動</text></svg>