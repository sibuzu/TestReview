<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>中洋脊兩側向外張裂的方向</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f7"/><text x="180" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#243f50">兩側板塊各自向外</text><rect x="15" y="95" width="330" height="95" fill="#d5e9f0" stroke="none"/><rect x="15" y="198" width="330" height="110" fill="#ecd0a8" stroke="none"/><path d="M15 180H120L176 146L232 180H345V200H230L176 166L122 200H15Z" fill="#8ba9bc" stroke="#377da1" stroke-width="2" stroke-linejoin="round"/><path d="M176 295V165" fill="none" stroke="#bf593b" stroke-width="9" stroke-linejoin="round"/><path d="M176 245L176 170" fill="none" stroke="#bf593b" stroke-width="4" marker-end="url(#arrow)"/><path d="M142 115L48 115" fill="none" stroke="#377da1" stroke-width="5" marker-end="url(#arrow)"/><path d="M210 115L308 115" fill="none" stroke="#377da1" stroke-width="5" marker-end="url(#arrow)"/><text x="79" y="98" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#377da1">左側←</text><text x="283" y="98" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#377da1">右側→</text><text x="180" y="330" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#243f50">張裂，不能貼成向內聚合</text></svg>