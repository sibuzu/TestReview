<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img">
  <title>三條按同一比例繪製、分成等切線段的長度條，對應 AB、BC、AC。</title>
  <rect width="300" height="260" rx="17" fill="#f7fafc"/>
  <g stroke-linecap="round" stroke-linejoin="round" font-family="DejaVu Sans, Arial, sans-serif" font-weight="650">
  <text x="27.0000" y="74.0000" font-size="19" text-anchor="middle" fill="#213248">AB</text>
  <rect x="57" y="51" width="60" height="32" rx="0" stroke="#ffffff" stroke-width="1.3" fill="#155eb4"/>
  <text x="87.0000" y="74.0000" font-size="18" text-anchor="middle" fill="#ffffff">4k</text>
  <rect x="117" y="51" width="120" height="32" rx="0" stroke="#ffffff" stroke-width="1.3" fill="#087971"/>
  <text x="177.0000" y="74.0000" font-size="18" text-anchor="middle" fill="#ffffff">8k</text>
  <text x="257.0000" y="74.0000" font-size="18" text-anchor="middle" fill="#213248">12k</text>
  <text x="27.0000" y="141.0000" font-size="19" text-anchor="middle" fill="#213248">BC</text>
  <rect x="57" y="118" width="120" height="32" rx="0" stroke="#ffffff" stroke-width="1.3" fill="#087971"/>
  <text x="117.0000" y="141.0000" font-size="18" text-anchor="middle" fill="#ffffff">8k</text>
  <rect x="177" y="118" width="45" height="32" rx="0" stroke="#ffffff" stroke-width="1.3" fill="#ad5616"/>
  <text x="199.5000" y="141.0000" font-size="18" text-anchor="middle" fill="#ffffff">3k</text>
  <text x="257.0000" y="141.0000" font-size="18" text-anchor="middle" fill="#213248">11k</text>
  <text x="27.0000" y="208.0000" font-size="19" text-anchor="middle" fill="#213248">AC</text>
  <rect x="57" y="185" width="60" height="32" rx="0" stroke="#ffffff" stroke-width="1.3" fill="#155eb4"/>
  <text x="87.0000" y="208.0000" font-size="18" text-anchor="middle" fill="#ffffff">4k</text>
  <rect x="117" y="185" width="45" height="32" rx="0" stroke="#ffffff" stroke-width="1.3" fill="#ad5616"/>
  <text x="139.5000" y="208.0000" font-size="18" text-anchor="middle" fill="#ffffff">3k</text>
  <text x="257.0000" y="208.0000" font-size="18" text-anchor="middle" fill="#213248">7k</text>
  <text x="150.0000" y="243.0000" font-size="20" text-anchor="middle" fill="#213248">30k = 60</text>
  </g>
</svg>
