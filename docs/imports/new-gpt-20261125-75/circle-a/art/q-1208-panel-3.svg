<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img">
  <title>依比例排列 AD、AE 與 BC 的分段長條。AD、AE 兩條長度均為 6。</title>
  <rect width="300" height="260" rx="17" fill="#f7fafc"/>
  <g stroke-linecap="round" stroke-linejoin="round" font-family="DejaVu Sans, Arial, sans-serif" font-weight="650">
  <text x="33.0000" y="94.0000" font-size="19" text-anchor="middle" fill="#213248">AD</text>
  <rect x="61" y="72" width="87" height="29" rx="0" stroke="#ffffff" stroke-width="1.1" fill="#155eb4"/>
  <text x="104.5000" y="93.0000" font-size="19" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="148" y="72" width="87" height="29" rx="0" stroke="#ffffff" stroke-width="1.1" fill="#087971"/>
  <text x="191.5000" y="93.0000" font-size="19" text-anchor="middle" fill="#ffffff">3</text>
  <text x="267.0000" y="94.0000" font-size="20" text-anchor="middle" fill="#213248">6</text>
  <text x="33.0000" y="159.0000" font-size="19" text-anchor="middle" fill="#213248">AE</text>
  <rect x="61" y="137" width="116" height="29" rx="0" stroke="#ffffff" stroke-width="1.1" fill="#155eb4"/>
  <text x="119.0000" y="158.0000" font-size="19" text-anchor="middle" fill="#ffffff">4</text>
  <rect x="177" y="137" width="58" height="29" rx="0" stroke="#ffffff" stroke-width="1.1" fill="#ad5616"/>
  <text x="206.0000" y="158.0000" font-size="19" text-anchor="middle" fill="#ffffff">2</text>
  <text x="267.0000" y="159.0000" font-size="20" text-anchor="middle" fill="#213248">6</text>
  <text x="33.0000" y="224.0000" font-size="19" text-anchor="middle" fill="#213248">BC</text>
  <rect x="61" y="202" width="87" height="29" rx="0" stroke="#ffffff" stroke-width="1.1" fill="#087971"/>
  <text x="104.5000" y="223.0000" font-size="19" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="148" y="202" width="58" height="29" rx="0" stroke="#ffffff" stroke-width="1.1" fill="#ad5616"/>
  <text x="177.0000" y="223.0000" font-size="19" text-anchor="middle" fill="#ffffff">2</text>
  <text x="267.0000" y="224.0000" font-size="20" text-anchor="middle" fill="#213248">5</text>
  <text x="148.0000" y="41.0000" font-size="24" text-anchor="middle" fill="#7243a0">AD = AE</text>
  </g>
</svg>
