<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img">
  <title>兩個不同角度的相似直角三角形，標出 BD 對應到 4 和 9，形成連比。</title>
  <rect width="300" height="260" rx="17" fill="#f7fafc"/>
  <g stroke-linecap="round" stroke-linejoin="round" font-family="DejaVu Sans, Arial, sans-serif" font-weight="650">
  <path d="M 48.0000 186.0000 L 168.0000 186.0000 L 48.0000 106.0000 Z" stroke="#155eb4" stroke-width="2.8" fill="#dcecff"/>
  <path d="M 59.0000 186.0000 L 59.0000 175.0000 L 48.0000 175.0000" stroke="#647990" stroke-width="1.9" fill="none"/>
  <text x="102.0000" y="210.0000" font-size="21" text-anchor="middle" fill="#087971">BD</text>
  <text x="34.0000" y="147.0000" font-size="20" text-anchor="middle" fill="#155eb4">4</text>
  <path d="M 255.0000 69.0000 L 255.0000 189.0000 L 175.0000 69.0000 Z" stroke="#ad5616" stroke-width="2.8" fill="#ffecd4"/>
  <path d="M 255.0000 80.0000 L 244.0000 80.0000 L 244.0000 69.0000" stroke="#647990" stroke-width="1.9" fill="none"/>
  <text x="272.0000" y="124.0000" font-size="20" text-anchor="middle" fill="#ad5616">9</text>
  <text x="220.0000" y="56.0000" font-size="21" text-anchor="middle" fill="#087971">BD</text>
  <text x="150.0000" y="243.0000" font-size="22" text-anchor="middle" fill="#213248">BD² = 4 × 9</text>
  </g>
</svg>
