<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>同質量時 a 隨 F 增加</title><desc>質量固定為0.1 kg，比值 F/m 決定加速度。圖上10 N對到100 m/s²。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">同質量時 a 隨 F 增加</text><path d="M59 261 L282.0 261.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M285 261 L273.47 267.00 L273.47 255.00 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M59 261 L59.0 96.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M59 93 L65.00 104.53 L53.00 104.53 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="285" y="308" text-anchor="end" fill="#466176" font-size="18" font-weight="700">力 F (N)</text><text x="67" y="86" text-anchor="start" fill="#466176" font-size="18" font-weight="700">加速度 a (m/s²)</text><path d="M59 261 L238 113" fill="none" stroke="#087f77" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M59 117 L234 117" fill="none" stroke="#466176" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M234 117 L234 260" fill="none" stroke="#466176" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="234" cy="117" r="7" fill="#e6ad3c" stroke="#193145" stroke-width="2"/><text x="47" y="122" text-anchor="end" fill="#193145" font-size="16" font-weight="700">100</text><text x="234" y="283" text-anchor="middle" fill="#193145" font-size="18" font-weight="700">10</text><text x="128" y="180" text-anchor="middle" fill="#193145" font-size="18" font-weight="700">m ＝ 0.1 kg</text></svg>
