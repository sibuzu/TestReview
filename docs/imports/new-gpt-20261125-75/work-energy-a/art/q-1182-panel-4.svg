<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>用夾角判斷是否作功</title><desc>力沿位移的分量有正值時作正功；夾角90°時，力沿位移的分量為零。圖以固定力大小示意。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">用夾角判斷是否作功</text><path d="M64 241 L283.0 241.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M286 241 L274.47 247.00 L274.47 235.00 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M64 241 L64.0 96.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M64 93 L70.00 104.53 L58.00 104.53 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="286" y="288" text-anchor="end" fill="#466176" font-size="18" font-weight="700">力與位移的夾角</text><text x="72" y="86" text-anchor="start" fill="#466176" font-size="18" font-weight="700">力沿位移的分量</text><path d="M64 106 C152 110 223 155 267 241" fill="none" stroke="#087f77" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M64 106 L64 241" fill="none" stroke="#466176" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><circle cx="64" cy="106" r="6" fill="#e6ad3c" stroke="#193145" stroke-width="2"/><circle cx="267" cy="241" r="6" fill="#e6ad3c" stroke="#193145" stroke-width="2"/><text x="75" y="221" text-anchor="start" fill="#087f77" font-size="18" font-weight="700">有正分量</text><text x="267" y="225" text-anchor="end" fill="#087f77" font-size="19" font-weight="700">分量＝0</text><text x="64" y="269" text-anchor="middle" fill="#193145" font-size="17" font-weight="700">0°</text><text x="267" y="269" text-anchor="middle" fill="#193145" font-size="17" font-weight="700">90°</text></svg>
