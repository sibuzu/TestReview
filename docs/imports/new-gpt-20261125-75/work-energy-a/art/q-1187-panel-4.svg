<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>兩份動能相等</title><desc>相同質量與速率得到相同的正動能。改變方向不會讓動能變負。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">兩份動能相等</text><circle cx="97" cy="122" r="28" fill="#155ba5" stroke="#193145" stroke-width="2"/><text x="97" y="130" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">甲</text><text x="97" y="181" text-anchor="middle" fill="#155ba5" font-size="22" font-weight="700">＋v</text><rect x="48" y="188" width="98" height="44" rx="7" fill="#fff" stroke="#193145" stroke-width="2" stroke-dasharray=""/><rect x="55" y="195" width="84" height="30" rx="4" fill="#155ba5" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="97" y="217" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">½mv²</text><circle cx="222" cy="122" r="28" fill="#087f77" stroke="#193145" stroke-width="2"/><text x="222" y="130" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">乙</text><text x="222" y="181" text-anchor="middle" fill="#087f77" font-size="22" font-weight="700">−v</text><rect x="173" y="188" width="98" height="44" rx="7" fill="#fff" stroke="#193145" stroke-width="2" stroke-dasharray=""/><rect x="180" y="195" width="84" height="30" rx="4" fill="#087f77" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="222" y="217" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">½mv²</text><text x="160" y="218" text-anchor="middle" fill="#193145" font-size="19" font-weight="700">＝</text><text x="159" y="275" text-anchor="middle" fill="#193145" font-size="21" font-weight="700">兩份動能都大於零</text></svg>
