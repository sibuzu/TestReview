<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a005" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" fill="#344f47"><text x="90" y="17" text-anchor="middle" font-size="11">三個有色三角形面積相等</text><path d="M10 45L10 106.8034L108.8854 45Z" fill="#f0e4ce"/><path d="M10 145H170L10 106.8034Z" fill="#e6edf0"/><path d="M170 145V45H108.8854Z" fill="#e8eedf"/><path d="M10 45H170V145H10Z M10 106.8034L108.8854 45L170 145Z" fill="none" stroke="#58776c" stroke-width="1.8"/><text x="1" y="41" font-size="12">A</text><text x="169" y="41" font-size="11">D</text><text x="1" y="158" font-size="12">B</text><text x="169" y="158" font-size="11">C</text><text x="1" y="110" font-size="12">P</text><text x="103" y="39" font-size="12">Q</text><text x="41" y="69" font-size="15" fill="#b47a39">S</text><text x="64" y="135" font-size="15" fill="#4b8790">S</text><text x="147" y="81" font-size="15" fill="#58776c">S</text><text x="90" y="179" text-anchor="middle" font-size="11">P在AB；Q在AD</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="18" font-size="12">各取垂直的底與高</text><rect x="9" y="35" width="162" height="35" rx="6" fill="#e6edf0"/><text x="90" y="58" font-size="15">△BCP：by／2</text><rect x="9" y="81" width="162" height="35" rx="6" fill="#e8eedf"/><text x="90" y="104" font-size="15">△CDQ：a(b−x)／2</text><rect x="9" y="127" width="162" height="35" rx="6" fill="#f0e4ce"/><text x="90" y="150" font-size="15">△APQ：(a−y)x／2</text><text x="90" y="179" font-size="10">同乘2，面積相等關係不變</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="18" font-size="12">令t＝x／b，取正根</text><rect x="12" y="34" width="156" height="32" rx="6" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="56" font-size="17">t²＋t−1＝0</text><path d="M90 69V80" stroke="#718c7e" stroke-width="1.5" marker-end="url(#a005)"/><rect x="12" y="85" width="156" height="32" rx="6" fill="#f0e4ce" stroke="#b47a39"/><text x="90" y="107" font-size="16">t＝(√5−1)／2</text><path d="M90 120V131" stroke="#718c7e" stroke-width="1.5" marker-end="url(#a005)"/><rect x="12" y="136" width="156" height="32" rx="6" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="158" font-size="15">t／(1−t)＝1／t</text></g></svg>