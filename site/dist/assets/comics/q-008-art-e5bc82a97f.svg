<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="Arial,sans-serif"><rect x="0" width="180" height="180" fill="#eff3e9"/><text x="90" y="20" font-size="10" text-anchor="middle" fill="#244b50">先檢查：底不一定是3和4</text><text x="29" y="42" font-size="8" text-anchor="middle" fill="#244b50">兩底</text><text x="83" y="42" font-size="8" text-anchor="middle" fill="#244b50">兩腰、底差</text><text x="145" y="42" font-size="8" text-anchor="middle" fill="#244b50">能圍三角形？</text><text x="29" y="61" font-size="9" text-anchor="middle" fill="#244b50">1,2</text><text x="83" y="61" font-size="9" text-anchor="middle" fill="#244b50">3,4,1</text><text x="145" y="61" font-size="9" text-anchor="middle" fill="#8d766b">不行</text><text x="29" y="78" font-size="9" text-anchor="middle" fill="#244b50">1,3</text><text x="83" y="78" font-size="9" text-anchor="middle" fill="#244b50">2,4,2</text><text x="145" y="78" font-size="9" text-anchor="middle" fill="#8d766b">不行</text><rect x="8" y="84" width="164" height="16" rx="3" fill="#d6e5c2"/><text x="29" y="95" font-size="9" text-anchor="middle" fill="#244b50">1,4</text><text x="83" y="95" font-size="9" text-anchor="middle" fill="#244b50">2,3,3</text><text x="145" y="95" font-size="9" text-anchor="middle" fill="#3e743f">可以</text><text x="29" y="112" font-size="9" text-anchor="middle" fill="#244b50">2,3</text><text x="83" y="112" font-size="9" text-anchor="middle" fill="#244b50">1,4,1</text><text x="145" y="112" font-size="9" text-anchor="middle" fill="#8d766b">不行</text><text x="29" y="129" font-size="9" text-anchor="middle" fill="#244b50">2,4</text><text x="83" y="129" font-size="9" text-anchor="middle" fill="#244b50">1,3,2</text><text x="145" y="129" font-size="9" text-anchor="middle" fill="#8d766b">不行</text><text x="29" y="146" font-size="9" text-anchor="middle" fill="#244b50">3,4</text><text x="83" y="146" font-size="9" text-anchor="middle" fill="#244b50">1,2,1</text><text x="145" y="146" font-size="9" text-anchor="middle" fill="#8d766b">不行</text><text x="90" y="174" font-size="9" text-anchor="middle" fill="#244b50">三角形：任兩邊和＞第三邊</text><rect x="180" width="180" height="180" fill="#edf1f7"/><text x="270" y="20" font-size="10" text-anchor="middle" fill="#244b50">平移一腰，變成底差三角形</text><polygon points="222.66666666666666,62.54583942191206 202,121 326,121 253.66666666666669,62.54583942191206" fill="#f8faf5" stroke="#829789" stroke-width="1.7"/><text x="219.66666666666666" y="55.54583942191206" text-anchor="middle" font-size="8" fill="#244b50">A</text><text x="195" y="131" text-anchor="middle" font-size="8" fill="#244b50">B</text><text x="333" y="131" text-anchor="middle" font-size="8" fill="#244b50">C</text><text x="256.6666666666667" y="55.54583942191206" text-anchor="middle" font-size="8" fill="#244b50">D</text><text x="297" y="134" text-anchor="middle" font-size="8" fill="#244b50">T</text><path d="M222.66666666666666 62.54583942191206L295 121" fill="none" stroke="#588aa3" stroke-width="1.8" stroke-dasharray="3 2"/><path d="M222.66666666666666 62.54583942191206L253.66666666666669 62.54583942191206" fill="none" stroke="#8aa763" stroke-width="2.8" /><path d="M295 121L326 121" fill="none" stroke="#8aa763" stroke-width="2.8" /><text x="238" y="53" font-size="10" text-anchor="middle" fill="#244b50">1</text><text x="311" y="141" font-size="10" text-anchor="middle" fill="#244b50">1</text><text x="204" y="92" font-size="10" text-anchor="middle" fill="#244b50">2</text><text x="312" y="90" font-size="10" text-anchor="middle" fill="#244b50">3</text><text x="262" y="95" font-size="10" text-anchor="middle" fill="#244b50">3</text><text x="246" y="142" font-size="10" text-anchor="middle" fill="#244b50">3</text><text x="270" y="159" font-size="10" text-anchor="middle" fill="#244b50">AT∥DC，AT＝3</text><text x="270" y="175" font-size="10" text-anchor="middle" fill="#244b50">BT＝4−1＝3</text><rect x="360" width="180" height="180" fill="#faf1e4"/><text x="450" y="20" font-size="10" text-anchor="middle" fill="#244b50">底差3，用畢氏定理求高</text><polygon points="413.6666666666667,45.57527667343493 387,121 507,121" fill="#f8faf5" stroke="#829789" stroke-width="1.7"/><text x="410.6666666666667" y="38.57527667343493" text-anchor="middle" font-size="8" fill="#244b50">A</text><text x="380" y="131" text-anchor="middle" font-size="8" fill="#244b50">B</text><text x="509" y="134" text-anchor="middle" font-size="8" fill="#244b50">T</text><text x="413.6666666666667" y="134" text-anchor="middle" font-size="8" fill="#244b50">H</text><path d="M413.6666666666667 45.57527667343493L413.6666666666667 121" fill="none" stroke="#588aa3" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M413.6666666666667 116h5v5" fill="none" stroke="#588aa3" stroke-width=".8"/><text x="395" y="81" font-size="10" text-anchor="middle" fill="#244b50">2</text><text x="466" y="81" font-size="10" text-anchor="middle" fill="#244b50">3</text><text x="424" y="103" font-size="10" text-anchor="middle" fill="#244b50">h</text><text x="399" y="147" font-size="10" text-anchor="middle" fill="#244b50">x</text><text x="460" y="147" font-size="10" text-anchor="middle" fill="#244b50">3−x</text><text x="450" y="169" font-size="11" text-anchor="middle" fill="#244b50">x＝⅔，h＝4√2／3</text></g></svg>