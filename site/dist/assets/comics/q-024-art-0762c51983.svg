<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="何陋之有賓語前置、ABC同為助詞、D之代替所學內容的句法圖">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526d66"/></marker></defs>
<g font-family="Noto Sans CJK TC,Noto Sans TC,sans-serif" text-anchor="middle" fill="#203e36" stroke-linejoin="round">
<rect width="180" height="180" fill="#f5f1e8"/><text x="90" y="19" font-size="13" font-weight="700">通常語序：有何陋</text><g stroke="#71897c" stroke-width="1.2"><rect x="13" y="32" width="44" height="29" rx="5" fill="#e2eaf5"/><rect x="84" y="32" width="81" height="29" rx="5" fill="#f6e6d6"/><rect x="10" y="107" width="58" height="30" rx="5" fill="#f6e6d6"/><rect x="78" y="107" width="28" height="30" rx="5" fill="#d1e9d4"/><rect x="116" y="107" width="51" height="30" rx="5" fill="#e2eaf5"/></g><g font-size="15" font-weight="700"><text x="35" y="52">有</text><text x="124" y="52">何陋</text><text x="39" y="128">何陋</text><text x="92" y="128">之</text><text x="141" y="128">有</text></g><g font-size="11.5"><text x="35" y="77">動詞</text><text x="124" y="77">賓語</text></g><text x="90" y="97" font-size="12">賓語移前</text><text x="90" y="159" font-size="14" font-weight="700">之：助詞</text><text x="90" y="175" font-size="10.5">標示賓語前置</text>
<g transform="translate(180)"><rect width="180" height="180" fill="#edf3ef"/><text x="90" y="17" font-size="11.5">作用未必完全相同</text><g stroke="#71897c" stroke-width="1.2" fill="white"><rect x="29" y="29" width="53" height="29" rx="4"/><rect x="29" y="70" width="53" height="29" rx="4"/><rect x="29" y="111" width="53" height="29" rx="4"/><rect x="123" y="29" width="47" height="29" rx="4"/><rect x="123" y="70" width="47" height="29" rx="4"/><rect x="123" y="111" width="47" height="29" rx="4"/><g fill="#d1e9d4"><rect x="90" y="29" width="25" height="29" rx="4"/><rect x="90" y="70" width="25" height="29" rx="4"/><rect x="90" y="111" width="25" height="29" rx="4"/></g></g><g font-size="14"><text x="13" y="50">A</text><text x="13" y="91">B</text><text x="13" y="132">C</text><text x="55" y="50">絲竹</text><text x="55" y="91">案牘</text><text x="55" y="132">蓮</text><text x="102" y="50" font-weight="700">之</text><text x="102" y="91" font-weight="700">之</text><text x="102" y="132" font-weight="700">之</text><text x="146" y="50">亂耳</text><text x="146" y="91">勞形</text><text x="146" y="132">愛</text></g><text x="90" y="167" font-size="14" font-weight="700">詞性：都屬助詞</text></g>
<g transform="translate(360)"><rect width="180" height="180" fill="#f6f0e8"/><text x="90" y="20" font-size="15" font-weight="700">D：學而時習之</text><g stroke="#71897c" stroke-width="1.3"><rect x="14" y="39" width="42" height="29" rx="5" fill="#e2eaf5"/><rect x="88" y="39" width="70" height="29" rx="5" fill="#f6dfbd"/><rect x="14" y="109" width="42" height="31" rx="5" fill="#e2eaf5"/><rect x="77" y="109" width="92" height="31" rx="5" fill="#f6dfbd"/></g><g font-size="15" font-weight="700"><text x="35" y="59">習</text><text x="123" y="59">之</text><text x="35" y="131">習</text><text x="123" y="130" font-size="13">所學內容</text></g><path d="M123 69V108" fill="none" stroke="#526d66" stroke-width="1.7" marker-end="url(#a)"/><text x="53" y="92" font-size="12">替換指代</text><text x="90" y="167" font-size="14" font-weight="700">之：代詞，作賓語</text></g>
