<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="孟初農曆七月，仲中農曆八月，季末農曆九月，不是西曆月份"><rect width="900" height="300" fill="#faf8ed"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#294c48}.h{font-size:26px;font-weight:700}.w{font-size:24px;font-weight:700}.s{font-size:20px}</style><g id="season-0" transform="translate(0 0)"><text x="150" y="37" class="h">孟＝初</text><rect x="39" y="64" width="222" height="168" rx="15" fill="#dfeadb" stroke="#939e87" stroke-width="2"/><path d="M39 112 H261" stroke="#939e87" stroke-width="2"/><path d="M86 54 V79 M214 54 V79" stroke="#939e87" stroke-width="7" stroke-linecap="round"/><text x="150" y="98" class="s">農曆</text><text x="150" y="191" style="font-size:60px;font-weight:700">七月</text><text x="150" y="275" class="w">秋季第一月</text></g><g id="season-1" transform="translate(300 0)"><text x="150" y="37" class="h">仲＝中</text><rect x="39" y="64" width="222" height="168" rx="15" fill="#eee5d4" stroke="#939e87" stroke-width="2"/><path d="M39 112 H261" stroke="#939e87" stroke-width="2"/><path d="M86 54 V79 M214 54 V79" stroke="#939e87" stroke-width="7" stroke-linecap="round"/><text x="150" y="98" class="s">農曆</text><text x="150" y="191" style="font-size:60px;font-weight:700">八月</text><text x="150" y="275" class="w">秋季第二月</text></g><g id="season-2" transform="translate(600 0)"><text x="150" y="37" class="h">季＝末</text><rect x="39" y="64" width="222" height="168" rx="15" fill="#e9dfd6" stroke="#939e87" stroke-width="2"/><path d="M39 112 H261" stroke="#939e87" stroke-width="2"/><path d="M86 54 V79 M214 54 V79" stroke="#939e87" stroke-width="7" stroke-linecap="round"/><text x="150" y="98" class="s">農曆</text><text x="150" y="191" style="font-size:60px;font-weight:700">九月</text><text x="150" y="275" class="w">秋季第三月</text></g></svg>