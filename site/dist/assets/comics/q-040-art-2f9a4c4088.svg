<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="sans-serif" fill="#294638" text-anchor="middle"><rect width="180" height="180" fill="#eef3e9"/><text x="90" y="22" font-size="13">兩杯都是水，冰都浮著</text><path d="M12 62V149H78V62" fill="none" stroke="#657e76" stroke-width="2"/><rect x="13" y="100" width="64" height="48" fill="#91c4d9"/><text x="45" y="53" font-size="14">甲</text><path d="M9 100H21M69 100H81" stroke="#b78748" stroke-width="2"/><rect x="30" y="88" width="30" height="30" fill="#d8eef0" fill-opacity=".85" stroke="#6e9eae" stroke-width="1.5"/><circle cx="45" cy="103" r="8" fill="white" stroke="#8fb0bd" stroke-width="1.3"/><path d="M102 62V149H168V62" fill="none" stroke="#657e76" stroke-width="2"/><rect x="103" y="96" width="64" height="52" fill="#91c4d9"/><text x="135" y="53" font-size="14">乙</text><path d="M99 96H111M159 96H171" stroke="#b78748" stroke-width="2"/><rect x="120" y="93" width="30" height="30" fill="#d8eef0" fill-opacity=".85" stroke="#6e9eae" stroke-width="1.5"/><text x="90" y="172" font-size="11">甲含氣泡；示意不按比例</text></g><g transform="translate(180)" font-family="sans-serif" fill="#294638" text-anchor="middle"><rect width="180" height="180" fill="#f6efdf"/><text x="90" y="22" font-size="13">看同一冰塊的重量</text><text x="90" y="56" font-size="14">原排水量＝融化水量</text><path d="M20 78V132H69V78M111 78V132H160V78" stroke="#6d837d" stroke-width="1.5" fill="none"/><path d="M21 96H68V131H21ZM112 96H159V131H112Z" fill="#91c4d9"/><text x="90" y="115" font-size="19">＝</text><text x="44" y="152" font-size="12">原排水量</text><text x="136" y="152" font-size="12">融化水量</text><text x="90" y="174" font-size="10">忽略氣泡中空氣重量</text></g><g transform="translate(360)" font-family="sans-serif" fill="#294638" text-anchor="middle"><rect width="180" height="180" fill="#edf1f7"/><text x="90" y="22" font-size="13">融化後，各自水位不變</text><path d="M12 62V149H78V62" fill="none" stroke="#657e76" stroke-width="2"/><rect x="13" y="100" width="64" heigh