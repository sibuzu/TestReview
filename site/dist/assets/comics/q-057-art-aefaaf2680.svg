<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="11" fill="#244b50">先讀題幹因果</text><rect x="12" y="35" width="156" height="29" rx="5" fill="#dce8d0"/><text x="90" y="54" text-anchor="middle" font-size="11" fill="#244b50">產業用水需求增加</text><path d="M90 66v18m-4-5 4 5 4-5" fill="none" stroke="#7b9988" stroke-width="1.5" /><rect x="12" y="89" width="156" height="29" rx="5" fill="#dce8d0"/><text x="90" y="108" text-anchor="middle" font-size="11" fill="#244b50">超量抽取地下水</text><path d="M90 120v18m-4-5 4 5 4-5" fill="none" stroke="#7b9988" stroke-width="1.5" /><rect x="12" y="143" width="156" height="29" rx="5" fill="#dce8d0"/><text x="90" y="162" text-anchor="middle" font-size="11" fill="#244b50">地層下陷</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#244b50">海面不變，陸地下陷</text><path d="M190 70L350 150V160H190Z" fill="#d4c19e"/><path d="M230 90H350V150Z" fill="#a9d2e0"/><path d="M190 45L350 125" fill="none" stroke="#a78c6a" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M190 70L350 150" fill="none" stroke="#956b36" stroke-width="2" /><path d="M228 90H351" fill="none" stroke="#3e819b" stroke-width="1.2" /><circle cx="280" cy="90" r="3" fill="#927b60"/><circle cx="230" cy="90" r="3" fill="#a36132"/><path d="M276 106H235m5-4-5 4 5 4" fill="none" stroke="#ad6f37" stroke-width="2" /><text x="293" y="79" text-anchor="middle" font-size="10" fill="#244b50">同一海面</text><text x="282" y="124" text-anchor="middle" font-size="10" fill="#244b50">岸線往陸側</text><text x="222" y="46" text-anchor="middle" font-size="9" fill="#244b50">原地面</text><text x="225" y="145" text-anchor="middle" font-size="9" fill="#244b50">下陷後</text><text x="270" y="177" text-anchor="middle" font-size="9" fill="#244b50">概念剖面，非實際比例</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#244b50">沿海相對高度降低</text><rect x="372" y="34" width="156" height="29" rx="5" fill="#dce8ef"/><text x="450" y="53" text-anchor="middle" font-size="11" fill="#244b50">受淹、海水入侵風險增加</text><path d="M450 66v19m-4-5 4 5 4-5" fill="none" stroke="#7b9988" stroke-width="1.5" /><rect x="372" y="90" width="156" height="29" rx="5" fill="#dce8d0"/><text x="450" y="109" text-anchor="middle" font-size="11" fill="#244b50">海岸線可能向陸側後退</text><text x="450" y="147" text-anchor="middle" font-size="10" fill="#244b50">不是所有災害都能推得</text><text x="450" y="174" text-anchor="middle" font-size="11" fill="#244b50">D 與題幹因果最直接</text></g></svg>