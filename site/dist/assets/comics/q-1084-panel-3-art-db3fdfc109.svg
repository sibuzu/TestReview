<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360"><title>否定置於to前，阻止透露資料的動作</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="360" height="360" fill="#f5f8f6"/><text x="180" y="35" fill="#263e48" font-family="sans-serif" font-size="26" text-anchor="middle">先加否定，再接動作</text><circle cx="65" cy="180" r="35" fill="#dfebdd"/><text x="65" y="190" fill="#263e48" font-family="sans-serif" font-size="27" text-anchor="middle">us</text><path d="M100,180L145,180" fill="none" stroke="#2877ad" stroke-width="4" marker-end="url(#arr)" /><path d="M160 110L205 95L250 110V190Q240 235 205 255Q170 235 160 190Z" fill="#efdfdc" stroke="#b46b7c" stroke-width="4"/><text x="205" y="178" fill="#a94c65" font-family="sans-serif" font-size="30" text-anchor="middle">not</text><path d="M255,180L320,180" fill="none" stroke="#308b6c" stroke-width="4" marker-end="url(#arr)" /><text x="300" y="130" fill="#263e48" font-family="sans-serif" font-size="24" text-anchor="middle">to give</text><text x="180" y="325" fill="#263e48" font-family="sans-serif" font-size="26" text-anchor="middle">not 放在 to 前面</text></svg>