<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img"><title>質量與加速度的數量比較長條圖</title><rect width="400" height="400" rx="18" fill="#f8fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="200" y="38" font-size="20" fill="#17334b" text-anchor="middle">F 固定：質量增、加速度減</text><text x="50" y="115" font-size="20" fill="#17334b" text-anchor="middle">m</text><rect x="90" y="95" width="210" height="38" rx="5" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="310" y="122" font-size="19" fill="#17334b" text-anchor="start">a</text><text x="50" y="205" font-size="20" fill="#17334b" text-anchor="middle">2m</text><rect x="90" y="185" width="105.0" height="38" rx="5" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="205.0" y="212" font-size="19" fill="#17334b" text-anchor="start">a/2</text><text x="50" y="295" font-size="20" fill="#17334b" text-anchor="middle">4m</text><rect x="90" y="275" width="52.5" height="38" rx="5" fill="#93c5fd" stroke="#334155" stroke-width="2"/><text x="152.5" y="302" font-size="19" fill="#17334b" text-anchor="start">a/4</text><text x="200" y="365" font-size="23" fill="#17334b" text-anchor="middle">m × a = 固定的 F</text></g></svg>