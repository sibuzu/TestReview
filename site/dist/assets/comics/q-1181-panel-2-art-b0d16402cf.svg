<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>同一高度差的重力總功</title><desc>三球的質量和起終高度相同，所以重力從拋出到落地的總功皆為 mgh。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">同一高度差的重力總功</text><path d="M48 116 L292 116" fill="none" stroke="#adc4ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M48 246 L292 246" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M43 116 H28 V246 H43" fill="none" stroke="#193145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="18" y="182" text-anchor="middle" fill="#193145" font-size="20" font-weight="700">h</text><text x="161" y="284" text-anchor="middle" fill="#193145" font-size="20" font-weight="700">各球的重力總功 ＝ mgh</text><text x="80" y="104" text-anchor="middle" fill="#193145" font-size="22" font-weight="700">甲</text><circle cx="80" cy="123" r="8" fill="#e6ad3c" stroke="#193145" stroke-width="2"/><path d="M80 142 L80.0 223.0" fill="none" stroke="#b83a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M80 226 L73.69 213.88 L86.31 213.88 Z" fill="#b83a3c" stroke="#b83a3c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="169" y="104" text-anchor="middle" fill="#193145" font-size="22" font-weight="700">乙</text><circle cx="169" cy="123" r="8" fill="#e6ad3c" stroke="#193145" stroke-width="2"/><path d="M169 142 L169.0 223.0" fill="none" stroke="#155ba5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M169 226 L162.69 213.88 L175.31 213.88 Z" fill="#155ba5" stroke="#155ba5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="259" y="104" text-anchor="middle" fill="#193145" font-size="22" font-weight="700">丙</text><circle cx="259" cy="123" r="8" fill="#e6ad3c" stroke="#193145" stroke-width="2"/><path d="M259 142 L259.0 223.0" fill="none" stroke="#087f77" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M259 226 L252.69 213.88 L265.31 213.88 Z" fill="#087f77" stroke="#087f77" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></svg>
