<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>平均功率還要看時間</title><desc>全程總功一樣。甲飛最久、丙最快落地、乙居中，用 W/t 算平均功率得到B。圖上橫條表示相對大小。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">平均功率還要看時間</text><text x="124" y="87" text-anchor="middle" fill="#193145" font-size="20" font-weight="700">全程飛行時間</text><text x="251" y="87" text-anchor="middle" fill="#193145" font-size="20" font-weight="700">平均功率</text><path d="M199 96 L199 247" fill="none" stroke="#adc4ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="69" y="120" text-anchor="end" fill="#193145" font-size="19" font-weight="700">甲</text><rect x="79" y="103" width="118" height="21" rx="4" fill="#b83a3c" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="69" y="181" text-anchor="end" fill="#193145" font-size="19" font-weight="700">乙</text><rect x="79" y="164" width="88" height="21" rx="4" fill="#155ba5" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="69" y="242" text-anchor="end" fill="#193145" font-size="19" font-weight="700">丙</text><rect x="79" y="225" width="58" height="21" rx="4" fill="#087f77" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="209" y="103" width="39" height="21" rx="4" fill="#b83a3c" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="209" y="164" width="52" height="21" rx="4" fill="#155ba5" stroke="none" stroke-width="2" stroke-dasharray=""/><rect x="209" y="225" width="79" height="21" rx="4" fill="#087f77" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="281" text-anchor="middle" fill="#193145" font-size="21" font-weight="700">總功相同 ÷ 各自時間</text></svg>
