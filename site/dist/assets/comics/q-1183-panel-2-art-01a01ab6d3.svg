<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>把公斤重換成牛頓</title><desc>以 g＝9.8 m/s² 換算，10公斤重等於98 N。圖示公斤重的定義。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">把公斤重換成牛頓</text><path d="M47 100 H273 M160 100 V129 L146 142 L172 153 L147 166 L172 177 L160 187 V205" fill="none" stroke="#193145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><rect x="136" y="204" width="49" height="44" rx="5" fill="#d5ac5e" stroke="#193145" stroke-width="2" stroke-dasharray=""/><text x="160" y="232" text-anchor="middle" fill="#193145" font-size="16" font-weight="700">10 kg</text><path d="M184 209 L184.0 271.0" fill="none" stroke="#b83a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M184 274 L177.69 261.88 L190.31 261.88 Z" fill="#b83a3c" stroke="#b83a3c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="207" y="269" text-anchor="start" fill="#b83a3c" font-size="23" font-weight="700">98 N</text><text x="53" y="149" text-anchor="start" fill="#087f77" font-size="23" font-weight="700">10 kgw</text><text x="45" y="174" text-anchor="start" fill="#087f77" font-size="22" font-weight="700">＝98 N</text></svg>
