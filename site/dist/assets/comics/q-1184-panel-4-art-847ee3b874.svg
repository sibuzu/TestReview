<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>累計工人對車的作功</title><desc>水平分力不變，力—位移面積為392×10＝3920 J。等速運動的合力功為零，工人仍作正功。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">累計工人對車的作功</text><path d="M61 251 L283.0 251.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M286 251 L274.47 257.00 L274.47 245.00 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M61 251 L61.0 95.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M61 92 L67.00 103.53 L55.00 103.53 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="286" y="298" text-anchor="end" fill="#466176" font-size="18" font-weight="700">沿左的位移 (m)</text><text x="69" y="85" text-anchor="start" fill="#466176" font-size="18" font-weight="700">沿左的推力 (N)</text><rect x="62" y="116" width="174" height="135" rx="1" fill="#9ed8cd" stroke="#087f77" stroke-width="3" stroke-dasharray=""/><path d="M61 116 L237 116" fill="none" stroke="#087f77" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="53" y="121" text-anchor="end" fill="#193145" font-size="18" font-weight="700">392</text><text x="236" y="275" text-anchor="middle" fill="#193145" font-size="21" font-weight="700">10</text><text x="153" y="176" text-anchor="middle" fill="#193145" font-size="19" font-weight="700">水平分量的功</text><text x="153" y="211" text-anchor="middle" fill="#087f77" font-size="26" font-weight="700">3920 J</text></svg>
