<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><title>速度有正負，速率看大小</title><desc>取右為正，甲是＋v，乙是−v。兩者離零點的距離都等於 v。</desc><rect x="3" y="3" width="314" height="314" rx="22" fill="#f5fafb" stroke="#c7dce3" stroke-width="2" stroke-dasharray=""/><rect x="17" y="17" width="286" height="41" rx="11" fill="#e9f3f6" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="160" y="45" text-anchor="middle" fill="#193145" font-size="23" font-weight="700">速度有正負，速率看大小</text><path d="M32 161 L287.0 161.0" fill="none" stroke="#466176" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M290 161 L278.47 167.00 L278.47 155.00 Z" fill="#466176" stroke="#466176" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M160 149 L160 173" fill="none" stroke="#466176" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="72" cy="161" r="8" fill="#087f77" stroke="none" stroke-width="2"/><circle cx="248" cy="161" r="8" fill="#155ba5" stroke="none" stroke-width="2"/><text x="72" y="142" text-anchor="middle" fill="#087f77" font-size="22" font-weight="700">乙 −v</text><text x="248" y="142" text-anchor="middle" fill="#155ba5" font-size="22" font-weight="700">甲 ＋v</text><text x="160" y="196" text-anchor="middle" fill="#193145" font-size="20" font-weight="700">0</text><path d="M72 207 V219 H159 V207 M161 207 V219 H248 V207" fill="none" stroke="#193145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="116" y="250" text-anchor="middle" fill="#087f77" font-size="21" font-weight="700">速率 v</text><text x="204" y="250" text-anchor="middle" fill="#155ba5" font-size="21" font-weight="700">速率 v</text></svg>
