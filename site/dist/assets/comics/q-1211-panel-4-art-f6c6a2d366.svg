<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img">
  <title>在拱門內放回實際尺寸的直角三角形，兩股 91 和 60，斜邊為半徑 109。</title>
  <rect width="300" height="260" rx="17" fill="#f7fafc"/>
  <g stroke-linecap="round" stroke-linejoin="round" font-family="DejaVu Sans, Arial, sans-serif" font-weight="650">
  <path d="M 106.5138 188.9541 A 79 79 0 1 1 193.4862 188.9541 Z" stroke="#155eb4" stroke-width="2.7" fill="#dcecff"/>
  <path d="M 150.0000 123.0000 L 150.0000 188.9541 L 193.4862 188.9541 Z" stroke="#087971" stroke-width="2.8" fill="#d6f3ed"/>
  <path d="M 150.0000 180.9541 L 158.0000 180.9541 L 158.0000 188.9541" stroke="#647990" stroke-width="1.9" fill="none"/>
  <path d="M 150.0000 123.0000 L 150.0000 44.0000" stroke="#155eb4" stroke-width="3" fill="none" stroke-dasharray="5 4"/>
  <text x="134.0000" y="160.9771" font-size="20" text-anchor="middle" fill="#087971">91</text>
  <text x="193.7431" y="146.9771" font-size="20" text-anchor="middle" fill="#087971">109</text>
  <text x="176.7431" y="211.9541" font-size="20" text-anchor="middle" fill="#155eb4">60</text>
  <text x="150.0000" y="240.0000" font-size="20" text-anchor="middle" fill="#213248">91² + 60² = 109²</text>
  </g>
</svg>
