<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 180" role="img" aria-labelledby="t"><title id="t">按比例定位1300至1600的年代軸，標示1517宗教改革與較早的文藝復興。</title><rect x="0.5" y="0.5" width="223" height="179" rx="13" fill="#f4f8f6" stroke="#cedfd8"/><g font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="112" y="29" font-size="13" font-weight="600" fill="#183249" text-anchor="middle">歷史事件的先後</text><rect x="29" y="64" width="170" height="16" rx="4" fill="#d0eddf" stroke="#147569"/><text x="104" y="56" font-size="11" font-weight="600" fill="#147569" text-anchor="middle">文藝復興：14–16世紀</text><line x1="29" y1="109" x2="206" y2="109" stroke="#536d7b" stroke-width="2.4" stroke-linecap="round"/><path d="M206 109l-7.0 -3.9l-0.0 7.7Z" fill="#536d7b" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><line x1="29" y1="104" x2="29" y2="114" stroke="#536d7b" stroke-width="1" stroke-linecap="round"/><text x="29" y="128" font-size="9" font-weight="600" fill="#536d7b" text-anchor="middle">1300</text><line x1="86" y1="104" x2="86" y2="114" stroke="#536d7b" stroke-width="1" stroke-linecap="round"/><text x="86" y="128" font-size="9" font-weight="600" fill="#536d7b" text-anchor="middle">1400</text><line x1="142" y1="104" x2="142" y2="114" stroke="#536d7b" stroke-width="1" stroke-linecap="round"/><text x="142" y="128" font-size="9" font-weight="600" fill="#536d7b" text-anchor="middle">1500</text><line x1="199" y1="104" x2="199" y2="114" stroke="#536d7b" stroke-width="1" stroke-linecap="round"/><text x="199" y="128" font-size="9" font-weight="600" fill="#536d7b" text-anchor="middle">1600</text><line x1="152" y1="84" x2="152" y2="112" stroke="#a95225" stroke-width="1.8" stroke-linecap="round"/><circle cx="152" cy="109" r="4" fill="#a95225" stroke="white" stroke-width="1"/><text x="152" y="147" font-size="10" font-weight="600" fill="#a95225" text-anchor="middle">1517年宗教改革</text></g></svg>
