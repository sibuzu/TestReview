<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 180" role="img" aria-labelledby="t"><title id="t">用三條有刻度但不提供里程的長度條排出相對順序，環球線最長。</title><rect x="0.5" y="0.5" width="223" height="179" rx="13" fill="#f4f8f6" stroke="#cedfd8"/><g font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="112" y="25" font-size="13" font-weight="600" fill="#183249" text-anchor="middle">航程相對順序</text><line x1="48" y1="48" x2="48" y2="142" stroke="#536d7b" stroke-width="1" stroke-linecap="round"/><rect x="48" y="49" width="140" height="17" rx="4" fill="#147569" stroke="none"/><rect x="48" y="83" width="98" height="17" rx="4" fill="#a95225" stroke="none"/><rect x="48" y="117" width="48" height="17" rx="4" fill="#22639c" stroke="none"/><text x="31" y="63" font-size="12" font-weight="600" fill="#147569" text-anchor="middle">丙</text><text x="31" y="98" font-size="12" font-weight="600" fill="#a95225" text-anchor="middle">乙</text><text x="31" y="132" font-size="12" font-weight="600" fill="#22639c" text-anchor="middle">甲</text><text x="170" y="79" font-size="9" font-weight="600" fill="#147569" text-anchor="middle">環球</text><text x="159" y="99" font-size="9" font-weight="600" fill="#a95225" text-anchor="middle">繞非洲</text><text x="124" y="132" font-size="9" font-weight="600" fill="#22639c" text-anchor="middle">跨大西洋</text><text x="113" y="163" font-size="10" font-weight="600" fill="#536d7b" text-anchor="middle">只比較長短，不是實測距離</text></g></svg>
