<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">原題：一個字的位置</text><rect x="14" y="48" width="63" height="43" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="45" y="75" font-size="17" font-weight="bold">Each</text><text x="120" y="75" font-size="17">of you</text><path d="M18 102H162" stroke="#718c7e" stroke-width="2"/><text x="90" y="126" font-size="13">你們每一個人</text><text x="90" y="155" font-size="11">Each 能直接接 of</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">Every 需要加上 one</text><rect x="9" y="43" width="162" height="40" rx="7" fill="#f6e3d9" stroke="#b67558"/><text x="90" y="69" font-size="16">Every of you</text><path d="M16 77L161 48" stroke="#ad5544" stroke-width="2"/><rect x="9" y="106" width="162" height="40" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="132" font-size="16">Every one of you</text><text x="90" y="168" font-size="11">這是改寫，不是原空格答案</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">主詞以每一個人為單位</text><rect x="14" y="43" width="152" height="38" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="68" font-size="16">Each of you</text><path d="M90 84V105" stroke="#b47a39" stroke-width="2"/><rect x="42" y="108" width="96" height="36" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="90" y="132" font-size="19" font-weight="bold">needs</text><text x="90" y="167" font-size="11">you 不使主詞變成複數</text></g></svg>