<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">both＝兩個都</text><circle cx="60" cy="55" r="14" fill="#d8e5cb" stroke="#718c7e"/><circle cx="120" cy="55" r="14" fill="#d8e5cb" stroke="#718c7e"/><text x="90" y="91" font-size="13">Both of my daughters</text><path d="M25 103H155" stroke="#718c7e" stroke-width="2"/><rect x="45" y="118" width="90" height="36" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="141" font-size="19" font-weight="bold">sing</text><text x="90" y="174" font-size="10">複數主詞：現在式不加 s</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">本句用一般動詞</text><rect x="18" y="40" width="144" height="39" rx="7" fill="#f6e3d9" stroke="#b67558"/><text x="90" y="66" font-size="20">are sing</text><path d="M36 72L80 44" stroke="#ad5544" stroke-width="3"/><rect x="18" y="111" width="144" height="39" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="137" font-size="20" font-weight="bold">sing well</text><text x="90" y="173" font-size="11">are 不加入這個句型</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">另看不同的時態結構</text><rect x="13" y="45" width="154" height="43" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="73" font-size="19" font-weight="bold">are singing</text><text x="90" y="118" font-size="13">be ＋ V-ing</text><text x="90" y="145" font-size="12">正在唱歌</text><text x="90" y="172" font-size="10">這是延伸比較，非原題答案</text></g></svg>