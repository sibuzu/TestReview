<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70897a"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eff3e8"/><path d="M180 0h180v180H180Z" fill="#edf1f7"/><path d="M360 0h180v180H360Z" fill="#f8f0e2"/>
<text x="90" y="22" font-size="15">Although：雖然</text><rect x="20" y="44" width="140" height="34" rx="5" fill="#d8e3ce"/><text x="90" y="67" font-size="17">去逛街</text><path d="M90 85V107" stroke="#70897a" marker-end="url(#a)"/><rect x="20" y="115" width="140" height="34" rx="5" fill="#c1d7af"/><text x="90" y="138" font-size="17">卻沒買任何東西</text><text x="90" y="176" font-size="12">連接與預期不同的結果</text>
<text x="270" y="22" font-size="15">若說一次過去的事</text><rect x="195" y="46" width="150" height="36" rx="5" fill="#c9dab9"/><text x="270" y="71" font-size="19">went shopping</text><text x="270" y="107" font-size="15">搭配</text><rect x="195" y="122" width="150" height="36" rx="5" fill="#c9dab9"/><text x="270" y="147" font-size="20">didn't buy</text><text x="270" y="178" font-size="11">didn't後的buy用原形</text>
<text x="450" y="22" font-size="15">若說現在的習慣</text><rect x="375" y="46" width="150" height="36" rx="5" fill="#d5e0ed"/><text x="450" y="71" font-size="19">goes shopping</text><text x="450" y="107" font-size="15">搭配</text><rect x="375" y="122" width="150" height="36" rx="5" fill="#d5e0ed"/><text x="450" y="147" font-size="20">doesn't buy</text><text x="450" y="178" font-size="11">題目未限定時間，兩者皆可</text></g></svg>