<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">先看動詞已經寫什麼</text><rect x="15" y="47" width="150" height="39" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="90" y="72" font-size="19">taste<tspan fill="#ad5544" font-weight="bold">s</tspan> sweet</text><path d="M24 99H156" stroke="#718c7e" stroke-width="2"/><text x="90" y="127" font-size="13">單數／不可數</text><text x="90" y="157" font-size="11">some 本身不決定單複數</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">再檢查 some of 的接法</text><rect x="12" y="41" width="156" height="32" rx="7" fill="#f6e3d9" stroke="#b67558"/><text x="90" y="63" font-size="15">some of food</text><path d="M20 68L160 45" stroke="#ad5544" stroke-width="2"/><rect x="12" y="86" width="156" height="32" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="108" font-size="15">some food</text><rect x="12" y="131" width="156" height="32" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="153" font-size="15">some of the food</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">配合原句 tastes</text><rect x="12" y="42" width="156" height="40" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="68" font-size="16">some of it → tastes</text><rect x="12" y="106" width="156" height="40" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="131" font-size="15">some of them → taste</text><text x="90" y="172" font-size="10">noodles 在此也是複數</text></g></svg>