<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a198" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">比 Clark 更早開始</text><rect x="10" y="44" width="85" height="67" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="52" y="69" font-size="15">Losi</text><text x="52" y="94" font-size="15">Lana</text><rect x="112" y="72" width="59" height="39" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="141" y="97" font-size="14">Clark</text><path d="M14 131H166" stroke="#718c7e" stroke-width="2" marker-end="url(#a198)"/><text x="49" y="154" font-size="11">更早</text><text x="137" y="154" font-size="11">較晚</text><text x="90" y="175" font-size="9">兩人彼此先後未交代</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">only 強調只有這兩人</text><circle cx="57" cy="64" r="17" fill="#e8eedf" stroke="#718c7e"/><circle cx="123" cy="64" r="17" fill="#e8eedf" stroke="#718c7e"/><text x="57" y="69" font-size="15">1</text><text x="123" y="69" font-size="15">2</text><text x="90" y="106" font-size="14" font-weight="bold">only Losi and Lana</text><rect x="23" y="128" width="134" height="34" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="90" y="151" font-size="15">少數 → Few</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">比較選項的語氣</text><text x="52" y="56" font-size="15">All</text><text x="126" y="56" font-size="12">全部</text><text x="52" y="86" font-size="15">Most</text><text x="126" y="86" font-size="12">大多數</text><text x="52" y="116" font-size="15">Some</text><text x="126" y="116" font-size="12">一些</text><rect x="13" y="133" width="154" height="34" rx="7" fill="#e8eedf" stroke