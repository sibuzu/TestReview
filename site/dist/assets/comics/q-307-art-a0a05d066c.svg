<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#eaf3f4"/><text x="90" y="25" font-size="14">石花菜是紅藻</text><g transform="translate(90 130) scale(1)" stroke="#ad6269" stroke-width="3" fill="none" stroke-linecap="round"><path d="M0 0V-72M0-15L-21-38M0-24L24-48M0-43L-18-61M0-52L18-73M-12-28L-29-27M-17-34L-20-50M13-36L29-35M18-41L21-57M-10-53L-26-55M10-63L28-66"/></g><path d="M60 137Q91 126 120 137" stroke="#aeb7a0" fill="none" stroke-width="4"/><text x="90" y="167" font-size="12">名稱有菜，不等於植物界</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#edf1e7"/><rect x="9" y="34" width="162" height="128" rx="10" fill="#dce9d4" stroke="#839b76" stroke-width="1.6"/><text x="90" y="23" font-size="13">本題：國中五界分類</text><text x="90" y="58" font-size="16">原生生物界</text><g transform="translate(47 120) scale(0.6)" stroke="#ad6269" stroke-width="3" fill="none" stroke-linecap="round"><path d="M0 0V-72M0-15L-21-38M0-24L24-48M0-43L-18-61M0-52L18-73M-12-28L-29-27M-17-34L-20-50M13-36L29-35M18-41L21-57M-10-53L-26-55M10-63L28-66"/></g><path d="M117 91Q110 84 118 79Q126 76 128 87Q133 91 138 84Q150 78 151 88Q146 96 152 101Q160 102 157 110Q155 116 145 113Q138 116 139 124Q133 132 127 125Q128 117 120 115Q108 117 108 108Q112 102 117 101Z" fill="#b9d5dc" stroke="#6c9ba8" stroke-width="1.5"/><circle cx="134" cy="105" r="5" fill="#7c92b2"/><text x="47" y="143" font-size="12">石花菜</text><text x="134" y="143" font-size="12">C變形蟲</text><text x="90" y="176" font-size="10">圖示非大小比例或演化樹</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#f7efdf"/><text x="90" y="26" font-size="14">其餘選項不同界</text><g fill="#e4dfd1"><rect x="12" y="43" width="156" height="34" rx="5"/><rect x="12" y="88" width="156" height="34" rx="5"/><rect x="12" y="133" width="156" height="34" rx="5"/></g><g font-size="12"><text x="90" y="65">A藍菌 → 原核生物界</text><text x="90" y="110">B高麗菜 → 植物界</text><text x="90" y="155">D香菇 → 真菌界</text></g></g></svg>