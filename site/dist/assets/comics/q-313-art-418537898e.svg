<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="m" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#748775"/></marker></defs><g font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#eff3e8"/><text x="90" y="24" font-size="13">甲蝌蚪：提供體細胞核</text><ellipse cx="58" cy="91" rx="37" ry="28" fill="#d8e6ef" stroke="#7d9caa" stroke-width="1.7"/><circle cx="58" cy="91" r="11" fill="#d6ab50" stroke="#a17e39" stroke-width="1.4"/><path d="M98 91H128" stroke="#748775" stroke-width="2" marker-end="url(#m)"/><circle cx="147" cy="91" r="11" fill="#d6ab50" stroke="#a17e39" stroke-width="1.4"/><text x="58" y="137" font-size="12">體細胞</text><text x="146" y="137" font-size="12">甲核</text><text x="90" y="169" font-size="11">金色只標核的來源，不是體色</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#edf1f7"/><text x="90" y="24" font-size="13">乙卵去核，放入甲核</text><circle cx="80" cy="96" r="40" fill="#d8e6ef" stroke="#7d9caa" stroke-width="1.7"/><circle cx="80" cy="96" r="11" fill="#d6ab50" stroke="#a17e39" stroke-width="1.4"/><path d="M89 91L132 73" stroke="#a17e39" stroke-width="1.4"/><text x="149" y="69" font-size="12">甲核</text><circle cx="144" cy="106" r="9" fill="#b7bdc4"/><path d="M131 93L157 119M157 93L131 119" stroke="#b57564" stroke-width="2"/><text x="145" y="138" font-size="10">原核已移除</text><text x="80" y="151" font-size="12">乙提供去核卵</text><text x="90" y="176" font-size="11">沒有精卵結合</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#f6efdf"/><text x="90" y="24" font-size="14">丙蛙為白色</text><g fill="#fffefa" stroke="#7b9185" stroke-width="1.7"><path d="M65 109Q44 113 43 136L70 140L75 126M115 109Q136 113 137 136L110 140L105 126"/><ellipse cx="90" cy="111" rx="30" ry="20"/><ellipse cx="90" cy="91" rx="25" ry="19"/><circle cx="76" cy="76" r="7"/><circle cx="104" cy="76" r="7"/><path d="M75 110L65 126H79M105 110L115 126H101" fill="none"/></g><circle cx="76" cy="76" r="2.5" fill="#344b40"/><circle cx="104" cy="76" r="2.5" fill="#344b40"/><path d="M82 98Q90 103 98 98" fill="none" stroke="#7b9185" stroke-width="1.3"/><text x="90" y="164" font-size="13">核來自甲 → 推甲為白色</text><text x="90" y="175" font-size="9">依本題核內遺傳控制體色模型</text></g></svg>