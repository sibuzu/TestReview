<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="從金門圖上經緯度讀出往西往南，合成西南方向"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#4189a7"/></marker><marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6a8d4e"/></marker><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#264d43;font-size:12px;font-weight:600}.small{font-size:10px;fill:#5c7566}.b{font-size:14px;fill:#256a91}.line{fill:none;stroke:#4189a7;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="540" height="180" fill="#f7faf4"/>
<!-- 1: coordinate readings from original map, no invented outline or exact village point -->
<text x="90" y="19" text-anchor="middle">先讀目的地的經緯度</text><rect x="12" y="34" width="156" height="120" rx="12" fill="#e3f0f7" stroke="#8eafbc"/><path d="M31 135H151M31 135V51" fill="none" stroke="#a9c5ce" stroke-width="1.2"/><path d="M31 85H151M71 135V51M111 135V51" fill="none" stroke="#c1d8dc"/><path d="M90 68C69 68 64 94 90 119C116 94 111 68 90 68Z" fill="#e3b85d" stroke="#a88636" stroke-width="1.5"/><circle cx="90" cy="85" r="6" fill="#fff"/><text x="90" y="61" text-anchor="middle" class="b">金門聚落</text><text x="90" y="137" text-anchor="middle">約118°多E、24°多N</text><text x="90" y="174" text-anchor="middle" class="small">依原圖讀範圍，非精確單點</text>
<!-- 2: purely longitude comparison, not a geographic map -->
<text x="270" y="19" text-anchor="middle">東經較小，在西側</text><text x="201" y="63" class="small">西</text><text x="337" y="63" class="small">東</text><path d="M202 89H339" fill="none" stroke="#b6c7be" stroke-width="1.5"/><circle cx="217" cy="89" r="6" fill="#a88636"/><circle cx="326" cy="89" r="6" fill="#4189a7"/><text x="217" y="116" text-anchor="middle">金門</text><text x="326" y="116" text-anchor="middle">松山</text><text x="217" y="135" text-anchor="middle" class="small">118°多E</text><text x="326" y="135" text-anchor="middle" class="small">121°多E</text><path d="M319 75H226" class="line" marker-end="url(#a)"/><text x="270" y="54" text-anchor="middle" class="b">往西</text><text x="270" y="174" text-anchor="middle" class="small">比較東經數字，不靠紙上左右猜</text>
<!-- 3: orthogonal components and SW result; explicitly not a flight path -->
<text x="450" y="19" text-anchor="middle">西＋南＝西南</text><text x="450" y="42" text-anchor="middle" class="small">北</text><path d="M450 48V145M397 96H507" fill="none" stroke="#c4d3c8" stroke-width="1.2"/><text x="390" y="100" class="small">西</text><text x="513" y="100" class="small">東</text><text x="450" y="159" text-anchor="middle" class="small">南</text><circle cx="491" cy="62" r="5" fill="#4189a7"/><circle cx="412" cy="133" r="5" fill="#a88636"/><path d="M486 62H413V126" fill="none" stroke="#739357" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#g)"/><path d="M487 67L418 127" class="line" marker-end="url(#a)"/><text x="500" y="54" text-anchor="middle">松山</text><text x="392" y="146" text-anchor="middle">金門</text><text x="463" y="121" class="b">↙ D</text><text x="450" y="174" text-anchor="middle" class="small">方向示意，並非實際飛行航路</text></svg>