<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="伍舉諷諫與茅焦直諫兩例對照，結論須看運用方法"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#63816e"/></marker><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:12px;fill:#294c40;font-weight:600}.title{font-size:14px}.small{font-size:10px;fill:#647b6d}.red{fill:#a25639}.blue{fill:#2b6a91}.green{fill:#527b42}.line{fill:none;stroke:#63816e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="540" height="180" fill="#f9faf4"/>
<!-- 1: exact source example and its adverse result, not a historical reenactment -->
<text x="90" y="20" text-anchor="middle" class="title">伍舉的例子</text><rect x="24" y="34" width="132" height="45" rx="9" fill="#e0edf5" stroke="#6d9ab6" stroke-width="1.5"/><text x="90" y="53" text-anchor="middle" class="blue">伍舉</text><text x="90" y="70" text-anchor="middle">諷諫・隱語</text><path d="M90 83V103" class="line" marker-end="url(#a)"/><rect x="24" y="111" width="132" height="44" rx="9" fill="#f6e7d9" stroke="#bc8b6c" stroke-width="1.5"/><text x="90" y="130" text-anchor="middle">楚王</text><text x="90" y="147" text-anchor="middle" class="red">淫益甚</text><text x="90" y="175" text-anchor="middle" class="small">不是成功勸改的例子</text>
<!-- 2: contrasting successful direct counsel; not universal claim -->
<text x="270" y="20" text-anchor="middle" class="title">茅焦的例子</text><rect x="204" y="34" width="132" height="45" rx="9" fill="#eee7f2" stroke="#a18bac" stroke-width="1.5"/><text x="270" y="53" text-anchor="middle">茅焦</text><text x="270" y="70" text-anchor="middle">直諫・危論</text><path d="M270 83V103" class="line" marker-end="url(#a)"/><rect x="204" y="111" width="132" height="44" rx="9" fill="#e4efdb" stroke="#8fa477" stroke-width="1.5"/><text x="270" y="130" text-anchor="middle">秦帝</text><text x="270" y="147" text-anchor="middle" class="green">立悟</text><text x="270" y="175" text-anchor="middle" class="small">此例直諫也能奏效</text>
<!-- 3: author evaluates method/context rather than fixed virtue of form -->
<text x="450" y="20" text-anchor="middle" class="title">對照後的結論</text><rect x="373" y="35" width="68" height="33" rx="8" fill="#e0edf5" stroke="#6d9ab6"/><text x="407" y="56" text-anchor="middle" class="blue">諷</text><rect x="459" y="35" width="68" height="33" rx="8" fill="#eee7f2" stroke="#a18bac"/><text x="493" y="56" text-anchor="middle">直</text><path d="M407 73V85H450M493 73V85H450V100" class="line" marker-end="url(#a)"/><rect x="386" y="107" width="128" height="45" rx="10" fill="#fff4d9" stroke="#b8a36d" stroke-width="1.5"/><text x="450" y="125" text-anchor="middle">用之之術</text><text x="450" y="142" text-anchor="middle" class="small">方法・策略</text><text x="450" y="175" text-anchor="middle" class="small">不以委婉或直接預定優劣</text></svg>