<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" fill="#344f47" text-anchor="middle"><text x="90" y="24" font-size="12">題文列出的名稱</text><rect x="25" y="36" width="130" height="30" rx="7" fill="#f1eee3" stroke="#b6bba9"/><text x="90" y="57" font-size="15">大冤</text><rect x="25" y="77" width="130" height="30" rx="7" fill="#f1eee3" stroke="#b6bba9"/><text x="90" y="98" font-size="15">臺灣</text><rect x="25" y="118" width="130" height="40" rx="9" fill="#e8eedf" stroke="#4b8790" stroke-width="2"/><text x="90" y="145" font-size="20" font-weight="bold" fill="#4b8790">東寧</text><text x="90" y="174" font-size="9">名稱摘錄，非重繪原地圖</text></g>
<g transform="translate(180)" font-family="sans-serif" fill="#344f47" text-anchor="middle"><text x="90" y="22" font-size="12">區分統治者與用名</text><rect x="15" y="35" width="150" height="46" rx="9" fill="#f0e4ce" stroke="#b39863"/><text x="61" y="64" font-size="15" font-weight="bold">鄭成功</text><text x="128" y="64" font-size="15">東都</text><path d="M90 87V105" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><rect x="15" y="112" width="150" height="47" rx="9" fill="#e8eedf" stroke="#4b8790"/><text x="61" y="142" font-size="15" font-weight="bold">鄭經</text><text x="128" y="142" font-size="17" fill="#4b8790" font-weight="bold">東寧</text><text x="90" y="175" font-size="10">鄭經改東都為東寧</text></g>
<g transform="translate(360)" font-family="sans-serif" fill="#344f47"><text x="90" y="23" font-size="12" text-anchor="middle">用名時間 ≠ 繪圖時間</text><path d="M27 50V133" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><circle cx="27" cy="52" r="4" fill="#4b8790"/><circle cx="27" cy="130" r="4" fill="#b39863"/><text x="41" y="54" font-size="17" font-weight="bold" fill="#4b8790">1664</text><text x="41" y="75" font-size="12">鄭經改稱東寧</text><text x="41" y="132" font-size="17" font-weight="bold" fill="#9b7a42">1710</text><text x="41" y="153" font-size="12">日本人繪此地圖</text><text x="90" y="174" font-size="9" text-anchor="middle">先後示意，間距非年數比例</text></g></svg>
