<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#244b50">先完整讀表（原題資料）</text><rect x="8" y="33" width="164" height="24" fill="#f7f9f3"/><text x="40" y="49" text-anchor="middle" font-size="9" fill="#244b50">成立</text><text x="119" y="49" text-anchor="middle" font-size="10" fill="#244b50">民國74年</text><rect x="8" y="58" width="164" height="24" fill="#f7f9f3"/><text x="40" y="74" text-anchor="middle" font-size="9" fill="#244b50">面積</text><text x="119" y="74" text-anchor="middle" font-size="10" fill="#244b50">11,338公頃</text><rect x="8" y="83" width="164" height="24" fill="#e1ecd9"/><text x="40" y="99" text-anchor="middle" font-size="9" fill="#244b50">最高點</text><text x="119" y="99" text-anchor="middle" font-size="10" fill="#244b50">1,120公尺</text><rect x="8" y="108" width="164" height="24" fill="#f7f9f3"/><text x="40" y="124" text-anchor="middle" font-size="9" fill="#244b50">年雨量</text><text x="119" y="124" text-anchor="middle" font-size="10" fill="#244b50">4,863.1mm</text><rect x="8" y="133" width="164" height="24" fill="#f7f9f3"/><text x="40" y="149" text-anchor="middle" font-size="9" fill="#244b50">特色</text><text x="119" y="149" text-anchor="middle" font-size="10" fill="#244b50">全年有雨</text><text x="90" y="176" text-anchor="middle" font-size="9" fill="#244b50">不替換成今天的統計</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="11" fill="#244b50">最高點是排除關鍵</text><rect x="190" y="32" width="160" height="30" rx="5" fill="#dce8d0"/><text x="270" y="52" text-anchor="middle" font-size="10" fill="#244b50">A 陽明山：1,120公尺</text><rect x="190" y="64" width="160" height="30" rx="5" fill="#f8f7ef"/><text x="270" y="84" text-anchor="middle" font-size="10" fill="#244b50">B 雪霸：最高點更高</text><rect x="190" y="96" width="160" height="30" rx="5" fill="#f8f7ef"/><text x="270" y="116" text-anchor="middle" font-size="10" fill="#244b50">C 太魯閣：也含高山</text><rect x="190" y="128" width="160" height="30" rx="5" fill="#f8f7ef"/><text x="270" y="148" text-anchor="middle" font-size="10" fill="#244b50">D 玉山：最高點更高</text><text x="270" y="178" text-anchor="middle" font-size="9" fill="#244b50">對照同一欄：園區最高點</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#244b50">不能只靠民國74年</text><rect x="370" y="34" width="160" height="30" rx="5" fill="#dce8d0"/><text x="450" y="54" text-anchor="middle" font-size="10" fill="#244b50">陽明山與玉山皆民國74年</text><path d="M450 67L450 86" fill="none" stroke="#849e8f" stroke-width="1.5"/><path d="M446 81L450 86" fill="none" stroke="#849e8f" stroke-width="1.5"/><path d="M454 81L450 86" fill="none" stroke="#849e8f" stroke-width="1.5"/><rect x="370" y="91" width="160" height="30" rx="5" fill="#dce7ef"/><text x="450" y="111" text-anchor="middle" font-size="10" fill="#244b50">再合看最高點與雨量</text><path d="M450 123L450 141" fill="none" stroke="#849e8f" stroke-width="1.5"/><path d="M446 136L450 141" fill="none" stroke="#849e8f" stroke-width="1.5"/><path d="M454 136L450 141" fill="none" stroke="#849e8f" stroke-width="1.5"/><text x="450" y="162" text-anchor="middle" font-size="13" fill="#244b50">A 陽明山最相符</text></g></svg>