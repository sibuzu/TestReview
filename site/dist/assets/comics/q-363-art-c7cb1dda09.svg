<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eef3e7"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="10" fill="#284d4d">西北沿海 → 東南山區</text><path d="M8 140H43L62 129H89L107 109L123 119L142 61L160 84L174 43V157H8Z" fill="#a4ba8d" stroke="#65866e" stroke-width="2"/><path d="M5 143H42V158H5Z" fill="#87c9db"/><text x="33" y="117" text-anchor="middle" font-size="10" fill="#284d4d">沿海</text><text x="79" y="112" text-anchor="middle" font-size="10" fill="#284d4d">台地</text><text x="144" y="34" text-anchor="middle" font-size="10" fill="#284d4d">山地</text><text x="90" y="176" text-anchor="middle" font-size="9" fill="#284d4d">概念剖面，非測線或比例圖</text></g><rect x="180" width="180" height="180" fill="#edf2f5"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#284d4d">丁：原圖東南端山區</text><rect x="188" y="36" width="164" height="30" rx="4" fill="#dce8cf"/><text x="270" y="56" text-anchor="middle" font-size="10" fill="#284d4d">地形陡峭</text><rect x="188" y="80" width="164" height="30" rx="4" fill="#dce8cf"/><text x="270" y="100" text-anchor="middle" font-size="10" fill="#284d4d">可居住與交通條件受限</text><rect x="188" y="124" width="164" height="30" rx="4" fill="#dce8cf"/><text x="270" y="144" text-anchor="middle" font-size="10" fill="#284d4d">較不利人口密集聚居</text><path d="M270 69v8m-3-3 3 3 3-3" fill="none" stroke="#8c9e92"/><path d="M270 113v8m-3-3 3 3 3-3" fill="none" stroke="#8c9e92"/><text x="270" y="176" text-anchor="middle" font-size="8" fill="#284d4d">依自然環境比較，不是查人數</text></g><rect x="360" width="180" height="180" fill="#faf1e6"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#284d4d">密度：人口 ÷ 面積</text><rect x="372" y="45" width="68" height="76" rx="4" fill="#e2ead8"/><circle cx="385" cy="61" r="4" fill="#627d62"/><circle cx="405" cy="61" r="4" fill="#627d62"/><circle cx="425" cy="61" r="4" fill="#627d62"/><circle cx="385" cy="77" r="4" fill="#627d62"/><circle cx="405" cy="77" r="4" fill="#627d62"/><circle cx="425" cy="77" r="4" fill="#627d62"/><circle cx="385" cy="93" r="4" fill="#627d62"/><circle cx="405" cy="93" r="4" fill="#627d62"/><circle cx="425" cy="93" r="4" fill="#627d62"/><circle cx="385" cy="109" r="4" fill="#627d62"/><circle cx="405" cy="109" r="4" fill="#627d62"/><circle cx="425" cy="109" r="4" fill="#627d62"/><text x="406" y="139" text-anchor="middle" font-size="11" fill="#284d4d">較密</text><rect x="460" y="45" width="68" height="76" rx="4" fill="#e2ead8"/><circle cx="473" cy="61" r="4" fill="#627d62"/><circle cx="493" cy="61" r="4" fill="#627d62"/><circle cx="513" cy="61" r="4" fill="#627d62"/><text x="494" y="139" text-anchor="middle" font-size="11" fill="#284d4d">較疏</text><text x="450" y="38" text-anchor="middle" font-size="9" fill="#284d4d">同樣面積的假設示意</text><text x="450" y="161" text-anchor="middle" font-size="11" fill="#284d4d">面積大 ≠ 密度高</text><text x="450" y="177" text-anchor="middle" font-size="8" fill="#284d4d">圓點不代表桃園實際人口</text></g></svg>