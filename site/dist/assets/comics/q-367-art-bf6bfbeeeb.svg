<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="flow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#438eaa"/></marker></defs><rect x="0" width="180" height="180" fill="#f5eee2"/><g font-family="sans-serif"><text x="90" y="19" text-anchor="middle" font-size="11" fill="#294f50">先讀題組，再看甲點</text><rect x="15" y="31" width="150" height="124" rx="5" fill="#fffdf5"/><text x="90" y="54" text-anchor="middle" font-size="11" fill="#294f50">題組：濁水溪水系</text><text x="90" y="86" text-anchor="middle" font-size="11" fill="#294f50">圖中：甲點水庫</text><text x="90" y="118" text-anchor="middle" font-size="11" fill="#294f50">任務：核對四個名稱</text><text x="90" y="173" text-anchor="middle" font-size="9" fill="#294f50">位置以原卷必要圖為準</text></g><rect x="180" width="180" height="180" fill="#eaf2f4"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#294f50">引水關係：非地理比例</text><rect x="188" y="35" width="72" height="25" rx="5" fill="#d2e7ef"/><text x="224" y="52" text-anchor="middle" font-size="11" fill="#294f50">濁水溪</text><rect x="188" y="82" width="72" height="26" rx="5" fill="#ded4bb"/><text x="224" y="100" text-anchor="middle" font-size="11" fill="#294f50">武界壩</text><rect x="188" y="138" width="72" height="26" rx="5" fill="#d2e7ef"/><text x="224" y="156" text-anchor="middle" font-size="10" fill="#294f50">主流續行</text><rect x="293" y="82" width="61" height="27" rx="5" fill="#c6e5ec"/><text x="323.5" y="100" text-anchor="middle" font-size="11" fill="#294f50">日月潭</text><path d="M224 60L224 80" stroke="#438eaa" stroke-width="2.5" marker-end="url(#flow)"/><path d="M224 108L224 136" stroke="#438eaa" stroke-width="2.5" marker-end="url(#flow)"/><path d="M260 95L291 95" stroke="#438eaa" stroke-width="2.5" marker-end="url(#flow)"/><text x="311" y="72" text-anchor="middle" font-size="9" fill="#294f50">引水道</text><text x="306" y="137" text-anchor="middle" font-size="10" fill="#294f50">離槽水庫</text><path d="M323 110V122" stroke="#7b9d9a"/><text x="270" y="178" text-anchor="middle" font-size="9" fill="#294f50">主流不直接流入日月潭</text></g><rect x="360" width="180" height="180" fill="#edf0e5"/><g font-family="sans-serif"><text x="450" y="19" text-anchor="middle" font-size="11" fill="#294f50">水庫與水系配對</text><rect x="366" y="31" width="168" height="29" rx="5" fill="#e3e6d8"/><text x="407" y="50" text-anchor="middle" font-size="10" fill="#294f50">A 翡翠</text><text x="489" y="50" text-anchor="middle" font-size="10" fill="#294f50">淡水河系</text><rect x="366" y="64" width="168" height="29" rx="5" fill="#e3e6d8"/><text x="407" y="83" text-anchor="middle" font-size="10" fill="#294f50">B 曾文</text><text x="489" y="83" text-anchor="middle" font-size="10" fill="#294f50">曾文溪</text><rect x="366" y="97" width="168" height="29" rx="5" fill="#e3e6d8"/><text x="407" y="116" text-anchor="middle" font-size="10" fill="#294f50">C 德基</text><text x="489" y="116" text-anchor="middle" font-size="10" fill="#294f50">大甲溪</text><rect x="366" y="130" width="168" height="29" rx="5" fill="#c1d7ad"/><text x="407" y="149" text-anchor="middle" font-size="10" fill="#294f50">D 日月潭</text><text x="489" y="149" text-anchor="middle" font-size="10" fill="#294f50">引濁水溪水</text><text x="450" y="178" text-anchor="middle" font-size="8" fill="#294f50">本題選 D，保留原卷圖的位置</text></g></svg>