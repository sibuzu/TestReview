<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#678377"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#edf2e7"/><path d="M180 0h180v180H180Z" fill="#edf0f6"/><path d="M360 0h180v180H360Z" fill="#f7f0df"/>
<text x="90" y="22" font-size="15">分類依據改變</text><rect x="19" y="38" width="142" height="45" rx="5" fill="#d8e1cc"/><text x="90" y="57" font-size="12">以原鄉祖籍分類</text><text x="90" y="76" font-size="15">泉州人、漳州人</text><path d="M90 87V106" stroke="#678377" fill="none" marker-end="url(#a)"/><rect x="19" y="111" width="142" height="57" rx="5" fill="#c7dab7"/><text x="90" y="130" font-size="12">以臺灣居住區域分類</text><text x="90" y="150" font-size="15">頂港人、下港人</text><text x="90" y="164" font-size="11">北部人　　南部人</text>
<text x="270" y="22" font-size="15">信仰跨越祖籍</text><g stroke="#839688" fill="none" stroke-width="2"><path d="M219 62L249 101"/><path d="M321 62L291 101"/></g><g font-size="12"><rect x="187" y="39" width="64" height="30" rx="5" fill="#d6dfeb"/><text x="219" y="59">不同祖籍</text><rect x="289" y="39" width="64" height="30" rx="5" fill="#d6dfeb"/><text x="321" y="59">不同祖籍</text></g><rect x="210" y="96" width="120" height="39" rx="6" fill="#cadbb9"/><text x="270" y="122" font-size="17">共同信仰</text><text x="270" y="155" font-size="12">鄉土神逐漸成為</text><text x="270" y="172" font-size="12">跨祖籍居民的守護神</text>
<text x="450" y="22" font-size="15">能推論的是趨勢</text><rect x="374" y="39" width="152" height="44" rx="5" fill="#cbdcb9"/><text x="450" y="58" font-size="13">祖籍界線逐漸淡化</text><text x="450" y="76" font-size="13">地方社會逐漸融合</text><rect x="374" y="100" width="152" height="63" rx="5" fill="#e8dec7"/><g font-size="12"><text x="450" y="120">材料沒有提供人口數據</text><text x="450" y="140">不能推出性別比例</text><text x="450" y="157">或原住民族人口增減</text></g></g></svg>