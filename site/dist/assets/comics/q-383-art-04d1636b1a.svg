<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/><g transform="translate(0)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">A：音對，義錯</text><text x="90" y="49" font-size="24" font-weight="bold">熱心參與</text><rect x="20" y="65" width="140" height="37" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="39" y="89" font-size="11">音</text><text x="96" y="92" font-size="25">ㄩˋ</text><rect x="20" y="114" width="140" height="37" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="39" y="138" font-size="11">義</text><text x="100" y="139" font-size="17">參加</text><text x="90" y="176" font-size="12">本詞不是推舉</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">C：音對，義錯</text><text x="90" y="49" font-size="24" font-weight="bold">與人為善</text><rect x="20" y="65" width="140" height="37" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="39" y="89" font-size="11">音</text><text x="96" y="92" font-size="25">ㄩˇ</text><rect x="20" y="114" width="140" height="37" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="39" y="138" font-size="11">義</text><text x="100" y="139" font-size="17">幫助、贊助</text><text x="90" y="176" font-size="12">本詞不是結交</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">D：句末語助詞</text><text x="90" y="49" font-size="24" font-weight="bold">與＝歟</text><rect x="20" y="65" width="140" height="37" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="39" y="89" font-size="11">音</text><text x="96" y="92" font-size="25">ㄩˊ</text><rect x="20" y="114" width="140" height="37" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="39" y="138" font-size="11">義</text><text x="100" y="139" font-size="17">感嘆語氣</text><text x="90" y="176" font-size="12">原項ㄩˇ聲調不合</text></g></svg>