<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="20" text-anchor="middle" font-size="9" fill="#244b50">原句的關鍵：始終不渝</text><rect x="18" y="44" width="38" height="34" rx="5" fill="#d4e4c4"/><text x="37" y="68" text-anchor="middle" font-size="22" fill="#244b50">始</text><rect x="124" y="44" width="38" height="34" rx="5" fill="#d4e4c4"/><text x="143" y="68" text-anchor="middle" font-size="22" fill="#244b50">終</text><path d="M57 62H123m-5-4 5 4-5 4" fill="none" stroke="#75989a" stroke-width="2"/><rect x="17" y="98" width="146" height="35" rx="5" fill="#e6dcbf"/><text x="90" y="121" text-anchor="middle" font-size="15" fill="#244b50">不渝＝不改變</text><text x="90" y="155" text-anchor="middle" font-size="11" fill="#244b50">從開始到最後</text><text x="90" y="175" text-anchor="middle" font-size="11" fill="#244b50">意志堅定，不改初衷</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="20" text-anchor="middle" font-size="9" fill="#244b50">C也強調真誠堅定的精神</text><rect x="194" y="40" width="152" height="36" rx="5" fill="#d6e5c7"/><text x="270" y="63" text-anchor="middle" font-size="12" fill="#244b50">始終不渝 → 堅定</text><rect x="194" y="92" width="152" height="36" rx="5" fill="#d3e0e9"/><text x="270" y="108" text-anchor="middle" font-size="10" fill="#244b50">精誠所至，金石為開</text><text x="270" y="122" text-anchor="middle" font-size="9" fill="#244b50">→ 真誠堅定，克服困難</text><text x="270" y="153" text-anchor="middle" font-size="11" fill="#244b50">相近的核心：堅定精神</text><text x="270" y="175" text-anchor="middle" font-size="10" fill="#244b50">比較意旨，不是字面重複</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="20" text-anchor="middle" font-size="9" fill="#244b50">比共同要旨，不比誰最有道理</text><rect x="376" y="38" width="148" height="23" rx="5" fill="#f8f8f0"/><text x="450" y="54" text-anchor="middle" font-size="11" fill="#244b50">A：助人成善</text><rect x="376" y="67" width="148" height="23" rx="5" fill="#f8f8f0"/><text x="450" y="83" text-anchor="middle" font-size="11" fill="#244b50">B：包容廣納</text><rect x="376" y="96" width="148" height="23" rx="5" fill="#d7e6c6"/><text x="450" y="112" text-anchor="middle" font-size="11" fill="#244b50">C：真誠堅定</text><rect x="376" y="125" width="148" height="23" rx="5" fill="#f8f8f0"/><text x="450" y="141" text-anchor="middle" font-size="11" fill="#244b50">D：謙抑不驕</text><text x="450" y="174" text-anchor="middle" font-size="11" fill="#244b50">C與原句的精神最相近</text></g></svg>