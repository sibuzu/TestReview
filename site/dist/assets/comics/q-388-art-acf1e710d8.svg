<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/><g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">造字概念示意</text><rect x="37" y="49" width="106" height="66" fill="none" stroke="#58776c" stroke-width="4"/><path d="M37 82H96" stroke="#b47a39" stroke-width="4" stroke-linecap="round"/><text x="90" y="140" font-size="13">口的形體＋指示符號</text><text x="90" y="173" font-size="17" font-weight="bold">表示發言</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">現代字形：曰不是日</text><rect x="17" y="36" width="62" height="63" rx="7" fill="#e8eedf" stroke="#718c7e"/><rect x="101" y="36" width="62" height="63" rx="7" fill="#f0e4ce" stroke="#b47a39"/><text x="48" y="84" font-size="45">曰</text><text x="132" y="84" font-size="45">日</text><text x="48" y="125" font-size="13">曰：說話</text><text x="132" y="125" font-size="13">日：太陽</text><text x="48" y="151" font-size="11">橫長豎短</text><text x="132" y="151" font-size="11">豎長橫短</text><text x="90" y="176" font-size="11">古文字仍看原卷附圖</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">依本題採用分類</text><rect x="16" y="34" width="148" height="35" rx="6" fill="#e8eedf"/><text x="40" y="61" font-size="27">古</text><text x="79" y="58" font-size="19">→</text><text x="128" y="58" font-size="17">會意</text><rect x="16" y="81" width="148" height="35" rx="6" fill="#e8eedf"/><text x="40" y="108" font-size="27">北</text><text x="79" y="105" font-size="19">→</text><text x="128" y="105" font-size="17">會意</text><rect x="16" y="128" width="148" height="35" rx="6" fill="#f0e4ce"/><text x="40" y="155" font-size="27">果</text><text x="79" y="152" font-size="19">→</text><text x="128" y="152" font-size="17">象形</text></g></svg>