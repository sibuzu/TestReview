<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="20" text-anchor="middle" font-size="9" fill="#244b50">從案例到作者的提醒</text><rect x="16" y="41" width="148" height="35" rx="5" fill="#f0e1c6"/><text x="90" y="57" text-anchor="middle" font-size="9" fill="#244b50">原文案例</text><text x="90" y="71" text-anchor="middle" font-size="9" fill="#244b50">不實指控 → 當事人受損</text><path d="M90 81v12m-4-4 4 4 4-4" fill="none" stroke="#79999c"/><rect x="16" y="102" width="148" height="42" rx="5" fill="#d6e6cb"/><text x="90" y="120" text-anchor="middle" font-size="9" fill="#244b50">作者提醒</text><text x="90" y="136" text-anchor="middle" font-size="10" fill="#244b50">言論自由也涉及相應責任</text><text x="90" y="174" text-anchor="middle" font-size="9" fill="#244b50">不能只抓案例，忘了結論</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="20" text-anchor="middle" font-size="9" fill="#244b50">標題須保留「雖然／但」</text><rect x="199" y="39" width="142" height="37" rx="5" fill="#d6e6cc"/><text x="270" y="54" text-anchor="middle" font-size="9" fill="#244b50">雖然</text><text x="270" y="70" text-anchor="middle" font-size="12" fill="#244b50">言論自由受保障</text><text x="270" y="94" text-anchor="middle" font-size="15" fill="#244b50">＋</text><rect x="199" y="107" width="142" height="37" rx="5" fill="#d1e0eb"/><text x="270" y="122" text-anchor="middle" font-size="9" fill="#244b50">但</text><text x="270" y="138" text-anchor="middle" font-size="11" fill="#244b50">仍須守法、承擔責任</text><text x="270" y="174" text-anchor="middle" font-size="11" fill="#244b50">B同時保留兩個重點</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="20" text-anchor="middle" font-size="9" fill="#244b50">逐項看：有無偏離主旨</text><rect x="370" y="38" width="160" height="23" rx="5" fill="#f8f8f0"/><text x="450" y="54" text-anchor="middle" font-size="10" fill="#244b50">A 已成災：擴大判斷</text><rect x="370" y="67" width="160" height="23" rx="5" fill="#d8e7c8"/><text x="450" y="83" text-anchor="middle" font-size="10" fill="#244b50">B 自由＋守法：完整</text><rect x="370" y="96" width="160" height="23" rx="5" fill="#f8f8f0"/><text x="450" y="112" text-anchor="middle" font-size="10" fill="#244b50">C 無保障：與文相反</text><rect x="370" y="125" width="160" height="23" rx="5" fill="#f8f8f0"/><text x="450" y="141" text-anchor="middle" font-size="10" fill="#244b50">D 亂象：沒有點明提醒</text><text x="450" y="174" text-anchor="middle" font-size="11" fill="#244b50">依本文選標題：B</text></g></svg>