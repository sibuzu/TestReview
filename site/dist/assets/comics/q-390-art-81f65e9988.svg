<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="20" text-anchor="middle" font-size="10" fill="#244b50">不約而同：前後有反差</text><rect x="20" y="43" width="140" height="35" rx="5" fill="#d7e6ca"/><text x="90" y="67" text-anchor="middle" font-size="14" fill="#244b50">沒事先約定</text><text x="90" y="101" text-anchor="middle" font-size="21" fill="#b4894c">卻</text><rect x="20" y="116" width="140" height="35" rx="5" fill="#d1e1e9"/><text x="90" y="140" text-anchor="middle" font-size="13" fill="#244b50">意見或行為相同</text><text x="90" y="175" text-anchor="middle" font-size="9" fill="#244b50">沒有先約好，結果卻一致</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="20" text-anchor="middle" font-size="10" fill="#244b50">陽奉陰違：表裡有反差</text><rect x="200" y="43" width="140" height="35" rx="5" fill="#d7e6ca"/><text x="270" y="67" text-anchor="middle" font-size="14" fill="#244b50">表面上服從</text><text x="270" y="101" text-anchor="middle" font-size="21" fill="#b4894c">卻</text><rect x="200" y="116" width="140" height="35" rx="5" fill="#d1e1e9"/><text x="270" y="140" text-anchor="middle" font-size="13" fill="#244b50">暗地裡違背</text><text x="270" y="175" text-anchor="middle" font-size="9" fill="#244b50">不是接著做，而是反向轉折</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="20" text-anchor="middle" font-size="10" fill="#244b50">其餘三項的關係不同</text><rect x="371" y="38" width="158" height="35" rx="5" fill="#f8f8f1"/><text x="450" y="52" text-anchor="middle" font-size="11" fill="#244b50">B 得寸進尺</text><text x="450" y="67" text-anchor="middle" font-size="9" fill="#244b50">得了還要更多：遞進</text><rect x="371" y="80" width="158" height="35" rx="5" fill="#f8f8f1"/><text x="450" y="94" text-anchor="middle" font-size="11" fill="#244b50">C 有求必應</text><text x="450" y="109" text-anchor="middle" font-size="9" fill="#244b50">有請求就回應：條件</text><rect x="371" y="122" width="158" height="35" rx="5" fill="#f8f8f1"/><text x="450" y="136" text-anchor="middle" font-size="11" fill="#244b50">D 曉風殘月</text><text x="450" y="151" text-anchor="middle" font-size="9" fill="#244b50">晨風＋殘月：並列</text><text x="450" y="175" text-anchor="middle" font-size="10" fill="#244b50">要比較兩部分如何連接</text></g></svg>