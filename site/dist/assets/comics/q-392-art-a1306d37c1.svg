<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="20" text-anchor="middle" font-size="9" fill="#244b50">先分情況，不能混在一起</text><rect x="12" y="39" width="156" height="34" rx="5" fill="#f9faf6"/><text x="90" y="53" text-anchor="middle" font-size="10" fill="#244b50">私宰自己牲畜</text><text x="90" y="67" text-anchor="middle" font-size="8" fill="#244b50">依馬牛／駝騾驢分別規定</text><rect x="12" y="82" width="156" height="34" rx="5" fill="#f9faf6"/><text x="90" y="96" text-anchor="middle" font-size="10" fill="#244b50">病死後不申官就剝皮</text><text x="90" y="110" text-anchor="middle" font-size="8" fill="#244b50">文中仍有處罰</text><rect x="12" y="125" width="156" height="34" rx="5" fill="#f9faf6"/><text x="90" y="139" text-anchor="middle" font-size="10" fill="#244b50">故殺他人牲畜</text><text x="90" y="153" text-anchor="middle" font-size="8" fill="#244b50">另依種類規定處罰</text><text x="90" y="176" text-anchor="middle" font-size="10" fill="#244b50">誤殺者不坐：不論罪</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="20" text-anchor="middle" font-size="9" fill="#244b50">原文誤殺，與B的假裝有別</text><rect x="194" y="35" width="152" height="27" rx="5" fill="#d8e6cb"/><text x="270" y="53" text-anchor="middle" font-size="13" fill="#244b50">不坐＝不論罪</text><rect x="192" y="77" width="156" height="23" rx="5" fill="#d2e1e9"/><text x="270" y="93" text-anchor="middle" font-size="10" fill="#244b50">謊稱誤殺</text><path d="M270 101v6m-3-3 3 3 3-3" fill="none" stroke="#809da0"/><rect x="192" y="110" width="156" height="23" rx="5" fill="#d2e1e9"/><text x="270" y="126" text-anchor="middle" font-size="10" fill="#244b50">成功騙過官府，認定誤殺</text><path d="M270 134v6m-3-3 3 3 3-3" fill="none" stroke="#809da0"/><rect x="192" y="143" width="156" height="23" rx="5" fill="#d2e1e9"/><text x="270" y="159" text-anchor="middle" font-size="10" fill="#244b50">才可能免罪</text><text x="270" y="177" text-anchor="middle" font-size="9" fill="#244b50">不是只要假裝就保證免罪</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="20" text-anchor="middle" font-size="9" fill="#244b50">核對原文，不補寫處罰或程序</text><rect x="372" y="39" width="156" height="35" rx="5" fill="#f9faf6"/><text x="450" y="53" text-anchor="middle" font-size="10" fill="#244b50">A 申請程序</text><text x="450" y="68" text-anchor="middle" font-size="9" fill="#244b50">節錄沒有明寫這項資訊</text><rect x="372" y="82" width="156" height="35" rx="5" fill="#f9faf6"/><text x="450" y="96" text-anchor="middle" font-size="10" fill="#244b50">C 病死即剝皮</text><text x="450" y="111" text-anchor="middle" font-size="9" fill="#244b50">漏掉申官條件</text><rect x="372" y="125" width="156" height="35" rx="5" fill="#f9faf6"/><text x="450" y="139" text-anchor="middle" font-size="10" fill="#244b50">D 駱駝會流放</text><text x="450" y="154" text-anchor="middle" font-size="9" fill="#244b50">原文是杖一百</text><text x="450" y="177" text-anchor="middle" font-size="10" fill="#244b50">依題文選B，補足其條件</text></g></svg>