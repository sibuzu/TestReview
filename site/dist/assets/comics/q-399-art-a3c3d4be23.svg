<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f3f7ed"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#2a4b40"><text x="90" y="19" font-size="13" font-weight="bold">先用兩個縣市定位</text><rect x="11" y="40" width="72" height="40" rx="7" fill="#e0e9d4" stroke="#91a789"/><rect x="97" y="40" width="72" height="40" rx="7" fill="#e0e9d4" stroke="#91a789"/><text x="47" y="65" font-size="16" font-weight="bold">屏東</text><text x="133" y="65" font-size="16" font-weight="bold">臺東</text><path d="M47 82V99H133V82M90 99V114" fill="none" stroke="#7c9773" stroke-width="2"/><rect x="18" y="122" width="144" height="38" rx="7" fill="#f1dfc5" stroke="#91a789"/><text x="90" y="146" font-size="12" font-weight="bold">臺灣東南部交界</text><text x="270" y="19" font-size="12" font-weight="bold">中央山脈東南段臨海</text><rect x="315" y="124" width="42" height="40" fill="#b8dce6"/><path d="M183 154L208 65L234 118L248 99L275 134L313 154Z" fill="#93ad82" stroke="#69845c" stroke-width="2"/><path d="M274 143Q292 149 314 153" stroke="#b77849" stroke-width="4" fill="none"/><text x="225" y="48" font-size="12" font-weight="bold">中央山脈</text><text x="328" y="112" font-size="10" font-weight="normal">太平洋</text><text x="279" y="157" font-size="10" font-weight="normal">古道</text><text x="270" y="178" font-size="9" font-weight="normal">山海關係示意・非比例剖面</text><text x="450" y="19" font-size="12" font-weight="bold">別被「海岸」字樣誤導</text><rect x="369" y="35" width="163" height="47" rx="7" fill="#fff" stroke="#91a789"/><text x="450" y="54" font-size="12" font-weight="bold">海岸山脈：專有地名</text><text x="450" y="73" font-size="11" font-weight="normal">主要在花東縱谷東側</text><rect x="369" y="104" width="163" height="48" rx="7" fill="#dce9d3" stroke="#91a789"/><text x="450" y="124" font-size="12" font-weight="normal">不是所有靠海的山</text><text x="450" y="144" font-size="12" font-weight="bold">都叫「海岸山脈」</text><text x="450" y="174" font-size="11" font-weight="normal">本題依位置選中央山脈</text></g></svg>