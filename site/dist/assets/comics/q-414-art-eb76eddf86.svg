<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="sans-serif"><text x="90" y="19" text-anchor="middle" font-size="9" fill="#244b50">本題圖示：兩項都叫礦產品</text><circle cx="90" cy="79" r="45" fill="none" stroke="#91ae70" stroke-width="18"/><circle cx="90" cy="79" r="45" fill="none" stroke="#6798ac" stroke-width="18" stroke-dasharray="51.17654432697773 231.56679449610365" transform="rotate(-90 90 79)"/><text x="90" y="77" text-anchor="middle" font-size="13" fill="#244b50">礦產品</text><text x="90" y="94" text-anchor="middle" font-size="8" fill="#244b50">2014年題圖</text><rect x="16" y="140" width="9" height="9" rx="5" fill="#91ae70"/><text x="97" y="149" text-anchor="middle" font-size="11" fill="#244b50">（國內）81.9%</text><rect x="16" y="159" width="9" height="9" rx="5" fill="#6798ac"/><text x="97" y="168" text-anchor="middle" font-size="11" fill="#244b50">（國外）18.1%</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="sans-serif"><text x="270" y="19" text-anchor="middle" font-size="9" fill="#244b50">從貨種，連回腹地產業</text><rect x="192" y="37" width="156" height="33" rx="5" fill="#f8faf4"/><text x="270" y="50" text-anchor="middle" font-size="8" fill="#244b50">東部腹地</text><text x="270" y="64" text-anchor="middle" font-size="11" fill="#244b50">礦產與相關加工產業</text><path d="M270 73v9m-3-3 3 3 3-3" fill="none" stroke="#819c99"/><rect x="192" y="86" width="156" height="33" rx="5" fill="#f8faf4"/><text x="270" y="99" text-anchor="middle" font-size="8" fill="#244b50">貨物特色</text><text x="270" y="113" text-anchor="middle" font-size="11" fill="#244b50">石材、砂石、水泥等</text><path d="M270 122v9m-3-3 3 3 3-3" fill="none" stroke="#819c99"/><rect x="192" y="135" width="156" height="33" rx="5" fill="#d7e6c8"/><text x="270" y="148" text-anchor="middle" font-size="8" fill="#244b50">本題港口判讀</text><text x="270" y="162" text-anchor="middle" font-size="11" fill="#244b50">花蓮港</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="sans-serif"><text x="450" y="19" text-anchor="middle" font-size="9" fill="#244b50">括號不是自行推論的憑據</text><rect x="373" y="39" width="154" height="34" rx="5" fill="#dbe6d2"/><text x="450" y="52" text-anchor="middle" font-size="8" fill="#244b50">原圖括號</text><text x="450" y="68" text-anchor="middle" font-size="15" fill="#244b50">國內／國外</text><path d="M450 78v9m-3-3 3 3 3-3" fill="none" stroke="#819c99"/><rect x="373" y="94" width="154" height="29" rx="5" fill="#f6e5c5"/><text x="450" y="113" text-anchor="middle" font-size="10" fill="#244b50">圖未註明完整統計口徑</text><text x="450" y="149" text-anchor="middle" font-size="11" fill="#244b50">不能自行斷言原產地</text><text x="450" y="173" text-anchor="middle" font-size="11" fill="#244b50">也不能猜成外貨復出口</text></g></svg>