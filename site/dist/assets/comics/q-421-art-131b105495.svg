<text x="90" y="22" font-size="15">官職透露時代</text><g font-size="16"><rect x="32" y="38" width="116" height="29" rx="5" fill="#d6dfca"/><text x="90" y="59">總督</text><rect x="32" y="76" width="116" height="29" rx="5" fill="#d6dfca"/><text x="90" y="97">警務局長</text><rect x="32" y="114" width="116" height="29" rx="5" fill="#d6dfca"/><text x="90" y="135">臺中州知事</text></g><text x="90" y="166" font-size="14">定位：日治時期</text>
<text x="270" y="22" font-size="15">分清批評與被究責者</text><rect x="204" y="38" width="132" height="32" rx="5" fill="#d4e3c8"/><text x="270" y="60" font-size="16">臺灣民眾黨</text><path d="M270 75V111" stroke="#6f8072" fill="none" marker-end="url(#a)"/><rect x="208" y="82" width="124" height="22" fill="#edf1f6"/><text x="270" y="98" font-size="13">抗議剝削、要求改革</text><rect x="204" y="118" width="132" height="32" rx="5" fill="#e4d6cb"/><text x="270" y="140" font-size="16">殖民當局</text><text x="270" y="172" font-size="12">被要求撤職 ≠ 發表批評者</text>
<text x="450" y="22" font-size="15">不同時代的組織</text><g font-size="13"><rect x="369" y="39" width="162" height="31" rx="5" fill="#e8ddc8"/><text x="450" y="60">1895　臺灣民主國</text><rect x="369" y="83" width="162" height="45" rx="5" fill="#d4e3c8"/><text x="450" y="101">1930　民眾黨抗議</text><text x="450" y="120">霧社事件後的主張</text><rect x="369" y="141" width="162" height="31" rx="5" fill="#e8ddc8"/><text x="450" y="162">1947　二二八處理委員會</text></g></g></svg>