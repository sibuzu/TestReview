<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">第一格兩種都可</text><rect x="59" y="36" width="62" height="34" rx="8" fill="white" stroke="#718c7e"/><text x="90" y="59" font-size="18" font-weight="bold">like</text><path d="M90 74V91M43 91H137M43 91V106M137 91V106" stroke="#718c7e" stroke-width="2" fill="none"/><rect x="5" y="112" width="76" height="37" rx="8" fill="#e8eedf" stroke="#718c7e"/><rect x="99" y="112" width="76" height="37" rx="8" fill="#e8eedf" stroke="#718c7e"/><text x="43" y="136" font-size="15">to draw</text><text x="137" y="136" font-size="15">drawing</text><text x="90" y="172" font-size="11">不要先把 drawing 判錯</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">第二格看整件畫圖活動</text><rect x="10" y="38" width="160" height="48" rx="9" fill="#e8eedf" stroke="#718c7e" stroke-width="2"/><text x="90" y="69" font-size="18" font-weight="bold">drawing pictures</text><path d="M20 94V103H160V94" fill="none" stroke="#718c7e" stroke-width="2"/><text x="90" y="127" font-size="12">本句活動主詞視為單數</text><rect x="48" y="139" width="84" height="31" rx="8" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="161" font-size="22" font-weight="bold" fill="#4b8790">is</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="19" font-size="12">兩格都要正確</text><text x="35" y="40" font-size="11">選項</text><text x="95" y="40" font-size="11">第一格</text><text x="146" y="40" font-size="11">第二格</text><rect x="10" y="48" width="160" height="28" rx="5" fill="#e8eedf" stroke="#718c7e"/><path d="M10 80H170M10 111H170M10 143H170" stroke="#dddccf"/><text x="35" y="67" font-size="14" font-weight="bold">A</text><text x="95" y="67" font-size="12" fill="#4b8790">可</text><text x="146" y="67" font-size="12" fill="#4b8790">可</text><text x="35" y="99" font-size="14" font-weight="bold">B</text><text x="95" y="99" font-size="12" fill="#4b8790">可</text><text x="146" y="99" font-size="12" fill="#a97059">不可</text><text x="35" y="130" font-size="14" font-weight="bold">C</text><text x="95" y="130" font-size="12" fill="#a97059">不可</text><text x="146" y="130" font-size="12" fill="#a97059">不可</text><text x="35" y="162" font-size="14" font-weight="bold">D</text><text x="95" y="162" font-size="12" fill="#4b8790">可</text><text x="146" y="162" font-size="12" fill="#a97059">不可</text></g></svg>
