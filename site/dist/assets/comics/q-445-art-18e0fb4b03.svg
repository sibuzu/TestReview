<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">第一格：否定放哪裡？</text><rect x="10" y="31" width="160" height="54" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="53" font-size="14" font-weight="bold">asked him <tspan fill="#287f9b">not to</tspan></text><text x="90" y="75" font-size="13">叫他不要做</text><text x="90" y="107" font-size="20">≠</text><rect x="10" y="121" width="160" height="46" rx="9" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="141" font-size="14"><tspan font-weight="bold">didn't ask</tspan> him to</text><text x="90" y="159" font-size="12">沒有要求他做</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">本題：直接描述被勸阻的活動</text><rect x="7" y="44" width="166" height="48" rx="10" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="74" font-size="18" font-weight="bold">stay up studying</text><text x="90" y="119" font-size="13">熬夜時持續讀書</text><rect x="34" y="137" width="112" height="29" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="157" font-size="12" fill="#287f9b">本題最佳答案 A</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">別把另一用法教成文法錯</text><rect x="7" y="44" width="166" height="48" rx="10" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="74" font-size="18" font-weight="bold">stay up to study</text><text x="90" y="120" font-size="13">為了讀書而熬夜</text><rect x="26" y="137" width="128" height="29" rx="7" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="157" font-size="12">目的用法可成立</text></g></svg>
