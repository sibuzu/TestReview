<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#718c7e"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">第一格：忙著做</text><rect x="15" y="40" width="150" height="40" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="67" font-size="18" font-weight="bold">be busy + V-ing</text><path d="M90 87V105" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="113" width="160" height="42" rx="9" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="141" font-size="16">busy <tspan font-weight="bold" fill="#287f9b">cleaning</tspan></text><text x="90" y="175" font-size="10">第一格不是 to clean</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">第二格：做完某事</text><rect x="15" y="40" width="150" height="40" rx="9" fill="#e8eedf" stroke="#718c7e"/><text x="90" y="67" font-size="18" font-weight="bold">finish + V-ing</text><path d="M90 87V105" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="113" width="160" height="42" rx="9" fill="#e6edf0" stroke="#4b8790"/><text x="90" y="141" font-size="16">finish <tspan font-weight="bold" fill="#287f9b">mopping</tspan></text><text x="90" y="175" font-size="10">第二格不是 to mop</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">mop 的 -ing 拼字</text><rect x="10" y="43" width="160" height="43" rx="9" fill="white" stroke="#718c7e"/><text x="90" y="71" font-size="21">mop + <tspan fill="#b47a39" font-weight="bold">p</tspan> + ing</text><path d="M90 94V110" stroke="#718c7e" stroke-width="2" marker-end="url(#a)"/><rect x="19" y="118" width="142" height="39" rx="9" fill="#f0e4ce" stroke="#b39863"/><text x="90" y="145" font-size="25" font-weight="bold">mo<tspan fill="#b47a39">pp</tspan>ing</text><text x="90" y="176" font-size="10">先重複字尾 p，再加 ing</text></g></svg>
