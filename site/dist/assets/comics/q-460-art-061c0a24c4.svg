<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#ad8647"/></marker></defs><rect width="1080" height="360" fill="#f7f8ef"/><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">加鹼先消耗H⁺</text><rect x="36" y="72" width="288" height="65" rx="12" fill="#e2eadd" stroke="#8b9d85" stroke-width="2"/><text x="180" y="113" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">H⁺ ＋ OH⁻ → H₂O</text><path d="M180 145V204" fill="none" stroke="#ad8647" stroke-width="3" marker-end="url(#a)"/><rect x="64" y="223" width="232" height="75" rx="12" fill="#e4ecd7" stroke="#8b9d85" stroke-width="2"/><text x="180" y="270" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#405c51">H⁺減少</text><text x="180" y="340" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#405c51">判斷原平衡的擾動</text><g transform="translate(360 0)"><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">向左移動的期間</text><rect x="20" y="98" width="143" height="80" rx="12" fill="#f1dea2" stroke="#8b9d85" stroke-width="2"/><text x="91" y="146" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">CrO₄²⁻</text><rect x="197" y="98" width="143" height="80" rx="12" fill="#f1c998" stroke="#8b9d85" stroke-width="2"/><text x="269" y="146" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">Cr₂O₇²⁻</text><path d="M269 209H93" fill="none" stroke="#ad8647" stroke-width="5" marker-end="url(#a)"/><text x="180" y="252" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#405c51">黃色鉻酸根增加</text><rect x="34" y="281" width="292" height="54" rx="12" fill="#e7eddc" stroke="#8b9d85" stroke-width="2"/><text x="180" y="317" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">正反應速率 ＜ 逆反應速率</text></g><g transform="translate(720 0)"><text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#405c51">時間點不能混用</text><rect x="34" y="66" width="292" height="65" rx="12" fill="#e4eadb" stroke="#8b9d85" stroke-width="2"/><text x="180" y="92" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">原平衡</text><text x="180" y="120" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">正＝逆</text><path d="M180 133V152" fill="none" stroke="#ad8647" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="157" width="292" height="65" rx="12" fill="#f0dfb6" stroke="#8b9d85" stroke-width="2"/><text x="180" y="183" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">移動期間</text><text x="180" y="211" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">正＜逆</text><path d="M180 224V243" fill="none" stroke="#ad8647" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="248" width="292" height="65" rx="12" fill="#e4eadb" stroke="#8b9d85" stroke-width="2"/><text x="180" y="274" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#405c51">新平衡</text><text x="180" y="302" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#405c51">正＝逆</text></g></svg>