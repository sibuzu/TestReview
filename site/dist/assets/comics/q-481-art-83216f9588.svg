<text x="90" y="22" font-size="15">兩個同層次的希望</text><rect x="42" y="37" width="96" height="30" rx="5" fill="#dce4d4"/><text x="90" y="59" font-size="19">hopes</text><path d="M90 69V86H47V104M90 86H134V104" fill="none" stroke="#6b8777"/><rect x="7" y="108" width="80" height="36" rx="5" fill="#c1d6b0"/><rect x="95" y="108" width="78" height="36" rx="5" fill="#c1d6b0"/><text x="47" y="133" font-size="18">to visit</text><text x="134" y="133" font-size="17">(to) try</text><text x="47" y="168" font-size="12">遊不同國家</text><text x="134" y="168" font-size="12">嘗試新食物</text>
