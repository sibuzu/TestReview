<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#7e9d90"/></marker></defs><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="11" fill="#35564e">黎且的計謀，先看目的</text><rect x="8" y="34" width="164" height="27" rx="4" fill="#d9e5ca"/><text x="90" y="51.5" text-anchor="middle" font-size="11" fill="#35564e">孔子治魯有成</text><rect x="8" y="83" width="164" height="27" rx="4" fill="#d9e5ca"/><text x="90" y="100.5" text-anchor="middle" font-size="11" fill="#35564e">齊景公因此憂慮</text><rect x="8" y="132" width="164" height="27" rx="4" fill="#d9e5ca"/><text x="90" y="149.5" text-anchor="middle" font-size="11" fill="#35564e">黎且獻計：使孔子離魯</text><path d="M90 62V80" stroke="#7e9d90" stroke-width="1.5" marker-end="url(#a)"/><path d="M90 111V129" stroke="#7e9d90" stroke-width="1.5" marker-end="url(#a)"/><text x="90" y="177" text-anchor="middle" font-size="8" fill="#35564e">不是光明磊落地廣納人才</text></g><rect x="180" width="180" height="180" fill="#f8f0e0"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#35564e">原文實際敘述的連鎖結果</text><rect x="188" y="31" width="164" height="22" rx="4" fill="#e5ddc7"/><text x="270" y="46.0" text-anchor="middle" font-size="10" fill="#35564e">送女樂給魯哀公</text><path d="M270 54V58" stroke="#7e9d90" stroke-width="1.5" marker-end="url(#a)"/><rect x="188" y="60" width="164" height="22" rx="4" fill="#e5ddc7"/><text x="270" y="75.0" text-anchor="middle" font-size="10" fill="#35564e">哀公樂之，怠於政</text><path d="M270 83V87" stroke="#7e9d90" stroke-width="1.5" marker-end="url(#a)"/><rect x="188" y="89" width="164" height="22" rx="4" fill="#e5ddc7"/><text x="270" y="104.0" text-anchor="middle" font-size="10" fill="#35564e">孔子進諫</text><path d="M270 112V116" stroke="#7e9d90" stroke-width="1.5" marker-end="url(#a)"/><rect x="188" y="118" width="164" height="22" rx="4" fill="#e5ddc7"/><text x="270" y="133.0" text-anchor="middle" font-size="10" fill="#35564e">哀公不聽</text><path d="M270 141V145" stroke="#7e9d90" stroke-width="1.5" marker-end="url(#a)"/><rect x="188" y="147" width="164" height="22" rx="4" fill="#c4d8b3"/><text x="270" y="162.0" text-anchor="middle" font-size="10" fill="#35564e">孔子離魯，前往楚國</text><text x="270" y="178" text-anchor="middle" font-size="8" fill="#35564e">離去，不畫成被官兵強押出境</text></g><rect x="360" width="180" height="180" fill="#ecf0ec"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#35564e">用行為核對人物評語</text><rect x="368" y="31" width="164" height="28" rx="4" fill="#e0e4d8"/><text x="450" y="49.0" text-anchor="middle" font-size="10" fill="#35564e">齊景公：排除，非納才</text><rect x="368" y="64" width="164" height="28" rx="4" fill="#e0e4d8"/><text x="450" y="82.0" text-anchor="middle" font-size="10" fill="#35564e">魯哀公：怠政，非自愛</text><rect x="368" y="97" width="164" height="28" rx="4" fill="#e0e4d8"/><text x="450" y="115.0" text-anchor="middle" font-size="10" fill="#35564e">孔子：進諫，非獨善</text><rect x="368" y="130" width="164" height="28" rx="4" fill="#c4d8b3"/><text x="450" y="148.0" text-anchor="middle" font-size="10" fill="#35564e">黎且：計謀達成 → D</text><text x="450" y="178" text-anchor="middle" font-size="8" fill="#35564e">計謀有效，不等於道德可取</text></g></svg>