<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eff3e9"/><g font-family="Arial,sans-serif"><text x="90" y="20" text-anchor="middle" font-size="9" fill="#244b50">問題是水況改變，仍沿用舊法</text><rect x="21" y="45" width="138" height="37" rx="4" fill="#fafbf8"/><rect x="21" y="74" width="138" height="8" fill="#a9cbd3"/><text x="90" y="59" text-anchor="middle" font-size="9" fill="#244b50">先前：原標記可導</text><rect x="21" y="103" width="138" height="37" rx="4" fill="#fafbf8"/><rect x="21" y="118" width="138" height="22" fill="#a9cbd3"/><text x="90" y="117" text-anchor="middle" font-size="9" fill="#244b50">後來：水已變而益多</text><text x="90" y="165" text-anchor="middle" font-size="10" fill="#244b50">變的是水，未調整的是做法</text></g><rect x="180" width="180" height="180" fill="#edf1f7"/><g font-family="Arial,sans-serif"><text x="270" y="20" text-anchor="middle" font-size="9" fill="#244b50">用渡河失敗，類比照搬古法</text><text x="226" y="39" text-anchor="middle" font-size="9" fill="#244b50">故事</text><text x="314" y="39" text-anchor="middle" font-size="9" fill="#244b50">類比</text><rect x="190" y="48" width="72" height="26" rx="4" fill="#d8e7ce"/><rect x="278" y="48" width="72" height="26" rx="4" fill="#d3e0ea"/><text x="226" y="65" text-anchor="middle" font-size="9" fill="#244b50">水已變</text><text x="314" y="65" text-anchor="middle" font-size="9" fill="#244b50">時勢已變</text><path d="M226 77v7m-3-3 3 3 3-3" fill="none" stroke="#769295"/><path d="M314 77v7m-3-3 3 3 3-3" fill="none" stroke="#769295"/><rect x="190" y="89" width="72" height="26" rx="4" fill="#d8e7ce"/><rect x="278" y="89" width="72" height="26" rx="4" fill="#d3e0ea"/><text x="226" y="106" text-anchor="middle" font-size="9" fill="#244b50">仍循舊標記</text><text x="314" y="106" text-anchor="middle" font-size="9" fill="#244b50">仍照搬古法</text><path d="M226 118v7m-3-3 3 3 3-3" fill="none" stroke="#769295"/><path d="M314 118v7m-3-3 3 3 3-3" fill="none" stroke="#769295"/><rect x="190" y="130" width="72" height="26" rx="4" fill="#d8e7ce"/><rect x="278" y="130" width="72" height="26" rx="4" fill="#d3e0ea"/><text x="226" y="147" text-anchor="middle" font-size="9" fill="#244b50">渡河失敗</text><text x="314" y="147" text-anchor="middle" font-size="9" fill="#244b50">治理不合</text><text x="270" y="174" text-anchor="middle" font-size="9" fill="#244b50">共同點：條件變，做法不變</text></g><rect x="360" width="180" height="180" fill="#faf1e4"/><g font-family="Arial,sans-serif"><text x="450" y="20" text-anchor="middle" font-size="9" fill="#244b50">「豈不悲哉？」是明確批評</text><rect x="369" y="43" width="162" height="24" rx="4" fill="#f7f7f0"/><text x="450" y="59" text-anchor="middle" font-size="8" fill="#244b50">A 不明就裡：不懂內情</text><rect x="369" y="72" width="162" height="24" rx="4" fill="#f7f7f0"/><text x="450" y="88" text-anchor="middle" font-size="8" fill="#244b50">B 不置可否：不表態</text><rect x="369" y="101" width="162" height="24" rx="4" fill="#dce8cb"/><text x="450" y="117" text-anchor="middle" font-size="8" fill="#244b50">C 不敢苟同：不能隨便贊同</text><rect x="369" y="130" width="162" height="24" rx="4" fill="#f7f7f0"/><text x="450" y="146" text-anchor="middle" font-size="8" fill="#244b50">D 不容分說：不許解釋</text><text x="450" y="174" text-anchor="middle" font-size="10" fill="#244b50">提出理由，反對機械照搬</text></g></svg>