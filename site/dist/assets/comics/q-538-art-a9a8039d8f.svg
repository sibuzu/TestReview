<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b8778"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eef3e7"/><path d="M180 0h180v180H180Z" fill="#edf1f7"/><path d="M360 0h180v180H360Z" fill="#f8f0e2"/>
<text x="90" y="22" font-size="15">Tom原本只分一半</text><text x="50" y="61" font-size="18">Tom</text><text x="130" y="61" font-size="18">Sam</text><rect x="15" y="76" width="75" height="42" fill="#bdd5af"/><rect x="90" y="76" width="75" height="42" fill="#d4ddc8"/><text x="52" y="104" font-size="19">50%</text><text x="128" y="104" font-size="19">50%</text><text x="90" y="151" font-size="13">Tom不滿足原本份額</text><text x="90" y="174" font-size="12">回到接近海灘中央</text>
<text x="270" y="22" font-size="15">Tom吸引更多顧客</text><rect x="215" y="40" width="110" height="35" rx="5" fill="#bdd5af"/><text x="270" y="64" font-size="20">Tom</text><g stroke="#6b8778" fill="none"><path d="M229 108L253 79" marker-end="url(#a)"/><path d="M312 108L289 79" marker-end="url(#a)"/></g><rect x="194" y="112" width="70" height="44" rx="5" fill="#dbe3ed"/><rect x="277" y="112" width="70" height="44" rx="5" fill="#dbe3ed"/><text x="229" y="138" font-size="13">原有顧客</text><text x="312" y="131" font-size="12">Sam那側</text><text x="312" y="149" font-size="12">部分顧客</text><text x="270" y="177" font-size="12">客源增加，份額變大</text>
