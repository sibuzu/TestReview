<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f3f7ef"/><g font-family="Noto Sans CJK TC,sans-serif" fill="#28463d" text-anchor="middle"><text x="90" y="19" font-size="13" fill="#28463d" font-weight="bold">等高距相同時</text><text x="90" y="40" font-size="12" fill="#28463d" font-weight="normal">線密：較陡</text><path d="M25 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M43 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M61 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M79 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M97 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M115 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M133 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M151 48V86" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M22 67H151" fill="none" stroke="#243a36" stroke-width="4"/><text x="90" y="108" font-size="12" fill="#28463d" font-weight="normal">線疏：較緩</text><path d="M24 116V154" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M65 116V154" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M106 116V154" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M147 116V154" fill="none" stroke="#9e8865" stroke-width="1.6"/><path d="M22 135H151" fill="none" stroke="#243a36" stroke-width="4"/><text x="90" y="172" font-size="10" fill="#28463d" font-weight="normal">粗線是路線・疏密示意</text><text x="270" y="19" font-size="13" fill="#28463d" font-weight="bold">同高差，比水平距離</text><path d="M205 49L245 84H205Z" fill="#d9e5cb"/><path d="M205 113L335 148H205Z" fill="#d9e5cb"/><path d="M205 49L245 84" fill="none" stroke="#b05a41" stroke-width="3"/><path d="M205 113L335 148" fill="none" stroke="#62834e" stroke-width="3"/><path d="M205 49V84H245" fill="none" stroke="#8a9c87" stroke-width="1" stroke-dasharray="3 2"/><path d="M205 113V148H335" fill="none" stroke="#8a9c87" stroke-width="1" stroke-dasharray="3 2"/><text x="277" y="57" font-size="11" fill="#944b33" font-weight="normal">短 → 較陡</text><text x="277" y="125" font-size="11" fill="#28463d" font-weight="normal">長 → 較緩</text><text x="195" y="71" font-size="9" fill="#28463d" font-weight="normal">高差</text><text x="195" y="135" font-size="9" fill="#28463d" font-weight="normal">相同</text><text x="270" y="172" font-size="10" fill="#28463d" font-weight="normal">側面示意・不是原圖高度</text><text x="450" y="19" font-size="13" fill="#28463d" font-weight="bold">依題幹的顏色規則</text><path d="M372 43H403" fill="none" stroke="#6d9a63" stroke-width="5"/><text x="468" y="48" font-size="12" fill="#28463d" font-weight="normal">綠線：初級</text><path d="M372 81H403" fill="none" stroke="#ba6152" stroke-width="5"/><text x="468" y="86" font-size="12" fill="#28463d" font-weight="normal">紅線：中級</text><path d="M372 119H403" fill="none" stroke="#263934" stroke-width="5"/><text x="468" y="124" font-size="12" fill="#28463d" font-weight="bold">黑線：最陡</text><rect x="374" y="140" width="151" height="31" rx="6" fill="#f6e3cf" stroke="#c29360"/><text x="450" y="160" font-size="12" fill="#28463d" font-weight="bold">新手應避開：甲</text></g></svg>