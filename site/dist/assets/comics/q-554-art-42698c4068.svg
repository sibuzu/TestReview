<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7b947e"/></marker></defs><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#234344"><path d="M0 0h180v180H0Z" fill="#eef3e7"/><path d="M180 0h180v180H180Z" fill="#edf1f7"/><path d="M360 0h180v180H360Z" fill="#f7f0e3"/><text x="90" y="22" font-size="15">原卷第4字母要訂正</text><text x="90" y="47" font-size="13">suger中的e改成a</text><rect x="17" y="58" width="26" height="37" rx="4" fill="#dce4d4"/><text x="30" y="84" font-size="23">s</text><rect x="47" y="58" width="26" height="37" rx="4" fill="#dce4d4"/><text x="60" y="84" font-size="23">u</text><rect x="77" y="58" width="26" height="37" rx="4" fill="#dce4d4"/><text x="90" y="84" font-size="23">g</text><rect x="107" y="58" width="26" height="37" rx="4" fill="#e7d2c8"/><text x="120" y="84" font-size="23">e</text><rect x="137" y="58" width="26" height="37" rx="4" fill="#dce4d4"/><text x="150" y="84" font-size="23">r</text><path d="M108 74L132 74" stroke="#a56f5c" stroke-width="2"/><path d="M120 100V116" stroke="#7b947e" marker-end="url(#a)"/><rect x="107" y="123" width="26" height="35" rx="4" fill="#bdd4ad"/><text x="120" y="148" font-size="23">a</text><text x="90" y="175" font-size="12">其他四個字母保持順序</text><text x="270" y="22" font-size="15">記住sug，再接ar</text><rect x="194" y="51" width="78" height="42" rx="5" fill="#d9e3ec"/><rect x="282" y="51" width="64" height="42" rx="5" fill="#bdd4ad"/><text x="233" y="81" font-size="26">sug</text><text x="314" y="81" font-size="26">ar</text><text x="270" y="130" font-size="22">s-u-g-a-r</text><text x="270" y="163" font-size="14">詞尾-ar，不是-er</text><text x="450" y="22" font-size="15">糖與甜，詞義別混淆</text><rect x="383" y="42" width="134" height="50" rx="5" fill="#d1dfc4"/><text x="450" y="65" font-size="23">sugar</text><text x="450" y="84" font-size="12">名詞：糖</text><rect x="383" y="108" width="134" height="50" rx="5" fill="#e7dbc3"/><text x="450" y="131" font-size="23">sweet</text><text x="450" y="150" font-size="12">形容詞：甜的</text><text x="450" y="176" font-size="12">本題問的是「糖」</text></g></svg>