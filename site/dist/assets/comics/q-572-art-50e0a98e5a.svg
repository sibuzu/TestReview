<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="Noto Sans CJK TC,sans-serif" fill="#234344" text-anchor="middle"><path fill="#eef3e9" d="M0 0h180v180H0Z"/><path fill="#edf1f7" d="M180 0h180v180H180Z"/><path fill="#f5efdf" d="M360 0h180v180H360Z"/><text x="90" y="29" font-size="17">過客們</text><text x="90" y="94" font-size="54">：</text><rect x="9" y="111" width="162" height="27" rx="5" fill="#d3dfc5"/><text x="90" y="130" font-size="11">有東方人、有西方人……</text><text x="90" y="166" font-size="14">引出人物說明</text><text x="270" y="29" font-size="17">人物介紹</text><text x="270" y="94" font-size="54">。</text><rect x="190" y="111" width="160" height="27" rx="5" fill="#d0deeb"/><text x="270" y="130" font-size="13">今天下午的新情況</text><text x="270" y="166" font-size="14">先收束，再開新句</text><text x="450" y="23" font-size="15">B五個空格的順序</text><text x="387" y="47" font-size="11">1</text><rect x="374" y="55" width="27" height="37" rx="4" fill="#e4d9bd"/><text x="387" y="81" font-size="27">：</text><text x="419" y="47" font-size="11">2</text><rect x="406" y="55" width="27" height="37" rx="4" fill="#e4d9bd"/><text x="419" y="81" font-size="27">。</text><text x="451" y="47" font-size="11">3</text><rect x="438" y="55" width="27" height="37" rx="4" fill="#e4d9bd"/><text x="451" y="81" font-size="27">，</text><text x="483" y="47" font-size="11">4</text><rect x="470" y="55" width="27" height="37" rx="4" fill="#d3dfc5"/><text x="483" y="81" font-size="27">、</text><text x="515" y="47" font-size="11">5</text><rect x="502" y="55" width="27" height="37" rx="4" fill="#e4d9bd"/><text x="515" y="81" font-size="27">，</text><text x="450" y="124" font-size="15">B：猜想，……</text><text x="450" y="151" font-size="15">D：猜想──……</text><text x="450" y="175" font-size="12">第四空原印「、」</text></g></svg>