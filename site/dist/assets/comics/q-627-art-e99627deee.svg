<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b47a39"/></marker></defs><rect width="540" height="180" fill="#faf8ef"/>
<g font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="22" font-size="12">先辨主詞與be動詞</text><rect x="10" y="55" width="82" height="38" rx="7" fill="#e8eedf" stroke="#718c7e"/><rect x="98" y="55" width="25" height="38" rx="7" fill="#f0e4ce" stroke="#b47a39"/><rect x="129" y="55" width="41" height="38" rx="7" fill="#e6edf0" stroke="#4b8790"/><text x="51" y="79" font-size="13">The coffee</text><text x="110.5" y="79" font-size="14" font-weight="bold">is</text><text x="149.5" y="79" font-size="13">hot.</text><text x="51" y="119" font-size="11">主詞</text><text x="111" y="119" font-size="11">be</text><text x="150" y="119" font-size="11">形容詞</text><text x="90" y="154" font-size="11">陳述：咖啡是熱的</text></g>
<g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="20" font-size="12">把 is 移到主詞前</text><rect x="10" y="32" width="82" height="32" rx="6" fill="#e8eedf" stroke="#718c7e"/><rect x="98" y="32" width="25" height="32" rx="6" fill="#f0e4ce" stroke="#b47a39"/><rect x="129" y="32" width="41" height="32" rx="6" fill="#e6edf0" stroke="#4b8790"/><text x="51" y="53" font-size="12">The coffee</text><text x="110.5" y="53" font-size="14" font-weight="bold">is</text><text x="149.5" y="53" font-size="13">hot.</text><path d="M110 67C110 84 22 82 22 99" fill="none" stroke="#b47a39" stroke-width="2" marker-end="url(#a)"/><rect x="10" y="105" width="25" height="34" rx="6" fill="#f0e4ce" stroke="#b47a39"/><rect x="41" y="105" width="82" height="34" rx="6" fill="#e8eedf" stroke="#718c7e"/><rect x="129" y="105" width="41" height="34" rx="6" fill="#e6edf0" stroke="#4b8790"/><text x="22.5" y="128" font-size="14" font-weight="bold">Is</text><text x="82" y="128" font-size="12">the coffee</text><text x="149.5" y="128" font-size="13">hot?</text><text x="90" y="164" font-size="11">主詞與hot仍保留</text></g>
<g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#344f47"><text x="90" y="23" font-size="12">最後檢查大小寫與標點</text><rect x="10" y="40" width="160" height="45" rx="9" fill="white" stroke="#718c7e"/><text x="90" y="68" font-size="16" font-weight="bold">Is the coffee hot?</text><rect x="17" y="104" width="62" height="44" rx="8" fill="#f0e4ce" stroke="#b47a39"/><text x="48" y="131" font-size="18" font-weight="bold">is → Is</text><rect x="101" y="104" width="62" height="44" rx="8" fill="#e6edf0" stroke="#4b8790"/><text x="132" y="132" font-size="20" font-weight="bold">. → ?</text><text x="90" y="171" font-size="11">不用再加 do / does</text></g></svg>
