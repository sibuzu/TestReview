<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><g font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#eef4e7"/><text x="90" y="21" font-size="14">側看：同一水平位置</text><path d="M25 145H92V43H157V160H25Z" fill="#d5c6a4"/><path d="M25 145H92V43H157" fill="none" stroke="#786b51" stroke-width="3"/><g stroke="#7c9f91" stroke-dasharray="3 3"><path d="M45 118H92"/><path d="M45 87H92"/><path d="M45 56H92"/></g><g font-size="12"><text x="28" y="122">100</text><text x="28" y="91">200</text><text x="28" y="60">300</text></g><path d="M92 48V140" stroke="#c49c4e" stroke-width="5" opacity=".8"/><text x="136" y="96" font-size="14">崖壁</text><text x="90" y="177" font-size="11">高度變化，投影位置相同</text></g><g transform="translate(180)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#f5f0df"/><text x="90" y="21" font-size="14">俯看：等高線局部重疊</text><g fill="none" stroke="#718c63" stroke-width="2.4"><path id="c100" d="M150 47V143C97 164 25 145 22 100C19 51 86 26 150 47Z"/><path id="c200" d="M150 65V130C108 146 62 133 59 99C56 65 103 45 150 65Z"/><path id="c300" d="M150 82V115C124 128 96 116 96 99C95 80 123 70 150 82Z"/></g><path id="overlap" d="M150 82V115" stroke="#bf9046" stroke-width="6"/><g font-size="12"><text x="40" y="112">100</text><text x="76" y="107">200</text><text x="119" y="103">300</text></g><text x="99" y="175" font-size="11">示意數值，非原題地圖</text></g><g transform="translate(360)" font-family="sans-serif" text-anchor="middle" fill="#294638"><rect width="180" height="180" fill="#edf0f7"/><text x="90" y="22" font-size="14">密集，但沒有重疊</text><g fill="none" stroke="#718c63" stroke-width="2.5"><path d="M58 40Q75 67 66 91T59 145"/><path d="M79 40Q96 67 87 91T80 145"/><path d="M100 40Q117 67 108 91T101 145"/></g><text x="90" y="172" font-size="12">坡陡 ≠ 一定是垂直斷崖</text></g></svg>