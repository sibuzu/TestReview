<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="昨天說會來的語意與said後would come轉述，未表示已來"><rect width="900" height="300" fill="#faf8ed"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;text-anchor:middle;fill:#294c48}.h{font-size:23px;font-weight:700}.w{font-size:26px;font-weight:700}.s{font-size:20px}</style><g id="then"><text x="150" y="32" class="h">昨天：當時說會來</text><text x="150" y="72" class="s">意思示意</text><rect x="27" y="97" width="246" height="68" rx="12" fill="#e0eaf0"/><text x="150" y="140" class="w">I will come.</text><text x="150" y="213" class="w">我將會來</text><text x="150" y="268" class="s">從昨天看，是後來的計畫</text></g><g id="report" transform="translate(300 0)"><text x="150" y="32" class="h">轉述昨天的話</text><rect x="27" y="64" width="246" height="120" rx="12" fill="#e1ebdf"/><text x="150" y="107" class="w">She said she</text><text x="150" y="154" class="w">would come.</text><text x="150" y="230" class="w">will → would</text><text x="150" y="274" class="s">過去觀點的未來</text></g><g id="time" transform="translate(600 0)"><text x="150" y="32" class="h">不是已經來過</text><text x="62" y="91" class="w">昨天</text><text x="238" y="91" class="w">派對時</text><path d="M62 134 H239 M230 126 L240 134 L230 142" stroke="#8b9f87" stroke-width="3" fill="none"/><circle cx="62" cy="134" r="7" fill="#538263"/><circle cx="238" cy="134" r="7" fill="#ae8460"/><text x="66" y="183" class="s">她說會來</text><text x="234" y="183" class="s">尚未現身</text><text x="150" y="231" class="s">計畫：相對昨天的將來</text><text x="150" y="276" class="s">came 不合此處語意</text></g></svg>