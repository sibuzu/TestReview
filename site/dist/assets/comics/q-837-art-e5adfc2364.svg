<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><defs><pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M-1 1L1 -1M0 5L5 0M4 6L6 4" stroke="#7d8c73" stroke-width="1"/></pattern><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#739c8d"/></marker></defs><rect x="0" width="180" height="180" fill="#edf2e8"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="12" fill="#35574e">先讀原圖圖例</text><circle cx="90" cy="49" r="17" fill="#d4e2c7" stroke="#779b82"/><text x="90" y="81" text-anchor="middle" font-size="11" fill="#35574e">圓：各項成本因素</text><rect x="75" y="103" width="30" height="30" fill="#e7e5d7"/><rect x="75" y="103" width="30" height="30" fill="url(#h)" stroke="#718571"/><text x="90" y="154" text-anchor="middle" font-size="10" fill="#35574e">斜線方塊：工廠或生產基地</text><text x="90" y="177" text-anchor="middle" font-size="8" fill="#35574e">先認符號，再比較哪個圓最大</text></g><rect x="180" width="180" height="180" fill="#faf0e1"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#35574e">鮮乳供應，要連到消費者</text><path d="M260 35H280V45L288 53V85H252V53L260 45Z" fill="#fffdf4" stroke="#9ea781" stroke-width="2"/><rect x="259" y="30" width="22" height="7" rx="2" fill="#acc4c0"/><text x="270" y="72" text-anchor="middle" font-size="11" fill="#35574e">鮮乳</text><text x="270" y="112" text-anchor="middle" font-size="13" fill="#35574e">保鮮＋及時配送</text><path d="M270 119V133" stroke="#739c8d" stroke-width="2" marker-end="url(#a)"/><rect x="195" y="139" width="150" height="25" rx="5" fill="#c8d9b8"/><text x="270" y="157" text-anchor="middle" font-size="13" fill="#35574e">消費市場</text><text x="270" y="178" text-anchor="middle" font-size="9" fill="#35574e">本題分類：市場指向</text></g><rect x="360" width="180" height="180" fill="#eaf0e7"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="11" fill="#35574e">D：市場因素較突出</text><path d="M450 73V92M404 107H435M465 107H496" stroke="#7e9688" stroke-width="1.7"/><circle data-factor="市場" cx="450" cy="54" r="18" fill="#bfd6ac" stroke="#759885"/><circle data-factor="技術" cx="395" cy="107" r="8" fill="#bfd6ac" stroke="#759885"/><circle data-factor="資金" cx="505" cy="107" r="8" fill="#bfd6ac" stroke="#759885"/><text x="450" y="31" text-anchor="middle" font-size="11" fill="#35574e">市場</text><text x="395" y="132" text-anchor="middle" font-size="10" fill="#35574e">技術</text><text x="505" y="132" text-anchor="middle" font-size="10" fill="#35574e">資金</text><rect x="435" y="92" width="30" height="30" fill="#e7e5d7"/><rect x="435" y="92" width="30" height="30" fill="url(#h)" stroke="#718571"/><text x="450" y="155" text-anchor="middle" font-size="10" fill="#35574e">工廠／生產基地</text><text x="450" y="178" text-anchor="middle" font-size="8" fill="#35574e">大小只示突出因素，非實際百分比</text></g></svg>