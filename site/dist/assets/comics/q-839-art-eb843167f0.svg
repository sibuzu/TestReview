<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#f8efdf"/><g font-family="sans-serif"><text x="90" y="18" text-anchor="middle" font-size="11" fill="#34554c">比較範圍：東南亞來源</text><rect x="8" y="33" width="164" height="35" rx="4" fill="#e3e0d6"/><text x="90" y="55" text-anchor="middle" font-size="11" fill="#34554c">中國（含港澳）67%</text><text x="90" y="83" text-anchor="middle" font-size="9" fill="#34554c">不納入這一題的東南亞比較</text><rect x="8" y="98" width="164" height="55" rx="4" fill="#c7d9b7"/><text x="90" y="119" text-anchor="middle" font-size="14" fill="#34554c">越南 19%</text><text x="90" y="144" text-anchor="middle" font-size="13" fill="#34554c">印尼 6%</text><text x="90" y="177" text-anchor="middle" font-size="9" fill="#34554c">原文列舉來源，未重算分母</text></g><rect x="180" width="180" height="180" fill="#edf2e7"/><g font-family="sans-serif"><text x="270" y="18" text-anchor="middle" font-size="10" fill="#34554c">東南亞兩來源，同尺度比較</text><text x="206" y="63" text-anchor="middle" font-size="11" fill="#34554c">越南</text><rect data-country="越南" data-percent="19" x="230" y="47" width="95" height="21" fill="#88b183"/><text x="339" y="63" text-anchor="middle" font-size="10" fill="#34554c">19%</text><text x="206" y="107" text-anchor="middle" font-size="11" fill="#34554c">印尼</text><rect data-country="印尼" data-percent="6" x="230" y="91" width="30" height="21" fill="#b9c7ae"/><text x="274" y="107" text-anchor="middle" font-size="10" fill="#34554c">6%</text><path d="M230 125H330" stroke="#9ba894"/><path d="M230 125V129" stroke="#9ba894"/><text x="230" y="142" text-anchor="middle" font-size="9" fill="#34554c">0%</text><path d="M280 125V129" stroke="#9ba894"/><text x="280" y="142" text-anchor="middle" font-size="9" fill="#34554c">10%</text><path d="M330 125V129" stroke="#9ba894"/><text x="330" y="142" text-anchor="middle" font-size="9" fill="#34554c">20%</text><text x="270" y="163" text-anchor="middle" font-size="10" fill="#34554c">分母：全部新住民</text><text x="270" y="178" text-anchor="middle" font-size="8" fill="#34554c">數據沿原題 2024 年底情境</text></g><rect x="360" width="180" height="180" fill="#eaf0ed"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#34554c">先選國名，再回原圖標號</text><rect x="368" y="34" width="164" height="29" rx="4" fill="#d9e4d3"/><text x="450" y="54" text-anchor="middle" font-size="11" fill="#34554c">越南：中南半島東側</text><rect x="368" y="78" width="164" height="29" rx="4" fill="#d9e4d3"/><text x="450" y="98" text-anchor="middle" font-size="10" fill="#34554c">狹長沿海，不是內陸寮國</text><rect x="368" y="128" width="164" height="29" rx="4" fill="#c4d8b3"/><text x="450" y="148" text-anchor="middle" font-size="11" fill="#34554c">原圖丁 → 選 D</text><text x="450" y="119" text-anchor="middle" font-size="14" fill="#34554c">↓</text><text x="450" y="177" text-anchor="middle" font-size="8" fill="#34554c">保留原卷國界圖，不另畫國界</text></g></svg>