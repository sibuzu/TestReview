<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180" role="img" aria-label="新疆在中國西北，棉區較乾燥利用灌溉，自治區不同特別行政區"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#3c829b"/></marker><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:12px;font-weight:600;fill:#2b4d42}.small{font-size:10px;fill:#5e776a}.blue{fill:#2a7395}.line{fill:none;stroke:#3c829b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="540" height="180" fill="#f8faf3"/>
<!-- 1: orientation only, not a new political map -->
<text x="90" y="19" text-anchor="middle">定位：中國西北部</text><circle cx="90" cy="101" r="51" fill="#eaf1e1" stroke="#b6c9aa"/><path d="M90 45V157M34 101H146" stroke="#afc0b5" stroke-width="1.4"/><text x="90" y="42" text-anchor="middle">北</text><text x="90" y="169" text-anchor="middle">南</text><text x="22" y="105">西</text><text x="153" y="105">東</text><path d="M91 101L54 65" class="line" marker-end="url(#a)"/><circle cx="90" cy="101" r="3" fill="#6d8870"/><text x="49" y="53" text-anchor="middle" class="blue">新疆棉區</text><text x="111" y="135" text-anchor="middle" class="small">不是西南</text>
<!-- 2: cotton and irrigation schematic, not measured rainfall or a farm photograph -->
<text x="270" y="19" text-anchor="middle">乾燥少雨，仍可灌溉</text><circle cx="213" cy="45" r="11" fill="#edcc73"/><path d="M213 28V24M213 62V66M196 45H191M230 45H235M201 33L197 29M225 57L229 61" stroke="#d5ac4a" stroke-width="1.5"/><path d="M201 125H341V154H201Z" fill="#e5d8b9"/><path d="M202 143H338" stroke="#6eb5d1" stroke-width="7"/><path d="M270 143V128" class="line" marker-end="url(#a)"/><path d="M274 126V74M274 98L251 80M274 108L298 85" fill="none" stroke="#79924f" stroke-width="3"/><path d="M273 116Q251 112 251 99Q270 99 273 116M275 113Q295 109 300 97Q281 96 275 113" fill="#8ea95e"/>
<path d="M242 81L252 91L262 81M266 70L275 80L284 70M288 85L298 95L307 85" fill="#ae8a5d"/>
<g fill="#fffef5" stroke="#c6c6ae" stroke-width="1"><circle cx="246" cy="76" r="8"/><circle cx="255" cy="73" r="9"/><circle cx="261" cy="79" r="7"/><circle cx="268" cy="64" r="8"/><circle cx="278" cy="62" r="9"/><circle cx="285" cy="68" r="7"/><circle cx="291" cy="80" r="8"/><circle cx="301" cy="77" r="9"/><circle cx="307" cy="83" r="7"/></g><text x="319" y="115" text-anchor="middle" class="small">棉花</text><text x="225" y="118" text-anchor="middle" class="blue">灌溉</text><text x="270" y="174" text-anchor="middle" class="small">關係示意，非實測雨量或農場</text>
<!-- 3: administrative and ethnic pairing, not all residents or proportions -->
<text x="450" y="19" text-anchor="middle">民族與行政區別混淆</text><rect x="374" y="31" width="152" height="52" rx="9" fill="#e0edd5" stroke="#86a06d" stroke-width="1.5"/><text x="450" y="50" text-anchor="middle">新疆・維吾爾族</text><text x="450" y="69" text-anchor="middle" class="blue">自治區</text><rect x="374" y="94" width="152" height="29" rx="7" fill="#fff" stroke="#acbca5"/><text x="450" y="113" text-anchor="middle" class="small">壯族：主要在廣西</text><rect x="374" y="133" width="152" height="28" rx="7" fill="#f7eddb" stroke="#bdaa82"/><text x="450" y="151" text-anchor="middle" class="small">香港、澳門：特別行政區</text><text x="450" y="176" text-anchor="middle" class="small">分類關係，不表示全區同一民族</text></svg>