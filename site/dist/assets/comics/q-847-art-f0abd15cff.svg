<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180">
<rect width="540" height="180" fill="#f4f7ef"/>
<g font-family="Noto Sans CJK TC, sans-serif" text-anchor="middle" fill="#294c42">
<text x="90" y="22" font-size="13" font-weight="700">原子符號的兩個數字</text>
<rect x="20" y="37" width="140" height="86" rx="10" fill="#fff" stroke="#a1b6a0"/>
<text x="59" y="67" font-size="23" fill="#af6b3d" font-weight="700">258</text><text x="59" y="102" font-size="23" fill="#3f7894" font-weight="700">101</text><text x="111" y="95" font-size="39" font-weight="700">Md</text>
<rect x="13" y="133" width="154" height="19" rx="4" fill="#f0dec9"/><text x="90" y="147" font-size="12">A＝258　質量數</text>
<rect x="13" y="156" width="154" height="19" rx="4" fill="#d6e7ef"/><text x="90" y="170" font-size="12">Z＝101　原子序</text>
<text x="270" y="22" font-size="13" font-weight="700">核內粒子的個數</text>
<path d="M198 67V56H342V67" fill="none" stroke="#789579" stroke-width="2"/><text x="270" y="46" font-size="16" font-weight="700">總數 258</text>
<rect x="198" y="77" width="56.37" height="37" fill="#87b7ca"/><rect x="254.37" y="77" width="87.63" height="37" fill="#dfba88"/>
<text x="226" y="102" font-size="16" font-weight="700">101</text><text x="298" y="102" font-size="16" font-weight="700">157</text>
<text x="226" y="133" font-size="13">質子</text><text x="298" y="133" font-size="13">中子</text>
<text x="270" y="164" font-size="18" font-weight="700">258−101＝157</text>
<text x="450" y="22" font-size="13" font-weight="700">中性：正負數量相等</text>
<circle cx="409" cy="75" r="29" fill="#dcecf3" stroke="#79a8bb"/><circle cx="491" cy="75" r="29" fill="#f3e0cb" stroke="#ca9d6c"/>
<text x="409" y="84" font-size="27" fill="#3f7894">＋</text><text x="491" y="84" font-size="27" fill="#af6b3d">−</text>
