<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect x="0" width="180" height="180" fill="#eef3e7"/><g font-family="sans-serif"><text x="90" y="19" text-anchor="middle" font-size="11" fill="#284d4d">一個鈉配一組氫氧根</text><rect x="9" y="42" width="64" height="40" rx="5" fill="#c2d8e2" data-ion="Na" data-charge="1"/><text x="41.0" y="66.0" text-anchor="middle" font-size="18" fill="#284d4d">Na⁺</text><rect x="105" y="42" width="65" height="40" rx="5" fill="#d3e3bb" data-ion="OH" data-charge="-1"/><text x="137.5" y="66.0" text-anchor="middle" font-size="18" fill="#284d4d">OH⁻</text><text x="89" y="68" text-anchor="middle" font-size="16" fill="#284d4d">+</text><text x="90" y="111" text-anchor="middle" font-size="15" fill="#284d4d">(+1)＋(−1)＝0</text><rect x="33" y="131" width="114" height="30" rx="5" fill="#bfd6a8" /><text x="90.0" y="150.0" text-anchor="middle" font-size="20" fill="#284d4d">NaOH</text><text x="90" y="178" text-anchor="middle" font-size="7" fill="#284d4d">配比示意，非分子或晶格形狀</text></g><rect x="180" width="180" height="180" fill="#eaf1f4"/><g font-family="sans-serif"><text x="270" y="19" text-anchor="middle" font-size="10" fill="#284d4d">不能只見OH就加下標2</text><rect x="188" y="35" width="164" height="30" rx="5" fill="#dce7cf" /><text x="270.0" y="54.0" text-anchor="middle" font-size="13" fill="#284d4d">Na⁺：OH⁻＝1：1</text><text x="270" y="83" text-anchor="middle" font-size="20" fill="#284d4d">NaOH</text><rect x="188" y="102" width="164" height="30" rx="5" fill="#c9dce3" /><text x="270.0" y="121.0" text-anchor="middle" font-size="12" fill="#284d4d">Mg²⁺：OH⁻＝1：2</text><text x="270" y="156" text-anchor="middle" font-size="20" fill="#284d4d">Mg(OH)₂</text><text x="270" y="178" text-anchor="middle" font-size="8" fill="#284d4d">先看陽離子電荷，再配平</text></g><rect x="360" width="180" height="180" fill="#faf0e6"/><g font-family="sans-serif"><text x="450" y="18" text-anchor="middle" font-size="10" fill="#284d4d">另外三式都能配成中性</text><rect x="369" y="32" width="162" height="43" rx="5" fill="#e3e7d5" /><text x="450.0" y="57.5" text-anchor="middle" font-size="10" fill="#284d4d"></text><text x="450" y="48" text-anchor="middle" font-size="11" fill="#284d4d">Ca²⁺＋2Cl⁻</text><text x="450" y="67" text-anchor="middle" font-size="15" fill="#284d4d">CaCl₂</text><rect x="369" y="79" width="162" height="43" rx="5" fill="#e3e7d5" /><text x="450.0" y="104.5" text-anchor="middle" font-size="10" fill="#284d4d"></text><text x="450" y="95" text-anchor="middle" font-size="11" fill="#284d4d">Cu²⁺＋SO₄²⁻</text><text x="450" y="114" text-anchor="middle" font-size="15" fill="#284d4d">CuSO₄</text><rect x="369" y="126" width="162" height="43" rx="5" fill="#e3e7d5" /><text x="450.0" y="151.5" text-anchor="middle" font-size="10" fill="#284d4d"></text><text x="450" y="142" text-anchor="middle" font-size="11" fill="#284d4d">Ag⁺＋NO₃⁻</text><text x="450" y="161" text-anchor="middle" font-size="15" fill="#284d4d">AgNO₃</text></g></svg>