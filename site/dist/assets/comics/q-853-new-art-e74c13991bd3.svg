<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="5" fill="#f5f3e9"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">板塊交會的構造背景</text><path d="M2 50L115 110L2 190Z" fill="#d3e3be"/><path d="M198 35L115 110L198 190Z" fill="#d5e7ed"/><path d="M2 50L115 110L198 35" fill="#ead8be"/><path d="M115 110L45 65" stroke="#63867e" stroke-width="2" fill="none"/><path d="M115 110L175 58" stroke="#63867e" stroke-width="2" fill="none"/><path d="M115 110L100 185" stroke="#63867e" stroke-width="2" fill="none"/><text x="98" y="147" font-size="15" text-anchor="middle" fill="#29483e">島弧與群島</text><text x="100" y="185" font-size="10" text-anchor="middle" fill="#29483e">構造概念，非實際板塊圖</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="5" fill="#f5f3e9"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">同面積，陸地分成多塊</text><rect x="20" y="55" width="60" height="60" rx="0" fill="#d4e5c8"/><rect x="114" y="48" width="30" height="30" rx="0" fill="#d4e5c8"/><rect x="156" y="48" width="30" height="30" rx="0" fill="#d4e5c8"/><rect x="114" y="96" width="30" height="30" rx="0" fill="#d4e5c8"/><rect x="156" y="96" width="30" height="30" rx="0" fill="#d4e5c8"/><text x="50" y="142" font-size="12" text-anchor="middle" fill="#29483e">1個大方塊</text><text x="147" y="142" font-size="12" text-anchor="middle" fill="#29483e">4個小方塊</text><text x="100" y="176" font-size="10" text-anchor="middle" fill="#29483e">示意面積相同；非真實島數</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="5" fill="#f5f3e9"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">把各島海岸全部加總</text><rect x="20" y="50" width="60" height="60" rx="0" fill="#d4e5c8"/><rect x="114" y="44" width="30" height="30" rx="0" fill="#d4e5c8"/><rect x="156" y="44" width="30" height="30" rx="0" fill="#d4e5c8"/><rect x="114" y="91" width="30" height="30" rx="0" fill="#d4e5c8"/><rect x="156" y="91" width="30" height="30" rx="0" fill="#d4e5c8"/><path d="M20 50h60v60H20Z M114 44h30v30h-30Z M156 44h30v30h-30Z M114 91h30v30h-30Z M156 91h30v30h-30Z" stroke="#b78546" stroke-width="3" fill="none"/><text x="50" y="145" font-size="12" text-anchor="middle" fill="#29483e">周長 240</text><text x="149" y="145" font-size="12" text-anchor="middle" fill="#29483e">合計 480</text><text x="100" y="177" font-size="10" text-anchor="middle" fill="#29483e">相同單位；幾何概念示意</text></g></svg>