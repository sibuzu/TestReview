<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">左側三線索一起讀</text><rect x="32" y="35" width="116" height="30" rx="8" fill="#e2edd8"/><text x="90" y="56" font-size="14">廣州</text><path d="M90 66V82" stroke="#739279" stroke-width="2"/><rect x="14" y="82" width="152" height="32" rx="8" fill="#e2edd8"/><text x="90" y="104" font-size="13">海陸軍大元帥</text><path d="M90 115V132" stroke="#739279" stroke-width="2"/><rect x="24" y="132" width="132" height="32" rx="8" fill="#cfe2cd"/><text x="90" y="154" font-size="14" font-weight="bold">恢復約法</text><g transform="translate(180)"><text x="90" y="20" font-size="12">護國、護法分開記</text><rect x="7" y="36" width="79" height="120" rx="9" fill="#f4e6d0"/><rect x="94" y="36" width="79" height="120" rx="9" fill="#dbe9d5"/><text x="46" y="65" font-size="16" font-weight="bold">護國</text><text x="133" y="65" font-size="16" font-weight="bold">護法</text><text x="46" y="95" font-size="11.5">反對帝制</text><text x="133" y="95" font-size="11.5">恢復約法</text><text x="46" y="125" font-size="10">1915～1916</text><text x="133" y="125" font-size="10">1917年起</text><text x="90" y="174" font-size="10.5">本題重點是「法」的恢復</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">對立點：哪一個國會？</text><rect x="10" y="35" width="160" height="53" rx="8" fill="#dbe9d5"/><text x="90" y="57" font-size="12" font-weight="bold">孫中山陣營</text><text x="90" y="77" font-size="11">恢復原有約法與國會</text><rect x="10" y="99" width="160" height="53" rx="8" fill="#f4e6d0"/><text x="90" y="121" font-size="12" font-weight="bold">北洋政府陣營</text><text x="90" y="141" font-size="11">另開新國會、追緝孫</text><text x="90" y="173" font-size="11">不是1912年初建民國</text></g></g></svg>