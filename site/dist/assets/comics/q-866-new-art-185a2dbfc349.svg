<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><style>text{font-family:"Noto Sans CJK TC","Noto Sans",sans-serif}</style><g transform="translate(0)"><rect x="1" y="1" width="198" height="198" rx="4" fill="#f5f4ec"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">先逐人辨偏好</text><rect x="15" y="38" width="170" height="28" rx="4" fill="#c9ddc1"/><text x="100" y="57" font-size="12" text-anchor="middle" fill="#29483e">Jenny：supermarket</text><rect x="15" y="74" width="170" height="28" rx="4" fill="#c9ddc1"/><text x="100" y="93" font-size="12" text-anchor="middle" fill="#29483e">Ben：supermarket</text><rect x="15" y="110" width="170" height="28" rx="4" fill="#c9ddc1"/><text x="100" y="129" font-size="12" text-anchor="middle" fill="#29483e">Linda：supermarket</text><rect x="15" y="146" width="170" height="28" rx="4" fill="#eadac4"/><text x="100" y="165" font-size="12" text-anchor="middle" fill="#29483e">Tom：traditional</text></g><g transform="translate(200)"><rect x="1" y="1" width="198" height="198" rx="4" fill="#f5f4ec"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">三條線索指向超市</text><circle cx="35" cy="62" r="8" fill="#91b480"/><path d="M45 62L65 62" stroke="#73928a" stroke-width="2" fill="none"/><text x="124" y="67" font-size="11" text-anchor="middle" fill="#29483e">better</text><circle cx="35" cy="108" r="8" fill="#91b480"/><path d="M45 108L65 108" stroke="#73928a" stroke-width="2" fill="none"/><text x="124" y="113" font-size="11" text-anchor="middle" fill="#29483e">more</text><circle cx="35" cy="154" r="8" fill="#91b480"/><path d="M45 154L65 154" stroke="#73928a" stroke-width="2" fill="none"/><text x="124" y="159" font-size="11" text-anchor="middle" fill="#29483e">more convenient</text></g><g transform="translate(400)"><rect x="1" y="1" width="198" height="198" rx="4" fill="#f5f4ec"/><text x="100" y="20" font-size="13" text-anchor="middle" fill="#29483e">只把符合者放進集合</text><circle cx="49"