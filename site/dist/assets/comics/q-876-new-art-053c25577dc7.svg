<svg xmlns="http://www.w3.org/2000/svg" width="540" height="180" viewBox="0 0 540 180"><rect width="540" height="180" fill="#f8fbf3"/><g font-family="Noto Sans CJK TC,sans-serif" text-anchor="middle" fill="#294d42"><text x="90" y="20" font-size="12">先認題目談的兩地</text><g font-size="10.5"><rect x="5" y="51" width="52" height="45" rx="7" fill="#dbe8d6"/><text x="31" y="78">巴基斯坦</text><rect x="65" y="51" width="50" height="45" rx="7" fill="#eee7d9"/><text x="90" y="78">印度</text><rect x="123" y="51" width="52" height="45" rx="7" fill="#dbe8d6"/><text x="149" y="78">孟加拉</text></g><text x="31" y="42" font-size="10">南亞西部</text><text x="149" y="42" font-size="10">南亞東部</text><text x="90" y="125" font-size="12">兩地曾為同一國家</text><text x="90" y="148" font-size="11">但中間被印度分隔</text><text x="90" y="173" font-size="9.5">位置關係示意，不按比例</text><g transform="translate(180)"><text x="90" y="20" font-size="12">共同的是主要宗教</text><rect x="19" y="40" width="142" height="40" rx="10" fill="#cfe2cd"/><text x="90" y="67" font-size="19" font-weight="bold">伊斯蘭教</text><path d="M90 81V100M47 100H133M47 100V114M133 100V114" fill="none" stroke="#749179" stroke-width="2"/><rect x="8" y="115" width="78" height="31" rx="7" fill="#e5eddd"/><rect x="94" y="115" width="78" height="31" rx="7" fill="#e5eddd"/><text x="47" y="136" font-size="12">巴基斯坦</text><text x="133" y="136" font-size="12">孟加拉</text><text x="90" y="171" font-size="10.5">皆以穆斯林為主要人口</text></g><g transform="translate(360)"><text x="90" y="20" font-size="12">社會條件不等於氣候</text><rect x="14" y="38" width="152" height="47" rx="8" fill="#d9e8d3"/><text x="90" y="60" font-size="13" font-weight="bold">宗教信仰</text><text x="90" y="78" font-size="11">屬於社會、人文條件</text><rect x="14" y="100" width="152" height="47" rx="8" fill="#f2e7d5"/><text x="90" y="122" font-size="13">乾燥、多雨</text><text x="90" y="140" font-size="11">屬於氣候、自然條件</text><text x="90" y="173" font-size="10.5">「均」指主要信仰，非每個人</text></g></g></svg>