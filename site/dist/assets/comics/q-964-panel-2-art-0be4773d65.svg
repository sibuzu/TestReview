<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><title>乙速率2與甲比乙多0.2合成甲2.2的比例條圖</title><rect width="240" height="240" fill="#faf8ef"/><path d="M25 85L210 85" fill="none" stroke="#bcc7c1" stroke-width="1"/><path d="M25 170L210 170" fill="none" stroke="#bcc7c1" stroke-width="1"/><rect x="25" y="55" width="160" height="23" rx="4" fill="#365f9c"/><rect x="25" y="140" width="160" height="23" rx="4" fill="#365f9c"/><rect x="185" y="140" width="16" height="23" rx="3" fill="#b4772d"/><text x="100" y="45" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#284c44">乙：2 m/s</text><text x="120" y="199" font-family="sans-serif" text-anchor="middle" font-size="13" fill="#284c44">甲：2 + 0.2 = 2.2 m/s</text></svg>