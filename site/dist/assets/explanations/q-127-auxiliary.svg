<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" role="img" aria-labelledby="title desc">
 <title id="title">延長DE到T，利用相似三角形求AP比AF</title>
 <desc id="desc">AD平行FT。橘色三角形ADP與綠色三角形FTP相似，AD等於5，FT等於2；AP比PF等於5比2，所以AP比AF等於5比7。</desc>
 <rect width="700" height="510" rx="12" fill="#fafbf5"/>
 <g transform="translate(30 20)">
  <path d="M332.827 42.941H132.827L245.093 283.697Z" fill="#f2d1a0" fill-opacity=".75"/>
  <path d="M210 380H290L245.093 283.697Z" fill="#bbd5b0" fill-opacity=".85"/>
  <g stroke="#304b3b" stroke-width="2.5" fill="none">
   <path d="M332.827 42.941 50 380H490Z M332.827 42.941H132.827L204.269 196.15 M332.827 42.941 210 380"/>
   <path d="M204.269 196.15 290 380" stroke="#a76824" stroke-dasharray="7 5"/>
  </g>
  <g font-family="Georgia,serif" font-size="22" fill="#253d31">
   <text x="337" y="32">A</text><text x="24" y="405">B</text><text x="497" y="405">C</text><text x="108" y="35">D</text><text x="175" y="196">E</text><text x="197" y="405">F</text><text x="281" y="405">T</text><text x="253" y="284">P</text>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#775121">
   <text x="210" y="31">AD＝5</text><text x="75" y="292">BE＝6</text><text x="105" y="367">BF＝4</text><text x="227" y="367">FT＝2</text>
  </g>
 </g>
 <g font-family="sans-serif" fill="#304b3b">
  <text x="544" y="154" font-size="20">AD ∥ FT</text>
  <text x="544" y="196" font-size="18">橘、綠兩三角形</text><text x="544" y="222" font-size="18">相似</text>
  <text x="36" y="457" font-size="21">AP：PF＝5：2</text>
  <text x="36" y="488" font-size="21">AP：AF＝5：(5＋2)＝5：7</text>
 </g>
</svg>
