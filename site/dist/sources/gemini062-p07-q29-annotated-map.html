<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地理第29題｜與那國島遠眺臺灣山脈（原圖含訂正）｜待核對</title><style>body{max-width:1000px;margin:20px auto;padding:0 16px;color:#263d33;font:18px/1.8 sans-serif;background:#f7f8f3}h1{font-size:25px}p{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;height:auto}figure{margin:16px 0}aside{padding:12px;background:#fff4dd;border-radius:8px}a{color:#336b51}</style><h1>地理第29題｜與那國島遠眺臺灣山脈（原圖含訂正）</h1><aside>本題尚未收入完整題庫。紅筆與原印地圖交疊，沒有無提示原圖可用。</aside><p><a href="https://share.gemini.google/lEdStGcomTed" target="_blank" rel="noopener">原AI對話 ↗</a></p><p>「與那國島」是日本國境最西端的島嶼，也是琉球群島中距離臺灣本島最近的島嶼，與宜蘭縣蘇澳鎮東部外海僅約110公里，如圖(六)所示。如果能見度好，從舊蘇花公路就可以看到與那國島；而與那國島的居民也可以在天氣晴朗時，從該島最西端看到臺灣的哪一座山脈？</p><p>(A) 雪山山脈
(B) 中央山脈
(C) 海岸山脈
(D) 玉山山脈</p><h2>目前處理</h2><p>保留原件列單題待核，B紅筆改答及原題四選項全留；不自行復原被覆寫圖線。</p><h2>原卷核對證據</h2><figure><img src="../assets/questions/gemini062-c3b6978a5ad4a0.jpg" alt="原卷局部核對證據"><figcaption>原卷核對證據 1</figcaption></figure><figure><img src="../assets/questions/gemini062-4ead957197b0d4.jpg" alt="原卷局部核對證據"><figcaption>原卷核對證據 2</figcaption></figure></html>
